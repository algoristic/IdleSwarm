@let _mode = mode();

<!-- Mockup `.zoom`, `.zs`: runde Symbole auf einer senkrechten Linie, der aktive Eintrag gelb. -->
<nav
  class="relative rounded-3xl bg-surface pt-4 pr-5 pb-4 pl-3.5 shadow-panel"
  [attr.aria-label]="title"
>
  <span
    class="absolute top-9.5 bottom-9.5 left-8.5 w-1 rounded-xs bg-well"
    aria-hidden="true"
  ></span>
  <ul class="grid gap-5.5">
    @for (entry of modes; track entry) {
      <li>
        <button
          type="button"
          class="group relative flex min-h-11 cursor-pointer touch-manipulation items-center gap-3 text-left text-fg-muted hover:text-fg current:text-fg"
          [attr.aria-current]="entry === _mode ? 'page' : null"
          [attr.data-testid]="'shell.zoom.' + entry"
          (click)="onSelect(entry)"
        >
          <span
            class="relative z-1 grid size-11 shrink-0 place-items-center rounded-full bg-surface-raised inset-shadow-shade transition duration-350 ease-pop group-hover:scale-106 group-current:scale-116 group-current:bg-primary motion-reduce:transition-none"
            aria-hidden="true"
          >
            <svg class="size-7.5" viewBox="0 0 30 30" focusable="false">
              @switch (entry) {
                @case ('map') {
                  <circle cx="15" cy="15" r="13" fill="var(--sw-well)" />
                  <circle cx="15" cy="15" r="8.5" fill="var(--sw-surface-raised)" />
                  <circle cx="15" cy="15" r="4" fill="var(--sw-accent)" />
                  <circle cx="22.5" cy="8" r="2.6" fill="var(--sw-danger)" />
                  <circle cx="7.5" cy="20" r="2" fill="var(--sw-accent)" />
                }
                @case ('scene') {
                  <circle cx="15" cy="16" r="11" fill="var(--sw-unit-drone-shade)" />
                  <circle cx="13.7" cy="14.7" r="9.4" fill="var(--sw-unit-drone)" />
                  <ellipse
                    cx="9.6"
                    cy="10.5"
                    rx="2.4"
                    ry="1.4"
                    fill="var(--sw-fg)"
                    opacity=".6"
                    transform="rotate(-35 9.6 10.5)"
                  />
                  <circle cx="16.5" cy="17" r="3.4" fill="var(--sw-unit-drone-shade)" />
                }
                @case ('gen') {
                  <g fill="none" stroke-linecap="round">
                    <path
                      d="M10 3 C 22 9, 8 21, 20 27"
                      stroke="var(--sw-scene-plankton-violet)"
                      stroke-width="3.2"
                    />
                    <path
                      d="M20 3 C 8 9, 22 21, 10 27"
                      stroke="var(--sw-unit-soldier)"
                      stroke-width="3.2"
                    />
                    <path
                      d="M12 7.5h6M11.5 22.5h7M13 15h4"
                      stroke="var(--sw-primary)"
                      stroke-width="2.4"
                    />
                  </g>
                }
              }
            </svg>
          </span>
          <span class="grid text-sm leading-tight font-extrabold">
            <span>{{ labels[entry] }}</span>
            @if (entry === 'gen') {
              <small
                class="text-xs font-semibold text-fg-muted tabular-nums"
                data-testid="shell.zoom.gen-dna"
                ><ng-container i18n="@@uiShell-zoomBar-dna"
                  >{{ dna() | formatDown }} DNA</ng-container
                ></small
              >
            } @else {
              <small class="text-xs font-semibold text-fg-muted">{{ hints[entry] }}</small>
            }
          </span>
          @if (entry === 'gen' && availableAdaptations() > 0) {
            <!-- Badge oben am Symbol (Mockup `.badge`), wippt ohne reduzierte Bewegung. -->
            <span
              class="zoom-bar__badge absolute -top-1.25 left-7.5 z-2 grid h-4.75 min-w-4.75 place-items-center rounded-full bg-magenta px-1 text-xs font-black text-ink tabular-nums ring-3 ring-surface inset-shadow-shade"
              data-testid="shell.zoom.gen-count"
            >
              <span aria-hidden="true">{{ availableAdaptations() | formatNum }}</span>
              <span
                class="sr-only"
                i18n="@@uiShell-zoomBar-genomeCount"
                >{availableAdaptations(), plural,
                  =1 {eine Adaption verfügbar}
                  other {{{ availableAdaptations() | formatNum }} Adaptionen verfügbar}
                }</span
              >
            </span>
          }
        </button>
      </li>
    }
  </ul>
</nav>
