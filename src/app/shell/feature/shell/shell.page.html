@let mode = facade.mode();
@let layout = facade.layout();
@let world = layout.world;
@let hud = hudFacade.hud();

<main
  class="shell"
  appShellInput
  data-testid="shell.root"
  [attr.data-mode]="mode"
  [style.--ms]="layout.stageSize"
  [modes]="facade.modes()"
  (zoomedWheel)="facade.zoom($event)"
  (pressedShortcut)="onShortcut($event)"
  (zoomedPinch)="facade.zoom($event)"
>
  <!-- Ebenen: Sonar (z = 1), Welt (z = 2), Genom (z = 3); die Kamera fährt per CSS-Übergang. -->
  <div
    class="shell__layer shell__layer--sonar"
    data-testid="shell.layer.map"
    [attr.inert]="mode === 'map' ? null : ''"
  >
    <app-sonar-layer />
  </div>

  <div
    class="shell__layer shell__layer--world"
    data-testid="shell.layer.scene"
    [attr.inert]="mode === 'gen' ? '' : null"
    [style.transform-origin]="world.transformOrigin"
    [style.transform]="world.transform"
    [style.clip-path]="world.clipPath"
    [style.filter]="world.filter"
  >
    <!-- Szene-Canvas (AP 1.4.2): Futterstelle im Zentrum des Viewports, dem Fixpunkt der Kamera. -->
    <app-scene-world class="absolute inset-0" />
    @if (mode === 'map') {
      <!-- Im Kartenmodus ist die Welt der Punkt im Kartenzentrum; der Zurück-Knopf ist der Tastaturweg. -->
      <button
        type="button"
        class="absolute inset-0 cursor-pointer"
        tabindex="-1"
        data-testid="shell.world.back"
        [attr.aria-label]="worldBackLabel"
        (click)="onClickWorld()"
      ></button>
    }
  </div>

  <div
    class="shell__layer shell__layer--genome"
    data-testid="shell.layer.gen"
    [attr.inert]="mode === 'gen' ? null : ''"
  >
    <app-genome-layer />
  </div>

  <!-- Körnung über den Ebenen (z ≤ 3), unter den Overlays (z = 10). -->
  <div class="grain z-4" aria-hidden="true"></div>

  <!--
    Overlays: vollflächige Ebenen ohne Zeiger-Ereignisse, nur im eigenen Modus sichtbar; jedes
    Overlay platziert seine Panels selbst und schaltet dort die Zeiger-Ereignisse frei. Im Querformat
    sind Karte und Genom eine Spalte am rechten Rand, in der Titel und Detailpanel im Fluss stehen.
  -->
  <app-scene-hud
    data-testid="shell.overlay.scene"
    class="pointer-events-none fixed inset-0 z-10 opacity-0 transition-opacity duration-500 mode-scene:opacity-100"
    [active]="mode === 'scene'"
    [attr.inert]="mode === 'scene' ? null : ''"
  />
  <app-sonar-overlay
    data-testid="shell.overlay.map"
    class="pointer-events-none fixed inset-0 z-10 opacity-0 transition-opacity duration-500 mode-map:opacity-100 short:flex short:flex-col short:items-end short:gap-2 short:p-2"
    [active]="mode === 'map'"
    [attr.inert]="mode === 'map' ? null : ''"
  />
  <app-genome-overlay
    data-testid="shell.overlay.gen"
    class="pointer-events-none fixed inset-0 z-10 opacity-0 transition-opacity duration-500 mode-gen:opacity-100 short:flex short:flex-col short:items-end short:gap-2 short:p-2"
    [active]="mode === 'gen'"
    [attr.inert]="mode === 'gen' ? null : ''"
  />

  <!--
    In allen Modi links eine Spalte von oben: Logo mit Ressourcen (Mockup `.res`), Speicherstatus und
    Hinweise, Zoom-Leiste (Mockup `.zoom`). Gestapelt statt mittig, damit sich auch bei niedrigen
    Viewports nichts überdeckt; reicht die Höhe nicht, scrollt die Spalte. Nur die Panels nehmen
    Klicks an. Smartphone (US-08.07): oben eine Kopfzeile mit kompakten Ressourcen, darunter die
    Moduszeile mit kompakter Zoom-Leiste und „← Schwarm“. Querformat (`short:`): eine schmale Spalte
    mit kompakten Ressourcen, Zoom-Leiste und Zurück-Knopf.
  -->
  <div
    class="pointer-events-none fixed top-4 bottom-4 left-4 z-10 flex w-64 flex-col items-start gap-4 overflow-y-auto max-md:inset-x-0 max-md:top-0 max-md:bottom-auto max-md:w-auto max-md:items-stretch max-md:gap-0 max-md:overflow-visible shell__column short:top-2 short:right-auto short:bottom-2 short:left-2 short:w-56 short:items-stretch short:gap-2 short:overflow-y-auto"
  >
    <div class="pointer-events-auto grid w-full gap-2 max-md:gap-0">
      <!-- Smartphone: eine Zeile aus Ressourcen und Zahnrad; sonst das Zahnrad rechts neben dem Logo. -->
      <div
        class="shell__header rounded-3xl bg-surface px-4.5 pt-3.5 pb-4 shadow-panel max-md:flex max-md:min-h-14 max-md:items-center max-md:gap-2 max-md:rounded-t-none max-md:px-4 max-md:py-2 short:block short:min-h-0 short:rounded-3xl short:px-3.5 short:pt-2.5 short:pb-3"
      >
        <div
          class="-mt-1.5 mb-1 flex items-center justify-between gap-2 max-md:contents short:flex"
        >
          <!-- Sichtbar „IDLESWARM“ wie im Mockup `.logo`, vorgelesen „IdleSwarm“; ohne Leerraum im Text. -->
          <!-- prettier-ignore -->
          <h1 class="text-base font-black tracking-widest uppercase max-md:sr-only short:not-sr-only" i18n="@@featureShell-shell-title">Idle<span class="text-primary">Swarm</span></h1>
          <app-settings-button
            class="-mr-1.5 shrink-0 max-md:order-last max-md:mr-0 short:-mr-1.5"
            (clickedOpen)="settingsFacade.openDialog()"
          />
        </div>
        <app-resources-panel class="max-md:min-w-0 max-md:flex-1" />
      </div>
      <app-save-status class="max-md:px-4 short:px-0" />
    </div>

    <!--
      Desktop: ohne eigene Box (Zoom-Leiste in der Spalte, Zurück unten Mitte); Smartphone: Moduszeile;
      Querformat: Zoom-Leiste und Zurück untereinander in der Spalte.
    -->
    <div
      class="contents max-md:flex max-md:items-center max-md:justify-between max-md:gap-2 max-md:px-4 short:flex short:flex-wrap short:items-center short:justify-start short:gap-2 short:px-0"
    >
      <app-zoom-bar
        class="pointer-events-auto shrink-0"
        [mode]="mode"
        [modes]="facade.modes()"
        [dna]="hud.dna"
        [availableAdaptations]="hud.availableAdaptations"
        (selectedMode)="facade.setMode($event)"
      />

      <!-- Karte und Genom: zurück zum Schwarm unten Mitte (Mockup `.back .btn`), auf dem Smartphone in der Moduszeile. -->
      <div
        class="pointer-events-auto fixed bottom-5.5 left-1/2 z-10 -translate-x-1/2 transition-opacity duration-500 mode-scene:pointer-events-none mode-scene:opacity-0 max-md:static max-md:translate-x-0 short:static short:translate-x-0 short:mode-scene:hidden"
        [attr.inert]="mode === 'scene' ? '' : null"
      >
        <button
          type="button"
          class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-5.5 py-2.75 text-sm font-extrabold whitespace-nowrap shadow-button transition duration-200 ease-pop hover:-translate-y-px hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:hover:translate-y-0 motion-reduced:active:translate-y-0 max-md:px-4 short:px-4"
          data-testid="shell.back"
          i18n="@@featureShell-shell-back"
          (click)="facade.setMode('scene')"
        >
          ← <span class="max-md:sr-only short:sr-only">zurück zum </span>Schwarm
        </button>
      </div>
    </div>

    <!--
      Hinweis des Onboardings (US-09.04), nicht modal: ab 768 px unter der Zoom-Leiste in der Spalte,
      auf dem Smartphone mittig zwischen Titel und Aktionsleiste bzw. Sheet; tritt dort zurück,
      solange eine Schublade oder das Sheet offen ist. Querformat: kompakt rechts neben der Spalte, in
      der Szene unter dem Titel (waagerecht), in der Umgebung schmal am unteren Rand
      (`shell.page.css`); tritt bei offener Schublade ebenfalls zurück. Dialoge liegen im Top-Layer
      darüber. `@container`: Die Karte wählt ihr Layout nach der eigenen Breite.
    -->
    <app-onboarding-hint
      class="shell__hint @container w-full max-md:fixed max-md:inset-x-4 max-md:top-1/2 max-md:w-auto max-md:-translate-y-1/2 max-md:data-covered:hidden short:fixed short:top-22 short:right-auto short:w-88 short:translate-y-0 short:data-covered:hidden"
      [mode]="mode"
      [attr.data-covered]="hintCovered() ? '' : null"
      (releasedFocus)="onHintReleasedFocus()"
    />
  </div>
</main>

<!-- Außerhalb von `<main>`: Das Rad im Dialog erreicht die Shell-Eingabe nicht (Top-Layer, ADR-014). -->
<app-return-summary (acknowledgedSummary)="onReturnAcknowledged()" />
<app-settings-dialog />
