@switch (panel()) {
  @case ('export') {
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-4 py-2 text-sm font-extrabold shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      data-testid="settings.back"
      i18n="@@uiSettings-dialogSettingsActions-back"
      (click)="onSelectPanel('main')"
    >
      Zurück
    </button>
  }
  @case ('import') {
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-4 py-2 text-sm font-extrabold shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      data-testid="settings.back"
      i18n="@@uiSettings-dialogSettingsActions-back"
      (click)="onSelectPanel('main')"
    >
      Zurück
    </button>
  }
  @case ('import-confirm') {
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-danger px-4 py-2 font-black text-on-accent shadow-button active:translate-y-0.5 active:shadow-button-pressed motion-reduced:active:translate-y-0"
      data-testid="settings.import.confirm"
      i18n="@@uiSettings-dialogSettingsActions-importConfirm"
      (click)="clickedConfirmImport.emit()"
    >
      Überschreiben
    </button>
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-4 py-2 text-sm font-extrabold shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      data-testid="settings.import.cancel"
      i18n="@@uiSettings-dialogSettingsActions-cancel"
      (click)="onSelectPanel('import')"
    >
      Abbrechen
    </button>
  }
  @case ('reset') {
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-primary px-4 py-2 font-black text-on-accent shadow-button-primary hover:bg-primary-hover active:translate-y-0.5 active:shadow-button-primary-pressed motion-reduced:active:translate-y-0"
      data-testid="settings.reset.export"
      i18n="@@uiSettings-dialogSettingsActions-resetExport"
      (click)="onSelectPanel('export')"
    >
      Vorher exportieren
    </button>
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-4 py-2 text-sm font-extrabold text-danger shadow-button transition duration-200 ease-pop hover:bg-danger hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      data-testid="settings.reset.confirm-1"
      i18n="@@uiSettings-dialogSettingsActions-resetConfirm1"
      (click)="onSelectPanel('reset-confirm')"
    >
      Weiter zum Zurücksetzen
    </button>
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-4 py-2 text-sm font-extrabold shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      data-testid="settings.reset.cancel"
      i18n="@@uiSettings-dialogSettingsActions-cancel"
      (click)="onSelectPanel('main')"
    >
      Abbrechen
    </button>
  }
  @case ('reset-confirm') {
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-danger px-4 py-2 font-black text-on-accent shadow-button active:translate-y-0.5 active:shadow-button-pressed motion-reduced:active:translate-y-0"
      data-testid="settings.reset.confirm-2"
      i18n="@@uiSettings-dialogSettingsActions-resetConfirm2"
      (click)="clickedConfirmReset.emit()"
    >
      Endgültig zurücksetzen
    </button>
    <button
      type="button"
      class="min-h-11 cursor-pointer touch-manipulation rounded-full bg-surface-raised px-4 py-2 text-sm font-extrabold shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      data-testid="settings.reset.cancel"
      i18n="@@uiSettings-dialogSettingsActions-cancel"
      (click)="onSelectPanel('main')"
    >
      Abbrechen
    </button>
  }
}
