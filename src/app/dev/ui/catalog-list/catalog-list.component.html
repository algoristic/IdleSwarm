@for (group of groups(); track group.category) {
  <section [attr.data-testid]="'dev.catalog.category.' + group.category">
    <h2 class="mb-1 px-3 text-xs font-black tracking-widest text-fg-muted uppercase">
      {{ categoryNames[group.category] }}
    </h2>
    <ul class="grid gap-0.5">
      @for (entry of group.entries; track entry) {
        <li>
          <a
            class="block rounded-xl px-3 py-1.5 text-sm font-extrabold hover:bg-panel-2 focus-visible:bg-panel-2 aria-current:bg-panel-3 aria-current:text-accent-cyan"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [routerLink]="['/katalog', entry]"
            [attr.data-testid]="'dev.catalog.entry.' + entry"
            (click)="onSelectEntry(entry)"
          >
            {{ entryNames[entry] }}
          </a>
        </li>
      }
    </ul>
  </section>
}
