@for (group of groups(); track group.category) {
  <section [attr.data-testid]="'dev.catalog.category.' + group.category">
    <h2 class="mb-2 text-xs font-black tracking-widest text-fg-muted uppercase">
      {{ categoryNames[group.category] }}
    </h2>
    <ul class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
      @for (entry of group.entries; track entry) {
        <li>
          <a
            class="block rounded-2xl bg-panel px-3.5 py-3 font-extrabold shadow-raised hover:bg-panel-2 focus-visible:bg-panel-2"
            [routerLink]="['/katalog', entry]"
            [attr.data-testid]="'dev.catalog.entry.' + entry"
          >
            {{ entryNames[entry] }}
          </a>
        </li>
      }
    </ul>
  </section>
}
