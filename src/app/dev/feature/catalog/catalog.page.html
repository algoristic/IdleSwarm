<h1
  class="text-2xl font-semibold"
  i18n="@@featureDev-catalog-title"
  data-testid="dev.catalog.title"
>
  Katalog
</h1>
<form class="mt-3 mb-5" role="search" [formRoot]="searchForm">
  <label
    class="mb-1 block text-xs font-extrabold tracking-wide text-fg-muted uppercase"
    for="dev-catalog-search"
    i18n="@@featureDev-catalog-search-label"
  >
    Suche
  </label>
  <input
    id="dev-catalog-search"
    type="search"
    autocomplete="off"
    class="w-full rounded-2xl bg-canvas px-3.5 py-2.5 text-fg placeholder:text-fg-subtle"
    data-testid="dev.catalog.search"
    [placeholder]="searchPlaceholder"
    [formField]="searchForm.query"
  />
</form>
@let _groups = groups();
@if (_groups.length > 0) {
  <app-catalog-list [groups]="_groups" />
} @else {
  <p class="text-fg-muted" data-testid="dev.catalog.empty" i18n="@@featureDev-catalog-empty">
    Keine Treffer
  </p>
}
