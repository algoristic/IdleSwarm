<ul
  class="flex flex-wrap justify-center gap-x-3.5 gap-y-0.5 text-xs"
  data-testid="genome.legend.branches"
>
  @for (branch of branches; track branch) {
    <li class="inline-flex items-center gap-1.5">
      <span
        class="size-3 rounded-full shadow-shade"
        aria-hidden="true"
        [class]="toneBackgrounds[branch]"
      ></span>
      {{ branchLabels[branch] }}
    </li>
  }
  <li class="inline-flex items-center gap-1.5">
    <span
      class="size-3 rounded-full shadow-shade"
      aria-hidden="true"
      [class]="toneBackgrounds.unique"
    ></span>
    {{ uniqueKindLabel }}
  </li>
</ul>
<ul
  class="mt-1 flex flex-wrap justify-center gap-x-3.5 gap-y-0.5 text-xs text-fg-muted"
  data-testid="genome.legend.statuses"
>
  <li class="inline-flex items-center gap-1.5">
    <svg class="size-3.5" viewBox="-10 -10 20 20" aria-hidden="true">
      <circle class="fill-fg" r="8" />
    </svg>
    {{ statusLabels.evolved }}
  </li>
  <li class="inline-flex items-center gap-1.5">
    <svg class="size-3.5" viewBox="-10 -10 20 20" aria-hidden="true">
      <circle class="fill-cell stroke-fg" r="7" stroke-width="2.5" />
    </svg>
    <ng-container i18n="@@uiGenome-genomeLegend-available"
      >{{ statusLabels.available }} (pulsiert)</ng-container
    >
  </li>
  <li class="inline-flex items-center gap-1.5">
    <svg class="size-3.5" viewBox="-10 -10 20 20" aria-hidden="true">
      <circle class="fill-cell stroke-fg" r="7" stroke-width="2.5" stroke-opacity="0.55" />
    </svg>
    {{ statusLabels['too-expensive'] }}
  </li>
  <li class="inline-flex items-center gap-1.5">
    <svg class="size-3.5" viewBox="-10 -10 20 20" aria-hidden="true">
      <circle
        class="fill-cell stroke-locked-fg"
        r="7"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="1 4"
      />
    </svg>
    {{ statusLabels.locked }}
  </li>
  <li class="inline-flex items-center gap-1.5">
    <svg class="size-3.5" viewBox="-10 -10 20 20" aria-hidden="true">
      <circle
        class="fill-cell stroke-branch-unique"
        r="7"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="1 3.5"
      />
    </svg>
    {{ statusLabels.undiscovered }}
  </li>
</ul>
