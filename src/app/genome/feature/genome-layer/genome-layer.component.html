<div #viewport class="genome-layer__viewport" data-testid="genome.tree.viewport">
  <section
    #stage
    class="genome-layer__stage"
    aria-labelledby="genome-tree-title"
    [style.--genome-tree-min.px]="minSize"
  >
    <h2 id="genome-tree-title" class="sr-only" i18n="@@featureGenome-genomeLayer-title">
      Genom-Baum
    </h2>
    <app-genome-tree
      [tree]="facade.genome().tree"
      [scale]="scale()"
      (selectedEntry)="facade.select($event)"
    />
  </section>
</div>
