@let control = thresholdForm.minutes;
@let showErrors = control().invalid() && (control().touched() || control().dirty());

<label class="inline-flex flex-wrap items-center gap-1.5 text-sm">
  <span i18n="@@uiModel-formStallThreshold-label">Schwelle</span>
  <input
    type="text"
    inputmode="numeric"
    autocomplete="off"
    data-testid="model.stalls.threshold"
    class="w-16 rounded border border-border-control bg-surface-raised px-1.5 py-1 tabular-nums aria-invalid:border-warning"
    [formField]="control"
    [attr.aria-invalid]="showErrors"
  />
  <span i18n="@@uiModel-formStallThreshold-unit">min</span>
</label>
@if (showErrors) {
  @for (error of control().errors(); track error.kind) {
    <p class="text-xs text-warning" data-testid="model.stalls.threshold-error">
      {{ error.message }}
    </p>
  }
}
