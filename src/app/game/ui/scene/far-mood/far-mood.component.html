@let _scene = scene();
@let c = _scene.colors;
<svg:defs>
  <radialGradient [attr.id]="gradientId" cy="35%" r="75%">
    <stop offset="0" [attr.stop-color]="c.light" />
    <stop offset=".55" [attr.stop-color]="c.mid" />
    <stop offset="1" [attr.stop-color]="c.deep" />
  </radialGradient>
  <linearGradient [attr.id]="rayGradientId" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" [attr.stop-color]="c.glow" stop-opacity=".22" />
    <stop offset="1" [attr.stop-color]="c.glow" stop-opacity="0" />
  </linearGradient>
</svg:defs>
<svg:rect x="-1000" y="-1000" width="2000" height="2000" [attr.fill]="fill" />
@for (d of _scene.rays; track $index) {
  <svg:path [attr.d]="d" [attr.fill]="rayFill" />
}
<svg:g [attr.fill]="c.shape">
  @for (d of _scene.shapes.paths; track $index) {
    <path [attr.d]="d" />
  }
  @for (circle of _scene.shapes.circles; track $index) {
    <circle [attr.cx]="circle.cx" [attr.cy]="circle.cy" [attr.r]="circle.r" opacity=".6" />
  }
</svg:g>
<svg:g [attr.fill]="c.light">
  @for (speck of _scene.specks; track $index) {
    <circle [attr.cx]="speck.cx" [attr.cy]="speck.cy" [attr.r]="speck.r" />
  }
</svg:g>
