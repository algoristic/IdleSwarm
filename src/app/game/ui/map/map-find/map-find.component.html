@if (zone() === 'next') {
  <svg:circle r="26" fill="transparent" />
  <svg:circle
    r="18"
    fill="none"
    [attr.stroke]="highlight() === 'target' ? colors.ring.target : colors.ring.nextZoneFind"
    stroke-width="1.6"
    stroke-dasharray="3 4"
  />
  <svg:g app-sparkle-sprite transform="scale(.6)" opacity=".8" />
} @else {
  <svg:circle r="30" fill="transparent" />
  <svg:circle r="24" [attr.fill]="colors.find.outer" />
  <svg:circle r="15.6" [attr.fill]="colors.find.inner" />
  <svg:g app-sparkle-sprite transform="scale(.88)" />
  @if (highlight() === 'target') {
    <svg:circle
      r="30"
      fill="none"
      [attr.stroke]="colors.ring.target"
      stroke-width="1.8"
      stroke-dasharray="4 3"
    />
  }
}
