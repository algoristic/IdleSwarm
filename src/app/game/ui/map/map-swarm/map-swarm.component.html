@let _layout = layout();
@let _motion = motion();
@for (brooder of _layout.brooders; track $index) {
  <svg:g [attr.transform]="brooder.transform">
    <g [attr.transform]="_motion ? null : brooder.startTranslate">
      @if (_motion) {
        <animateTransform
          attributeName="transform"
          type="translate"
          calcMode="spline"
          repeatCount="indefinite"
          [attr.values]="brooder.crawl.translateValues"
          [attr.keyTimes]="brooder.crawl.keyTimes"
          [attr.keySplines]="brooder.crawl.keySplines"
          [attr.dur]="brooder.duration"
          [appSmilBegin]="brooder.begin"
        />
      }
      <g [attr.transform]="_motion ? null : brooder.startRotate">
        @if (_motion) {
          <animateTransform
            attributeName="transform"
            type="rotate"
            calcMode="spline"
            repeatCount="indefinite"
            [attr.values]="brooder.crawl.rotateValues"
            [attr.keyTimes]="brooder.crawl.keyTimes"
            [attr.keySplines]="brooder.crawl.keySplines"
            [attr.dur]="brooder.duration"
            [appSmilBegin]="brooder.begin"
          />
        }
        <g transform="scale(.32)">
          <g
            app-unit-sprite
            [unit]="'brooder'"
            [variant]="brooder.variant"
            detail="reduced"
            [motion]="_motion"
            [phase]="brooder.phase"
            [light]="brooder.light"
          ></g>
        </g>
      </g>
    </g>
  </svg:g>
}
@for (eater of _layout.eaters; track $index) {
  <svg:g [attr.transform]="eater.transform">
    <g [attr.transform]="_motion ? null : eater.startRotate">
      @if (_motion) {
        <animateMotion
          rotate="auto"
          calcMode="linear"
          repeatCount="indefinite"
          [attr.path]="eater.path"
          [attr.keyPoints]="eater.keyPoints"
          [attr.keyTimes]="eater.keyTimes"
          [attr.dur]="eater.duration"
          [appSmilBegin]="eater.begin"
        />
      }
      <g transform="scale(.5)">
        <g>
          @if (_motion) {
            <animateTransform
              attributeName="transform"
              type="translate"
              calcMode="spline"
              repeatCount="indefinite"
              [attr.values]="roll.wobble"
              [attr.keyTimes]="roll.keyTimes"
              [attr.keySplines]="roll.keySplines"
              [attr.dur]="rollDuration"
              [appSmilBegin]="eater.wobbleBegin"
            />
          }
          <g
            app-unit-sprite
            [unit]="'eater'"
            [variant]="eater.variant"
            detail="reduced"
            [motion]="_motion"
            [phase]="eater.phase"
            [light]="eater.light"
          ></g>
        </g>
      </g>
    </g>
  </svg:g>
}
