@let _layout = layout();
@let _motion = motion();
<svg:g [class.map-swarm__swirl]="_motion">
  @for (brooder of _layout.brooders; track $index) {
    <svg:g app-unit-sprite [unit]="'brooder'" [attr.transform]="brooder.transform" />
  }
</svg:g>
@for (eater of _layout.eaters; track $index) {
  <svg:g [attr.transform]="eater.transform">
    <g [attr.transform]="_motion ? null : eater.startTranslate">
      @if (_motion) {
        <animateTransform
          attributeName="transform"
          type="translate"
          calcMode="spline"
          repeatCount="indefinite"
          [attr.values]="eater.crawl.translateValues"
          [attr.keyTimes]="eater.crawl.keyTimes"
          [attr.keySplines]="eater.crawl.keySplines"
          [attr.dur]="eater.duration"
          [attr.begin]="eater.begin"
        />
      }
      <g [attr.transform]="_motion ? null : eater.startRotate">
        @if (_motion) {
          <animateTransform
            attributeName="transform"
            type="rotate"
            calcMode="spline"
            repeatCount="indefinite"
            [attr.values]="eater.crawl.rotateValues"
            [attr.keyTimes]="eater.crawl.keyTimes"
            [attr.keySplines]="eater.crawl.keySplines"
            [attr.dur]="eater.duration"
            [attr.begin]="eater.begin"
          />
        }
        <g transform="scale(.55)">
          <g
            app-unit-sprite
            [unit]="'eater'"
            [variant]="eater.variant"
            detail="reduced"
            [motion]="_motion"
          ></g>
        </g>
      </g>
    </g>
  </svg:g>
}
