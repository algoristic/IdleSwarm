@let c = colors;
@let _affordable = affordable();
@let _motion = motion();

<svg:clipPath [attr.id]="clipId"><circle r="20" /></svg:clipPath>
<svg:circle r="34" fill="transparent" />
@if (selected()) {
  <svg:circle
    class="upgrade-node__selection"
    [class.upgrade-node__selection--moving]="_motion"
    r="28"
    fill="none"
    [attr.stroke]="c.selection"
    stroke-width="2"
    stroke-dasharray="5 6"
  />
}
@if (_affordable) {
  <svg:circle
    class="upgrade-node__pulse"
    [class.upgrade-node__pulse--moving]="_motion"
    r="21"
    fill="none"
    [attr.stroke]="c.pulse"
  />
}
<svg:circle r="20" [attr.fill]="_affordable ? c.body : c.poorBody" />
<svg:g [attr.clip-path]="clipUrl">
  <circle cx="3.5" cy="4.5" r="20" [attr.fill]="_affordable ? c.shade : c.poorShade" />
</svg:g>
<svg:text
  class="tabular-nums"
  y="5.5"
  [attr.fill]="c.rank"
  font-size="17"
  font-weight="900"
  text-anchor="middle"
  data-testid="game.neuron.node.rank"
>
  {{ rank() | formatInteger }}
</svg:text>
