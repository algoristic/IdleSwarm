@let c = colors;
@let _locked = locked();
@let _motion = motion();

<svg:circle r="34" fill="transparent" />
@if (selected()) {
  <svg:circle
    class="chain-node__selection"
    [class.chain-node__selection--moving]="_motion"
    r="28"
    fill="none"
    [attr.stroke]="selectionColor"
    stroke-width="2"
    stroke-dasharray="5 6"
  />
}
@if (affordable()) {
  <svg:circle
    class="chain-node__pulse"
    [class.chain-node__pulse--moving]="_motion"
    r="21"
    fill="none"
    [attr.stroke]="c.pulse"
  />
}
<svg:circle r="20" [attr.fill]="c.body" />
<svg:circle
  r="20"
  fill="none"
  [attr.stroke]="_locked ? c.lockedRing : c.ring"
  stroke-width="3.5"
  [attr.stroke-dasharray]="_locked ? '4 4' : null"
/>
<svg:g [attr.transform]="iconTransform()" [attr.opacity]="_locked ? 0.35 : null">
  <g app-unit-sprite [unit]="unit()"></g>
</svg:g>
<svg:g transform="translate(14.4 14.4)">
  <rect
    x="-11"
    y="-8.5"
    width="22"
    height="17"
    rx="8.5"
    [attr.fill]="_locked ? c.lockedBadge : c.badge"
    [attr.stroke]="c.badgeStroke"
    stroke-width="2.5"
  />
  <text
    class="tabular-nums"
    y="4"
    [attr.fill]="c.rank"
    font-size="11"
    font-weight="900"
    text-anchor="middle"
    data-testid="game.neuron.chainNode.rank"
  >
    {{ _locked ? '–' : (rank() | formatInteger) }}
  </text>
</svg:g>
