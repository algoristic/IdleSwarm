@let c = colors;
@let animated = motion();
<svg:defs>
  <path [attr.id]="shapeId" [attr.d]="amoebaPath">
    @if (animated) {
      <animate
        attributeName="d"
        dur="4s"
        [attr.begin]="begin"
        repeatCount="indefinite"
        [attr.values]="amoebaWave"
      />
    }
  </path>
</svg:defs>
<svg:clipPath [attr.id]="clipId"><use [attr.href]="shapeHref" /></svg:clipPath>
<svg:use
  [attr.href]="shapeHref"
  [attr.fill]="c.rim"
  [attr.stroke]="c.rim"
  stroke-width="1.6"
  stroke-linejoin="round"
/>
<svg:use [attr.href]="shapeHref" [attr.fill]="c.body" />
<svg:g [attr.clip-path]="clipUrl">
  <use [attr.href]="shapeHref" [attr.fill]="c.shade" transform="translate(.8 1.5)" />
</svg:g>
<svg:g transform="translate(-3 .2)">
  <g>
    @if (animated) {
      <animateTransform
        attributeName="transform"
        type="translate"
        dur="7s"
        [attr.begin]="begin"
        repeatCount="indefinite"
        calcMode="spline"
        [attr.values]="nucleus.values"
        [attr.keySplines]="nucleus.keySplines"
      />
    }
    <circle r="2.5" [attr.fill]="c.nucleus" />
    <circle cx="-.6" cy="-.6" r=".9" [attr.fill]="c.nucleolus" />
  </g>
</svg:g>
@for (vacuole of vacuoles; track vacuole.dur) {
  <svg:g [attr.transform]="vacuole.transform">
    <g>
      @if (animated) {
        <animateTransform
          attributeName="transform"
          type="translate"
          [attr.dur]="vacuole.dur"
          [attr.begin]="begin"
          repeatCount="indefinite"
          calcMode="spline"
          [attr.values]="vacuole.path.values"
          [attr.keySplines]="vacuole.path.keySplines"
        />
      }
      <circle [attr.r]="vacuole.r" [attr.fill]="c.vacuole" />
    </g>
  </svg:g>
}
