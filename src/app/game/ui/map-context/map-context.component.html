@let _context = context();

<span class="min-w-0 flex-1 truncate" data-testid="game.ctx.map.text">
  <b class="font-black">{{ zoneNames[_context.zoneId] }}</b>
  <span
    class="ms-1 text-xs font-semibold text-fg-muted tabular-nums"
    i18n="@@uiGame-mapContext-speed"
    >· Tempo {{ _context.speed | formatNumber }} KP/s</span
  >
</span>
<span appTag tone="teal" data-testid="game.ctx.map.tag" i18n="@@uiGame-mapContext-zone"
  >Zone {{ _context.zone | formatInteger }}</span
>
