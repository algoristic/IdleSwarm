@let percent = barPercent();

<div
  class="flex items-center gap-1.25 text-xs font-extrabold tracking-widest text-fg-muted uppercase"
>
  <i [class]="dotClasses()"></i>
  {{ label() }}
  @if (extra(); as extraText) {
    <em
      class="ml-auto min-w-0 truncate text-xs tracking-wide text-fg-subtle tabular-nums not-italic normal-case"
      >{{ extraText }}</em
    >
  }
</div>
<div class="truncate text-lg font-black tabular-nums">
  <ng-content />
</div>
<div
  class="mt-0.5 truncate text-xs leading-none font-extrabold text-fg-subtle tabular-nums empty:hidden"
>
  <ng-content select="[appPillSub]" />
</div>
@if (percent !== null) {
  <div class="mt-1 h-1.25 overflow-hidden rounded-full bg-canvas">
    <span [class]="barClasses()" [style.width.%]="percent"></span>
  </div>
}
