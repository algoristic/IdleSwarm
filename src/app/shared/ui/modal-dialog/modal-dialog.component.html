<!--
  Titelzeile und Aktionen stehen fest, nur der Inhalt dazwischen scrollt. Aktionen kommen über den
  Slot `[dialogActions]`; ohne sie fällt die Fußleiste weg. `open:flex`, weil ein geschlossener
  `<dialog>` sonst nicht mehr verborgen wäre.
-->
<dialog
  #dialog
  class="modal-dialog m-auto w-full max-w-md flex-col overflow-hidden rounded-3xl border-0 bg-surface p-6 text-fg shadow-panel open:flex max-md:mb-0 max-md:max-h-4/5 max-md:max-w-full max-md:rounded-b-none max-md:p-4 short:m-auto short:max-h-11/12 short:max-w-md short:rounded-3xl short:p-4"
  [attr.aria-labelledby]="headingId"
  [attr.data-testid]="testId()"
  (cancel)="onCancel($event)"
  (close)="onClose()"
>
  <div class="mb-4 flex shrink-0 items-start justify-between gap-4 short:mb-2">
    <h2 class="pt-2 text-xl font-black" [id]="headingId">{{ heading() }}</h2>
    <button
      type="button"
      class="size-11 shrink-0 cursor-pointer touch-manipulation rounded-full bg-surface-raised text-xl font-black shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      [attr.aria-label]="closeLabel"
      [attr.data-testid]="testId() + '.close'"
      (click)="onClickClose()"
    >
      <span aria-hidden="true">×</span>
    </button>
  </div>
  <!-- Rand von 0,25rem innen, damit Fokusringe am Rand des Scrollbereichs nicht abgeschnitten werden. -->
  <div class="-m-1 min-h-0 flex-1 overflow-y-auto p-1" [attr.data-testid]="testId() + '.body'">
    <ng-content />
  </div>
  <div
    class="-mx-1 grid shrink-0 gap-2 px-1 pt-4 empty:hidden short:pt-2"
    [attr.data-testid]="testId() + '.actions'"
  >
    <ng-content select="[dialogActions]" />
  </div>
</dialog>
