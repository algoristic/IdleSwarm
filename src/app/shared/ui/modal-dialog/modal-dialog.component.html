<dialog
  #dialog
  class="modal-dialog m-auto w-full max-w-md overflow-y-auto rounded-3xl border-0 bg-surface p-6 text-fg shadow-panel max-md:mb-0 max-md:max-h-4/5 max-md:max-w-full max-md:rounded-b-none max-md:p-4 short:m-auto short:max-h-11/12 short:max-w-md short:rounded-3xl short:p-4"
  [attr.aria-labelledby]="headingId"
  [attr.data-testid]="testId()"
  (cancel)="onCancel($event)"
  (close)="onClose()"
>
  <div class="mb-4 flex items-start justify-between gap-4">
    <h2 class="pt-2 text-xl font-black" [id]="headingId">{{ heading() }}</h2>
    <button
      type="button"
      class="size-11 shrink-0 cursor-pointer touch-manipulation rounded-full bg-surface-raised text-xl font-black shadow-button transition duration-200 ease-pop hover:bg-accent hover:text-on-accent active:translate-y-0.5 active:shadow-button-pressed motion-reduced:transition-none motion-reduced:active:translate-y-0"
      [attr.aria-label]="closeLabel"
      [attr.data-testid]="testId() + '.close'"
      (click)="onClickClose()"
    >
      <span aria-hidden="true">×</span>
    </button>
  </div>
  <ng-content />
</dialog>
