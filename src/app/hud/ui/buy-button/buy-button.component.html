@let _unit = unit();

<!-- Eintrag der Aktionsleiste (Mockup `.act`): Symbol, Anzahl, Name, Preis „+1 · x N“. -->
<button
  type="button"
  class="group flex size-full min-h-11 cursor-pointer touch-manipulation items-center gap-2.5 rounded-2xl bg-well py-2 pr-3 pl-2 text-left max-md:gap-1.5 max-md:px-1.5 transition duration-250 ease-pop hover:enabled:-translate-y-0.75 hover:enabled:bg-surface-raised disabled:cursor-not-allowed motion-reduce:transition-none motion-reduce:hover:enabled:translate-y-0"
  [disabled]="!_unit.affordable"
  [attr.data-testid]="'hud.units.' + _unit.id + '.buy'"
  (click)="onClick()"
>
  <svg
    class="size-10 shrink-0 group-disabled:opacity-50 max-md:size-8"
    viewBox="0 0 42 42"
    aria-hidden="true"
    focusable="false"
  >
    @switch (_unit.id) {
      @case ('queens') {
        <circle cx="21" cy="25" r="13" fill="var(--sw-unit-queen-shade)" />
        <circle cx="19.4" cy="23.4" r="11" fill="var(--sw-unit-queen)" />
        <ellipse
          cx="14.5"
          cy="18"
          rx="3"
          ry="1.7"
          fill="var(--sw-fg)"
          opacity=".55"
          transform="rotate(-35 14.5 18)"
        />
        <circle cx="23" cy="26" r="4" fill="var(--sw-unit-queen-shade)" />
        <circle cx="13.5" cy="11" r="2.8" fill="var(--sw-primary)" />
        <circle cx="21" cy="8.6" r="3.2" fill="var(--sw-primary)" />
        <circle cx="28.5" cy="11" r="2.8" fill="var(--sw-primary)" />
      }
      @case ('drones') {
        <circle cx="20" cy="22" r="11" fill="var(--sw-unit-drone-shade)" />
        <circle cx="18.7" cy="20.7" r="9.4" fill="var(--sw-unit-drone)" />
        <ellipse
          cx="14.6"
          cy="16.5"
          rx="2.4"
          ry="1.4"
          fill="var(--sw-fg)"
          opacity=".6"
          transform="rotate(-35 14.6 16.5)"
        />
        <circle cx="21.5" cy="23.5" r="3.4" fill="var(--sw-unit-drone-shade)" />
        <circle cx="31" cy="13" r="4.5" fill="var(--sw-primary-shade)" />
        <circle cx="30.3" cy="12.3" r="3.6" fill="var(--sw-primary)" />
      }
      @case ('soldiers') {
        <path
          d="M21 6 Q23 6 24.5 9 L34 29 Q35 33 31 33 L11 33 Q7 33 8.5 29 L17.5 9 Q19 6 21 6 Z"
          fill="var(--sw-unit-soldier-shade)"
        />
        <path
          d="M20 7.5 Q22 7.5 23 10 L31.5 28 Q32 31 29 31 L11.5 31 Q8.5 31 9.5 28 L17 10 Q18 7.5 20 7.5 Z"
          fill="var(--sw-unit-soldier)"
        />
        <circle cx="21.5" cy="24" r="3.6" fill="var(--sw-unit-soldier-shade)" />
      }
    }
  </svg>
  <!-- Vorgelesen wird „Name, Anzahl, Preis“; sichtbar steht die Anzahl oben. -->
  <span class="grid leading-tight">
    <span class="text-xs text-fg-muted">{{ name() }}</span>
    <span
      class="order-first text-xl font-black tabular-nums"
      aria-hidden="true"
      [attr.data-testid]="'hud.units.' + _unit.id + '.count'"
      >{{ _unit.count | formatDown }}</span
    >
    <span class="sr-only" i18n="@@uiHud-buyButton-count"
      >Anzahl: {{ _unit.count | formatDown }}</span
    >
    <span
      class="text-xs font-extrabold whitespace-nowrap text-primary tabular-nums group-disabled:text-fg-muted"
      aria-hidden="true"
      [attr.data-testid]="'hud.units.' + _unit.id + '.price'"
      i18n="@@uiHud-buyButton-priceShort"
      >+1 · {{ _unit.price | formatNum }} N</span
    >
    <span class="sr-only" i18n="@@uiHud-buyButton-price"
      >Preis: {{ _unit.price | formatNum }} Nahrung</span
    >
    @if (_unit.queenEffect; as effect) {
      <!--
        Schmal gehalten, damit die Aktionsleiste zwischen Log und Ära passt; auf dem Smartphone nur
        vorgelesen, damit die drei Knöpfe gleich hoch und schmal bleiben.
      -->
      <span
        class="max-w-24 text-xs text-fg-muted max-md:sr-only"
        [attr.data-testid]="'hud.units.' + _unit.id + '.effect'"
        i18n="@@uiHud-buyButton-queenEffect"
        >+{{ effect.eggsPerMin | formatRate }} Eier/min, +{{ effect.space | formatNum }} Platz</span
      >
    }
  </span>
</button>
