<div
  role="progressbar"
  aria-valuemin="0"
  aria-valuemax="100"
  [class]="trackClass()"
  [attr.aria-valuenow]="wholePercent()"
  [attr.aria-valuetext]="valueText()"
  [attr.aria-label]="label()"
>
  <div
    data-testid="hud.meter.fill"
    [class]="fillClass()"
    [attr.data-warning]="warning() ? '' : null"
    [style.width.%]="percent()"
  ></div>
</div>
