<!--
  Ohne Panel direkt über der Szene; nicht klickbar (Mockup `.log`). Unter 1200 px (Tablet,
  Smartphone) und im Querformat nur die zwei neuesten Einträge, auf dem Smartphone und im
  Querformat kleiner.
-->
<section
  class="pointer-events-none text-sm leading-relaxed max-md:text-xs short:text-xs"
  aria-labelledby="log-title"
>
  <h2 id="log-title" class="sr-only" i18n="@@uiHud-eventLog-title">Ereignisse</h2>
  <!--
    Einträge kommen nur bei Ereignissen hinzu, nie mit dem Takt; deshalb darf das Log angesagt
    werden. Die Region steht von Anfang an im DOM.
  -->
  <div role="log" aria-labelledby="log-title" data-testid="hud.log.list">
    <ol class="grid gap-0.5 empty:hidden">
      @for (item of items(); track item.id) {
        <li
          class="event-log__entry text-shadow-hud nth-last-2:opacity-75 nth-last-3:opacity-50 nth-last-4:opacity-30 max-desktop:nth-last-3:hidden max-desktop:nth-last-4:hidden short:nth-last-3:hidden short:nth-last-4:hidden"
          [attr.data-kind]="item.kind"
          data-testid="hud.log.entry"
        >
          <span class="sr-only" data-testid="hud.log.time">{{
            item.playedMs | formatElapsed
          }}</span>
          <span [class]="item.textClass" data-testid="hud.log.text">{{ item.text }}</span>
        </li>
      }
    </ol>
  </div>
  @if (items().length === 0) {
    <p
      class="text-fg-muted text-shadow-hud"
      data-testid="hud.log.empty"
      i18n="@@uiHud-eventLog-empty"
    >
      Noch keine Ereignisse.
    </p>
  }
</section>
