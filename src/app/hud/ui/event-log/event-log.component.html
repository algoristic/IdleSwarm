<section aria-labelledby="log-title">
  <h2 id="log-title" class="text-lg font-semibold" i18n="@@uiHud-eventLog-title">Ereignisse</h2>
  <!--
    Einträge kommen nur bei Ereignissen hinzu, nie mit dem Takt; deshalb darf das Log angesagt
    werden. Die Region steht von Anfang an im DOM.
  -->
  <div role="log" aria-labelledby="log-title" data-testid="hud.log.list">
    <ol class="mt-2 grid gap-1 empty:hidden">
      @for (item of items(); track item.id) {
        <li class="flex flex-wrap gap-x-2 text-sm" data-testid="hud.log.entry">
          <span class="shrink-0 text-fg-muted tabular-nums" data-testid="hud.log.time">{{
            item.playedMs | formatElapsed
          }}</span>
          <span class="min-w-0" data-testid="hud.log.text">{{ item.text }}</span>
        </li>
      }
    </ol>
  </div>
  @if (items().length === 0) {
    <p class="mt-2 text-sm text-fg-muted" data-testid="hud.log.empty" i18n="@@uiHud-eventLog-empty">
      Noch keine Ereignisse.
    </p>
  }
</section>
