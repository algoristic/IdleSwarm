@let summary = facade.returnSummary();

@if (summary) {
  <app-modal-dialog
    testId="hud.return.dialog"
    [open]="true"
    [heading]="heading"
    (closed)="onAcknowledge()"
  >
    <app-dialog-return-summary [summary]="summary" />
    <app-dialog-return-summary-actions dialogActions (clickedContinue)="onAcknowledge()" />
  </app-modal-dialog>
}
