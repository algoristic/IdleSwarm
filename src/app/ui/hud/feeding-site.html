<section aria-labelledby="site-title">
  <header>
    <h2 id="site-title">{{ texts['hud.site.title'] }}</h2>
    <p data-testid="click-yield">{{ clickYield() }}</p>
  </header>

  <button #siteButton type="button" class="site" data-testid="site" (click)="collect($event)">
    {{ texts['hud.site.action'] }}
    <span class="gains" aria-hidden="true">
      @for (gain of floatingGains(); track gain.id) {
        <span
          class="gain"
          data-testid="gain"
          [style.left]="gain.left"
          [style.top]="gain.top"
          (animationend)="removeGain(gain.id)"
          >{{ gain.text }}</span
        >
      }
    </span>
  </button>

  <div class="stock">
    <span>{{ texts['hud.site.stock'] }}</span>
    <span data-testid="stock">{{ stockText() }}</span>
  </div>
  <app-hud-meter
    [percent]="stockPercent()"
    [label]="texts['hud.site.stock']"
    [valueText]="stockText()"
  />

  @if (!empty()) {
    <p class="hint" data-testid="time-left">{{ timeLeft() }}</p>
  }

  <!-- Die Live-Region steht von Anfang an im DOM, damit der Hinweis angesagt wird. -->
  <p class="empty" role="status">
    @if (empty()) {
      {{ texts['hud.site.empty'] }}
    }
  </p>

  @if (empty()) {
    <button type="button" class="renew" data-testid="renew" (click)="renew()">
      {{ texts['hud.site.renew'] }}
    </button>
  }
</section>
