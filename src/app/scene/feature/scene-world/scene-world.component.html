<canvas #canvas class="absolute inset-0 block size-full" aria-hidden="true"></canvas>

<!-- Ereigniszahlen über der Futterstelle; das Log nennt dieselben Ereignisse für Screenreader. -->
<div
  class="pointer-events-none absolute top-1/2 left-1/2 opacity-0 mode-scene:opacity-100"
  aria-hidden="true"
>
  @for (popup of facade.popups(); track popup.id) {
    @if (popup.dna; as dna) {
      <span
        class="scene-world__popup absolute bottom-16 -translate-x-1/2 text-2xl font-black whitespace-nowrap text-violet tabular-nums"
        [class]="popupSlotClasses[popup.slot]"
        data-testid="scene.popup.dna"
        i18n="@@featureScene-sceneWorld-popup-dna"
        >+{{ dna | formatNum }} DNA</span
      >
    } @else {
      <span
        class="scene-world__popup scene-world__popup--find absolute bottom-16 -translate-x-1/2 text-2xl font-black whitespace-nowrap text-scene-food"
        [class]="popupSlotClasses[popup.slot]"
        data-testid="scene.popup.find"
        i18n="@@featureScene-sceneWorld-popup-find"
        >Fund!</span
      >
    }
  }
</div>
