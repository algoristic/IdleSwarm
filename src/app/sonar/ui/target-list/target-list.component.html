<ul class="grid gap-1.5">
  @for (target of targets(); track target.index) {
    <li>
      <button
        type="button"
        class="grid min-h-11 w-full cursor-pointer gap-0.5 rounded-md border border-border-control bg-surface-raised p-2 text-left tabular-nums wrap-anywhere hover:bg-surface current:border-accent current:bg-surface"
        [attr.aria-current]="target.selected ? 'true' : null"
        [attr.data-testid]="'sonar.targets.' + target.index + '.select'"
        (click)="onSelect(target.index)"
      >
        <span class="flex flex-wrap items-baseline justify-between gap-x-3">
          @if (target.details; as details) {
            <span
              class="font-semibold"
              [attr.data-testid]="'sonar.targets.' + target.index + '.type'"
            >
              {{ siteTypeLabels[details.type] }}
            </span>
            <span
              class="text-sm text-fg-muted"
              [attr.data-testid]="'sonar.targets.' + target.index + '.distance'"
              i18n="@@uiSonar-targetList-distance"
              >Distanz {{ details.distance | formatRate }}</span
            >
          } @else {
            <span
              class="font-semibold"
              [attr.data-testid]="'sonar.targets.' + target.index + '.type'"
              >?</span
            >
          }
        </span>
        <span class="flex flex-wrap items-baseline justify-between gap-x-3 text-sm">
          <span
            [class]="verdictTones[target.verdict]"
            [attr.data-testid]="'sonar.targets.' + target.index + '.verdict'"
            >{{ verdictLabels[target.verdict] }}</span
          >
          @if (target.details; as details) {
            <span class="text-fg-muted">
              <ng-container i18n="@@uiSonar-targetList-size"
                >Vorrat {{ details.size | formatDown }}</ng-container
              >
              @if (details.rewardsDna) {
                ·
                <span class="text-violet" i18n="@@uiSonar-targetList-dna"
                  >+{{ details.dna | formatDown }} DNA</span
                >
              }
            </span>
          }
        </span>
        @if (target.strategyChoice) {
          <span
            class="text-sm text-accent"
            [attr.data-testid]="'sonar.targets.' + target.index + '.strategy-choice'"
            >◆ {{ strategyMark }}</span
          >
        }
      </button>
    </li>
  }
</ul>
