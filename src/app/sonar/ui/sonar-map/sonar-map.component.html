@let _map = map();
@let center = _map.center;
@let _layout = layout();
@let _ringLabels = ringLabels();

<svg
  class="mx-auto block aspect-square w-full"
  role="group"
  [attr.viewBox]="_map.viewBox"
  [attr.aria-label]="title"
  data-testid="sonar.map.svg"
>
  <g aria-hidden="true">
    <circle
      class="fill-bg-deep"
      [attr.cx]="center"
      [attr.cy]="center"
      [attr.r]="_map.outerRadius"
    />
    @for (ring of _map.rings; track ring.distance) {
      <circle
        class="fill-surface-raised"
        fill-opacity="0.3"
        [attr.cx]="center"
        [attr.cy]="center"
        [attr.r]="ring.radius"
      />
    }
    @for (spoke of _map.spokes; track $index) {
      <line
        class="stroke-fg"
        stroke-opacity="0.05"
        stroke-width="2"
        [attr.x1]="spoke.from.x"
        [attr.y1]="spoke.from.y"
        [attr.x2]="spoke.to.x"
        [attr.y2]="spoke.to.y"
      />
    }
    <circle
      class="fill-none stroke-accent"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="1 9"
      [attr.cx]="center"
      [attr.cy]="center"
      [attr.r]="_map.range.radius"
      data-testid="sonar.map.range"
    />
    @for (ring of _map.rings; track ring.distance; let i = $index) {
      @if (_layout.ringLabels[i]) {
        <text
          class="sonar-map__label fill-fg-muted tabular-nums"
          [attr.font-size]="_layout.smallSize"
          [attr.x]="_map.labelX"
          [attr.y]="ring.labelY"
        >
          {{ _ringLabels[i] }}
        </text>
      }
    }
    <text
      class="sonar-map__label fill-accent font-semibold tabular-nums"
      [attr.font-size]="_layout.smallSize"
      [attr.x]="_map.labelX"
      [attr.y]="_map.range.labelY"
      data-testid="sonar.map.range-label"
    >
      {{ rangeLabel() }}
    </text>
    <path class="sonar-map__sweep fill-accent" fill-opacity="0.08" [attr.d]="_map.sweep" />

    @if (_map.trail.path; as trailPath) {
      <g data-testid="sonar.map.trail">
        <path
          class="fill-none stroke-violet"
          stroke-opacity="0.7"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="1 8"
          [attr.d]="trailPath"
        />
        @for (point of _map.trail.points; track $index) {
          <circle class="fill-violet" r="5" [attr.cx]="point.x" [attr.cy]="point.y" />
        }
      </g>
    }

    @if (_map.route; as route) {
      <path
        class="sonar-map__route fill-none stroke-warning"
        stroke-width="5"
        stroke-linecap="round"
        [attr.d]="route"
        data-testid="sonar.map.route"
      />
    }
    @if (_map.travel; as travel) {
      <g data-testid="sonar.map.travel">
        <path
          class="sonar-map__route fill-none stroke-warning"
          stroke-width="5"
          stroke-linecap="round"
          [attr.d]="travel.path"
        />
        <circle
          class="fill-warning stroke-bg-deep"
          r="9"
          stroke-width="3"
          [attr.cx]="travel.swarm.x"
          [attr.cy]="travel.swarm.y"
          data-testid="sonar.map.travel.swarm"
        />
      </g>
    }
  </g>

  @for (item of nodes(); track item.node.target.index) {
    @let node = item.node;
    @let target = node.target;
    @let label = item.layout.label;
    <g
      class="group cursor-pointer outline-none data-dim:opacity-60"
      role="button"
      tabindex="0"
      [attr.transform]="node.translate"
      [attr.aria-label]="item.ariaLabel"
      [attr.aria-pressed]="target.selected"
      [attr.data-dim]="node.dimmed ? '' : null"
      [attr.data-testid]="'sonar.map.targets.' + target.index"
      (click)="onSelect(target.index)"
      (keydown.enter)="onKeySelect($event, target.index)"
      (keydown.space)="onKeySelect($event, target.index)"
    >
      <!-- Trefferfläche: mindestens 44 px, unsichtbar; Nachbarn teilen sich überlappende Flächen. -->
      @if (item.layout.hitPath; as hitPath) {
        <path class="fill-bg" fill-opacity="0" [attr.d]="hitPath" />
      }
      <!-- Die Symbole fangen keine Zeiger, sonst träfe eine große Kugel die Fläche des Nachbarn. -->
      <g class="pointer-events-none" [attr.transform]="item.layout.zoom">
        <circle
          class="fill-none stroke-accent opacity-0 group-focus-visible:opacity-100"
          stroke-width="2"
          [attr.r]="node.focusRadius"
        />
        @if (target.selected) {
          <circle
            class="fill-none stroke-warning"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="1 7"
            [attr.r]="node.selectionRadius"
            [attr.data-testid]="'sonar.map.targets.' + target.index + '.selected'"
          />
        }
        <circle
          class="fill-none"
          [class]="verdictStrokes[target.verdict]"
          stroke-opacity="0.3"
          stroke-width="3"
          [attr.r]="node.haloRadius"
        />
        @if (target.details; as details) {
          <g [attr.transform]="node.ballScale">
            <circle [class]="verdictFills[target.verdict]" r="1" />
            <circle class="fill-bg" fill-opacity="0.35" r="1" />
            <circle [class]="verdictFills[target.verdict]" cx="-0.1" cy="-0.1" r="0.86" />
            <ellipse
              class="fill-fg"
              fill-opacity="0.55"
              cx="-0.4"
              cy="-0.42"
              rx="0.22"
              ry="0.13"
              transform="rotate(-35 -0.4 -0.42)"
            />
          </g>
          @if (node.defenseDash; as dash) {
            <circle
              class="fill-none stroke-magenta"
              stroke-width="4"
              stroke-linecap="round"
              transform="rotate(-90)"
              [attr.r]="node.haloRadius"
              [attr.stroke-dasharray]="dash"
            />
          }
        } @else {
          <circle
            class="fill-bg-deep stroke-fg-muted"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-dasharray="1 6"
            [attr.r]="node.radius"
          />
          <text class="fill-fg-muted text-base" text-anchor="middle" y="5" aria-hidden="true">
            ?
          </text>
        }
        @if (target.strategyChoice) {
          <text
            class="sonar-map__label fill-accent text-base"
            text-anchor="middle"
            [attr.y]="node.markY"
            aria-hidden="true"
            [attr.data-testid]="'sonar.map.targets.' + target.index + '.strategy-choice'"
          >
            ◆
          </text>
        }
      </g>
      <!-- Beschriftung außerhalb der Vergrößerung: Lage und Größe aus der Kollisionsvermeidung. -->
      @if (label) {
        <text
          class="sonar-map__label fill-fg font-semibold"
          aria-hidden="true"
          [attr.font-size]="_layout.nameSize"
          [attr.text-anchor]="label.anchor"
          [attr.x]="label.x"
          [attr.y]="label.y"
        >
          {{ item.name }}
        </text>
        @if (label.dnaY !== null) {
          <text
            class="sonar-map__label fill-violet tabular-nums"
            aria-hidden="true"
            [attr.font-size]="_layout.smallSize"
            [attr.text-anchor]="label.anchor"
            [attr.x]="label.x"
            [attr.y]="label.dnaY"
          >
            {{ item.dna }}
          </text>
        }
      }
    </g>
  }

  <g aria-hidden="true" [attr.transform]="_map.here.translate" data-testid="sonar.map.here">
    <circle class="fill-surface-raised" r="16" />
    <circle class="fill-fg" fill-opacity="0.9" cx="-2" cy="-2" r="12" />
    <circle
      class="fill-none stroke-warning"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="1 8"
      [attr.r]="_map.here.radius"
    />
    <text
      class="sonar-map__label fill-fg"
      text-anchor="middle"
      [attr.font-size]="_layout.smallSize"
      [attr.y]="_layout.hereLabelY"
    >
      {{ hereLabel() }}
    </text>
  </g>
</svg>
