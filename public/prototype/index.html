<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f33">
<title>IdleSwarm – Prototyp Winzlinge</title>
<style>
  /* Prototyp des Zeitalters Winzlinge nach Produktspezifikation v8 und Mockup 5d (deckend),
     Ausbau-Ansicht nach Mockup „Ausbau der Kette“, Variante C (zwei Neuronen).
     Eine Datei ohne Framework und ohne externe Abhängigkeiten. Schwarm und Partikel zeichnet ein Canvas (7.2).
     Mit ?messung in der Adresse: Messanzeige, Belastungsstufen, Messlauf und die SVG-Darstellung zum Vergleich. */
  :root {
    --night: #0c0f33;
    --ink: #f6f4ff;
    --muted: #a7aee8;
    --panel: #171d58;
    --panel-2: #212a72;
    --panel-3: #2c368a;
    --cyan: #3ee6e0;
    --pink: #ff4f8b;
    --yellow: #ffd23f;
    --orange: #ff8a3d;
    --lime: #8cf25a;
    --violet: #9b6bff;
    --ease: cubic-bezier(.62, 0, .22, 1);
    --dur: 1s;
    --font: "Avenir Next", "Montserrat", "Nunito", "Futura", "Century Gothic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #05061a; color: var(--ink);
    font: 14px/1.35 var(--font);
    display: flex; justify-content: center;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button[aria-disabled="true"], button:disabled { cursor: default; }
  .num { font-variant-numeric: tabular-nums; }

  .app {
    position: relative; width: 100%; max-width: 430px; height: 100dvh; overflow: hidden; overflow: clip; /* clip: Fokus darf die Fläche nicht verschieben */
    background: var(--night); isolation: isolate;
    user-select: none; -webkit-user-select: none;
  }
  @media (min-width: 600px) {
    body { align-items: center; }
    .app { height: min(900px, 96dvh); border-radius: 36px; box-shadow: 0 30px 80px rgb(0 0 0 / .7); }
  }

  /* ---------- Tiefenebenen ---------- */
  .layer {
    position: absolute; left: 50%; top: 40%; width: 0; height: 0;
    transform-origin: 0 0;
    transition: transform var(--dur) var(--ease), filter var(--dur) var(--ease), opacity var(--dur) var(--ease);
    will-change: transform, filter, opacity;
    pointer-events: none;
  }
  .layer > svg { position: absolute; display: block; overflow: visible; }
  .layer--far > svg { left: -1000px; top: -1000px; }
  .layer--map > svg { left: -1000px; top: -1000px; }
  .layer--main > svg { left: -450px; top: -450px; }
  .layer--neuron > svg { left: -500px; top: -560px; }

  .app { --px: 0px; --py: 0px; }
  .app[data-view="main"] .layer--far    { transform: translate(0px, 0px) scale(2.2); filter: blur(5px) brightness(.5); opacity: 0; }
  .app[data-view="main"] .layer--map    { transform: translate(0px, 0px) scale(2); filter: blur(2.6px) brightness(.7); opacity: 0; }
  .app[data-view="main"] .layer--main   { transform: translate(0px, 0px) scale(1); filter: blur(0) brightness(1); opacity: 1; }
  .app[data-view="main"] .layer--neuron { transform: scale(.05); filter: blur(3px) brightness(1); opacity: 0; }
  .app[data-view="map"] .layer--far     { transform: translate(calc(var(--px) * .35), calc(var(--py) * .35)) scale(1.15); filter: blur(4px) brightness(.95); opacity: 1; }
  .app[data-view="map"] .layer--haze    { transform: translate(calc(var(--px) * .65), calc(var(--py) * .65)) scale(1.05); filter: blur(1.5px); opacity: 1; }
  .app[data-view="main"] .layer--haze   { transform: scale(2); opacity: 0; }
  .app[data-view="neuron"] .layer--haze { transform: scale(8); opacity: 0; }
  .layer--haze > svg { left: -1000px; top: -1000px; }
  .app[data-view="map"] .layer--map     { transform: translate(var(--px), var(--py)) scale(1); filter: blur(0) brightness(1); opacity: 1; pointer-events: auto; }
  .app[data-view="map"] .layer--main    { transform: translate(var(--px), var(--py)) scale(.135); filter: blur(1px) brightness(1); opacity: 0; }
  .app[data-view="map"] .layer--neuron  { transform: scale(.004); opacity: 0; }
  .app[data-view="neuron"] .layer--far    { transform: translate(0px, 0px) scale(9); filter: blur(4px) brightness(1); opacity: 0; }
  .app[data-view="neuron"] .layer--map    { transform: translate(0px, 0px) scale(7.8); filter: blur(3px) brightness(1); opacity: 0; }
  .app[data-view="neuron"] .layer--main   { transform: translate(0px, 0px) scale(5); filter: blur(3px) brightness(1); opacity: 0; }
  .app[data-view="neuron"] .layer--neuron { transform: translate(var(--px), var(--py)) scale(var(--nsc, 1)); filter: blur(0) brightness(1); opacity: 1; pointer-events: auto; }

  .app[data-view="map"], .app[data-view="neuron"] { touch-action: none; cursor: grab; }
  .app.panning { cursor: grabbing; }
  .app.panning .layer { transition: none !important; }

  .map-only { transition: opacity calc(var(--dur) * .6) ease; }
  .app[data-view="main"] .map-only, .app[data-view="neuron"] .map-only { opacity: 0; }
  .app[data-view="map"] .map-only { transition-delay: calc(var(--dur) * .45); }

  .app.no-anim .layer, .app.no-anim .sheet, .app.no-anim .ctx > *, .app.no-anim .map-only, .app.no-anim .views__btn { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .layer { transition: opacity .3s linear; }
    .swim, .bob, .sig, .node__pulse, .cnode__pulse, .drift, .drift--fast, .node__sel, .swirl, .route, .paddle, .roll, .ray, .site-out, .site-in, .bg-in { animation: none !important; }
    .node__pulse { stroke-width: 0; }
  }

  /* ---------- Bewegung ---------- */
  .swim { animation: swim 3.2s ease-in-out infinite alternate; }
  .swim--2 { animation-duration: 2.6s; }
  .swim--3 { animation-duration: 3.8s; }
  /* Fresslinge: eigene kleine Kreisbahn je Figur mit kurzem Zurückweichen (Fluchtreaktion), Rollen um die Längsachse */
  .paddle { animation: paddle 10s infinite; }
  .paddle--rev { animation-direction: reverse; }
  @keyframes paddle {
    0% { transform: rotate(0deg); animation-timing-function: ease-in-out; }
    64% { transform: rotate(235deg); animation-timing-function: ease-out; }
    69% { transform: rotate(222deg); animation-timing-function: ease-in-out; }
    75% { transform: rotate(226deg); animation-timing-function: ease-in-out; }
    100% { transform: rotate(360deg); }
  }
  .roll { animation: roll 1s ease-in-out infinite; }
  @keyframes roll { 0%, 100% { transform: rotate(-3deg) scaleY(1); } 50% { transform: rotate(3deg) scaleY(.74); } }
  @keyframes swim { from { transform: translate(-2px, 1px) rotate(-6deg); } to { transform: translate(3px, -1px) rotate(7deg); } }
  .bob { animation: bob 5s ease-in-out infinite alternate; }
  .bob--2 { animation-duration: 6.5s; }
  .bob--3 { animation-duration: 4.2s; }
  @keyframes bob { from { transform: translate(-3px, -2px) scale(.97); } to { transform: translate(3px, 2px) scale(1.03); } }
  .swirl { animation: swirl 140s linear infinite; }
  .swirl--map { animation-duration: 60s; }
  .swirl--fast { animation-duration: 40s; }
  @keyframes swirl { to { transform: rotate(360deg); } }
  .drift { animation: drift 18s ease-in-out infinite alternate; }
  .drift--fast { animation: driftFast 2.4s linear infinite; }
  @keyframes drift { to { transform: translate(14px, -22px); } }
  @keyframes driftFast { from { transform: translate(0, -60px); } to { transform: translate(0, 60px); } }
  /* Wanderung: die alte Stelle zieht nach hinten weg, die neue kommt von vorn */
  .site-out { animation: siteOut 1.6s var(--ease) forwards; }
  .site-in { animation: siteIn 1.4s var(--ease) both; }
  @keyframes siteOut { to { transform: translate(var(--ox), var(--oy)) scale(.6); opacity: 0; } }
  @keyframes siteIn { from { transform: translate(var(--ix), var(--iy)) scale(.5); opacity: 0; } }
  .bg-in { animation: bgIn 1.2s ease both; }
  @keyframes bgIn { from { opacity: 0; } }
  .ray { animation: ray 9s ease-in-out infinite alternate; transform-origin: 0 -900px; }
  @keyframes ray { from { transform: rotate(-4deg); opacity: .5; } to { transform: rotate(4deg); opacity: 1; } }
  .trek { transition: transform .8s var(--ease); }

  /* ---------- Neuron ---------- */
  .twig { fill: none; stroke: #6d2668; stroke-width: 3; stroke-linecap: round; }
  .twig--term { stroke: #d64484; stroke-width: 4; }
  .dend { fill: none; stroke: #ff4f8b; stroke-width: 11; stroke-linecap: round; }
  .dend--glow { stroke: #4a1c64; stroke-width: 30; }
  .dend--core { stroke: #ff9cc4; stroke-width: 3.5; }
  .axon { fill: none; stroke: #ff4f8b; stroke-width: 8; stroke-linecap: round; }
  .axon--glow { stroke: #4a1c64; stroke-width: 26; }
  .sig { fill: none; stroke: #8ffcff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 24; }
  .sig--in { animation: sigIn 1.4s linear infinite; }
  .sig--out { animation: sigOut 1.4s linear infinite; }
  @keyframes sigIn { to { stroke-dashoffset: 26; } }
  @keyframes sigOut { to { stroke-dashoffset: -26; } }
  .bead { fill: var(--yellow); }
  .bead--next { fill: #8a3a5c; stroke: var(--yellow); stroke-width: 1.8; stroke-dasharray: 2.4 2; }
  .node { cursor: pointer; }
  .node__hit { fill: transparent; }
  .node__body { fill: #ffe98a; }
  .node__shade { fill: var(--yellow); }
  .node--poor .node__body { fill: #8f7fb8; }
  .node--poor .node__shade { fill: #6c5c9c; }
  .node__pulse { fill: none; stroke: var(--yellow); stroke-width: 3; transform-origin: 0 0; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); stroke-width: 3; } to { transform: scale(1.7); stroke-width: 0; } }
  .node__rank { fill: #1a1440; font: 900 17px var(--font); text-anchor: middle; }
  .node__sel { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 5 6; transform-origin: 0 0; animation: swirl 12s linear infinite; }
  .n-name { fill: #fff; font: 800 12.5px var(--font); text-anchor: middle; letter-spacing: .06em; text-transform: uppercase; paint-order: stroke; stroke: #1a0b3d; stroke-width: 4px; }
  .n-cost { fill: var(--yellow); font: 700 11.5px var(--font); text-anchor: middle; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: #1a0b3d; stroke-width: 4px; }
  .n-cost--poor { fill: #b7a2e8; }
  .n-name--l, .n-cost--l { text-anchor: start; }
  .myel { fill: #34207a; }
  .myel--on { fill: var(--orange); }
  .myel--next { fill: #34207a; stroke: var(--yellow); stroke-width: 1.6; stroke-dasharray: 3 2.5; }
  .ranvier { fill: #1a0b3d; stroke: #ff9cc4; stroke-width: 1.6; }
  .ranvier--on { fill: var(--cyan); stroke: none; }
  .n-mile { fill: #e9dcff; font: 800 11px var(--font); text-anchor: end; paint-order: stroke; stroke: #1a0b3d; stroke-width: 3px; }
  .n-mile--on { fill: var(--cyan); }
  .n-mile--sub { font-weight: 600; font-size: 10px; fill: #b7a2e8; }
  .org { fill: #542b53; }
  .org__mid { fill: #733c4f; }
  .org__in { fill: none; stroke: #a4655e; stroke-width: 3; stroke-linecap: round; }
  /* Ketten-Neuron (P1-AUS-05): Orange für Ausbauten, die mit Einheiten bezahlt werden */
  .soma-hit, .cnode { cursor: pointer; }
  .cdend { fill: none; stroke: var(--orange); stroke-width: 11; stroke-linecap: round; }
  .cdend--glow { stroke: #4f2147; stroke-width: 30; }
  .cdend--core { stroke: #ffd0a8; stroke-width: 3.5; }
  .cdend--locked { stroke: #5d3f8f; stroke-dasharray: 2 9; }
  .kaxon { stroke-width: 8; }
  .syn { fill: var(--orange); stroke: #4f2147; stroke-width: 6; }
  .syn__in { fill: #ffd0a8; }
  .syn__lab { text-anchor: middle; }
  .kn__title { fill: #ffb27a; }
  .cnode__body { fill: #2a1462; }
  .cnode__ring { fill: none; stroke: var(--orange); stroke-width: 3.5; }
  .cnode__pulse { fill: none; stroke: var(--orange); stroke-width: 3; transform-origin: 0 0; animation: pulse 2.2s ease-out infinite; }
  .cnode__badge { fill: var(--yellow); stroke: #1a0b3d; stroke-width: 2.5; }
  .cnode__rank { fill: #1a1440; font: 900 11px var(--font); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .cnode--locked .cnode__ring { stroke: #8a6cc8; stroke-dasharray: 4 4; }
  .cnode--locked .cnode__icon { opacity: .35; }
  .cnode--locked .cnode__badge { fill: #5d4a95; }
  .c-cost { fill: #ffb27a; }

  /* ---------- Umgebung (Koordinaten in Pixeln, Ursprung am Schwarm) ---------- */
  .m-label { fill: var(--ink); font: 800 12px var(--font); paint-order: stroke; stroke: #0c0f33; stroke-width: 3.6px; stroke-linejoin: round; text-anchor: middle; }
  .m-meta { fill: var(--muted); font: 700 10.5px var(--font); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: #0c0f33; stroke-width: 3.4px; stroke-linejoin: round; text-anchor: middle; }
  .m-gold { fill: var(--yellow); }
  .m-teal { fill: var(--cyan); }
  .m-pink { fill: #ffa3c2; }
  .m-deep { fill: #8f97d8; }
  .m-ring { font: 800 9.5px var(--font); fill: var(--cyan); }
  .m-label, .m-meta, .m-ring { pointer-events: none; }
  .m-site { cursor: pointer; }
  .m-site--dead { opacity: .35; }
  .route { fill: none; stroke: var(--yellow); stroke-width: 3; stroke-linecap: round; stroke-dasharray: .1 7.5; animation: route 1.2s linear infinite; }
  .route--auto { stroke: var(--cyan); opacity: .7; }
  @keyframes route { to { stroke-dashoffset: -7.6; } }

  /* ---------- Bedienoberfläche ---------- */
  .hud { position: absolute; z-index: 5; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: grid; grid-template-columns: 1.4fr 1fr 1.1fr; gap: 6px; }
  .pill { background: #171d58; border-radius: 16px; padding: 7px 11px 8px; box-shadow: 0 4px 0 #080a26; min-width: 0; }
  .pill__k { font-size: 9.5px; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: .1em; }
  .pill__k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .pill__k em { margin-left: auto; font-style: normal; letter-spacing: .02em; text-transform: none; font-size: 10.5px; color: #8890d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pill__s b { color: var(--orange); font-weight: 900; }
  .pill__v { font-size: 17px; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill__v small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .pill__s { font-size: 10.5px; font-weight: 800; color: #8890d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; margin-top: 2px; }
  .pill__bar { height: 5px; border-radius: 3px; background: #0c0f33; margin-top: 4px; overflow: hidden; }
  .pill__bar span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--lime); transition: width .3s; }
  .pill__bar span.over { background: var(--orange); }

  .ctx { position: absolute; z-index: 5; left: 12px; right: 58px; top: calc(80px + env(safe-area-inset-top)); height: 40px; }
  .ctx > * {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 8px;
    background: #171d58; border-radius: 20px; padding: 0 6px 0 10px; font-size: 13px;
    box-shadow: 0 4px 0 #080a26;
    opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .app[data-view="main"] .ctx__main, .app[data-view="map"] .ctx__map, .app[data-view="neuron"] .ctx__neuron {
    opacity: 1; transform: none; transition-delay: calc(var(--dur) * .55); pointer-events: auto;
  }
  .ctx b { font-weight: 900; }
  .ctx .sub { color: var(--muted); font-size: 12px; font-weight: 600; }
  .ctx .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ring { width: 26px; height: 26px; flex: none; }
  .tag { font-size: 11px; font-weight: 900; border-radius: 12px; padding: 5px 10px; white-space: nowrap; color: #1a1440; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
  .tag--gold { background: var(--yellow); }
  .tag--pink { background: var(--pink); color: #fff; max-width: none; }
  .tag--teal { background: var(--cyan); }
  .tag--ghost { background: var(--panel-3); color: var(--muted); }
  .tag:empty { display: none; }

  /* Zweite Zeile: Menü und aktive Wirkungen der Fundstücke */
  .chips { position: absolute; z-index: 5; left: 12px; right: 64px; top: calc(130px + env(safe-area-inset-top)); display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none; }
  .menu-btn { position: absolute; z-index: 5; right: 12px; top: calc(80px + env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 50%; background: var(--panel); box-shadow: 0 4px 0 #080a26; display: grid; place-items: center; }
  .chip { font-size: 10.5px; font-weight: 900; border-radius: 10px; padding: 4px 8px; background: #0c0f33; color: var(--yellow); white-space: nowrap; }
  .chip--speed { color: var(--pink); }
  .chip--free { color: var(--lime); }

  /* Ansichtsschalter rechts am Rand: Umgebung, Schwarm, Ausbau */
  .views { position: absolute; z-index: 5; right: 12px; top: calc(134px + env(safe-area-inset-top)); display: grid; gap: 10px; }
  .views__btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; filter: grayscale(.75) brightness(.7); transition: filter .3s, box-shadow .3s, transform .1s; }
  .views__btn--pink { background: var(--pink); box-shadow: 0 4px 0 #b52a5e; }
  .views__btn--orange { background: var(--orange); box-shadow: 0 4px 0 #b9561a; }
  .views__btn--cyan { background: var(--cyan); box-shadow: 0 4px 0 #1a9a96; }
  .views__btn[aria-pressed="true"] { filter: none; outline: 2px solid currentColor; outline-offset: 3px; }
  .views__btn--pink[aria-pressed="true"] { color: var(--pink); } .views__btn--orange[aria-pressed="true"] { color: var(--orange); } .views__btn--cyan[aria-pressed="true"] { color: var(--cyan); }
  .views__btn:active { transform: translateY(3px); }
  .chip--zone { color: #a7aee8; display: inline-flex; align-items: center; gap: 4px; }
  .chip--zone.is-open { color: var(--cyan); }

  .recenter { opacity: 0; pointer-events: none; transition: opacity .25s; }
  .app.panned .recenter { opacity: 1; pointer-events: auto; }
  .zoom__btn--ghost { background: var(--panel-2); box-shadow: 0 4px 0 #0c0f33; }

  /* Blätter unten */
  .sheet {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
    padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
    background: var(--panel); border-radius: 28px 28px 0 0;
    box-shadow: 0 -6px 0 #080a26;
    opacity: 0; transform: translateY(40px); pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .app[data-view="main"] .sheet--main, .app[data-view="map"] .sheet--map, .app[data-view="neuron"] .sheet--neuron {
    opacity: 1; transform: none; pointer-events: auto;
    transition: opacity .45s ease calc(var(--dur) * .6), transform .45s var(--ease) calc(var(--dur) * .6);
  }
  .app[data-view] .sheet.is-collapsed { transform: translateY(calc(100% - 30px - env(safe-area-inset-bottom))); }
  .sheet--neuron { background: #24104f; }
  .sheet__grip { display: block; position: relative; width: 100%; height: 26px; margin: -14px 0 4px; touch-action: none; }
  .sheet__grip::before { content: ""; position: absolute; left: 50%; top: 10px; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: #434676; transition: background .2s; }
  .sheet__grip:hover::before, .sheet__grip:focus-visible::before { background: #6a74c8; }
  .sheet.is-collapsed .sheet__grip::before { background: var(--muted); }
  .sheet__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .sheet__head h2 { font-size: 17px; font-weight: 900; white-space: nowrap; }
  .sheet__head h2 small { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 6px; }

  .zoom { position: absolute; top: -70px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .zoom__label { background: #0c0f33; border-radius: 8px; padding: 2px 7px; }
  .zoom--out { left: 14px; }
  .zoom__btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .zoom__btn:active { transform: translateY(3px); box-shadow: none; }

  .seg { display: flex; background: #0c0f33; border-radius: 14px; padding: 3px; }
  .seg button { font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 11px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #1a1440; }

  .units { display: grid; gap: 7px; max-height: 40dvh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .units::-webkit-scrollbar { display: none; }
  .unit { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 18px; padding: 7px 7px 7px 8px; }
  .unit[hidden] { display: none; }
  .unit__icon { width: 42px; height: 42px; border-radius: 50%; background: var(--panel-3); display: grid; place-items: center; }
  .unit__name { font-weight: 900; font-size: 14.5px; white-space: nowrap; }
  .unit__name .num { font-weight: 800; color: var(--cyan); margin-left: 5px; }
  .unit__meta { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .buy { min-width: 92px; border-radius: 14px; padding: 6px 10px 5px; text-align: center; background: var(--yellow); color: #1a1440; box-shadow: 0 3px 0 #c99700; }
  .buy:active:not([aria-disabled="true"]) { transform: translateY(2px); box-shadow: 0 1px 0 #c99700; }
  .buy b { display: block; font-size: 15px; font-weight: 900; line-height: 1.1; }
  .buy span { display: block; font-size: 10.5px; font-weight: 800; color: #53443f; white-space: nowrap; }
  .buy[aria-disabled="true"] { background: var(--panel-3); color: var(--muted); box-shadow: 0 3px 0 #1a2060; }
  .buy[aria-disabled="true"] span { color: #8890d0; }
  .unit--locked { background: none; border: 2px dashed var(--panel-3); padding-top: 4px; padding-bottom: 4px; }
  .unit--locked .unit__icon { width: 30px; height: 30px; margin-left: 6px; background: none; }

  .next { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 18px; padding: 9px 12px 9px 10px; }
  .next__star { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--yellow); box-shadow: 0 0 0 5px #494869; }
  .next__star--auto { background: var(--cyan); box-shadow: 0 0 0 5px #2a5f78; }
  .next__star--none { background: var(--panel-3); box-shadow: 0 0 0 5px #1a2060; }
  .next__k { font-size: 10px; font-weight: 900; color: var(--yellow); text-transform: uppercase; letter-spacing: .1em; }
  .next__k--auto { color: var(--cyan); }
  .next__v { font-size: 15.5px; font-weight: 900; }
  .next__m { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .next__t { text-align: right; font-size: 21px; font-weight: 900; }
  .next__t small { display: block; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .why { font-size: 12.5px; color: var(--muted); margin: 9px 2px 10px; min-height: 3.9em; }
  .why b { color: var(--ink); }
  .warn { color: #ffa3c2; font-weight: 800; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { border-radius: 14px; padding: 10px; font-weight: 900; font-size: 13.5px; text-align: center; background: var(--panel-3); box-shadow: 0 3px 0 #10164a; }
  .btn--warn { background: #3a1f5e; color: #ffa3c2; box-shadow: 0 3px 0 #1d0f33; }
  .btn--gold { background: var(--yellow); color: #1a1440; box-shadow: 0 3px 0 #c99700; }
  .btn[aria-disabled="true"] { opacity: .45; }

  .up { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .up h2 { font-size: 19px; font-weight: 900; }
  .up__rank { font-size: 11.5px; font-weight: 900; background: var(--pink); color: #fff; border-radius: 12px; padding: 4px 10px; }
  /* feste Höhe für vier Zeilen (Geißeln), damit das Blatt beim Wechsel der Bereiche nicht springt */
  .up__fx { display: grid; grid-template-columns: auto 1fr; align-content: start; gap: 5px 12px; margin: 10px 0 12px; font-size: 13.5px; height: calc(4 * 1.35em + 3 * 5px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .up__fx::-webkit-scrollbar { display: none; }
  .up__fx dt { color: #c0a8ee; font-weight: 600; }
  .up__fx dd { font-weight: 800; }
  .up__fx dd em { font-style: normal; color: var(--yellow); }
  .up__fx dd small { font-weight: 600; color: #c0a8ee; }
  .up__tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 12px; }
  .up__tabs button { font-size: 11.5px; font-weight: 900; padding: 6px 4px; border-radius: 11px; background: #170a36; color: #c0a8ee; }
  .up__tabs button[aria-pressed="true"] { background: var(--pink); color: #fff; }
  .buy--wide { display: flex; width: 100%; justify-content: center; align-items: baseline; gap: 8px; padding: 12px 11px 11px; border-radius: 16px; }
  .buy--wide b { display: inline; font-size: 16px; }
  .buy--wide span { display: inline; font-size: 12.5px; }
  .ctx .seg { padding: 2px; }
  .ctx .seg button { padding: 4px 10px; font-size: 11.5px; white-space: nowrap; }
  .seg--grp button[aria-pressed="true"][data-grp="kette"] { background: var(--orange); }
  .seg--grp button[aria-pressed="true"][data-grp="schwarm"] { background: var(--pink); color: #fff; }
  .up__kick { grid-column: 1 / -1; font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #ffb27a; margin-bottom: -4px; }
  .up__rank--chain { background: var(--orange); color: #1a1440; white-space: nowrap; }
  .up__tabs button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .up__tabs button.is-chain[aria-pressed="true"] { background: var(--orange); color: #1a1440; }
  .up__tabs button.is-locked { opacity: .5; }
  .up__tabs--chain button { flex-direction: column; gap: 1px; padding: 5px 2px 4px; font-size: 10.5px; }
  .ico { display: inline-block; vertical-align: -3px; }
  .buy--chain { background: var(--orange); box-shadow: 0 3px 0 #b9561a; }
  .buy--chain:active:not([aria-disabled="true"]) { box-shadow: 0 1px 0 #b9561a; }
  .buy--chain span { color: #4a2108; }
  /* feste Höhe, damit das Blatt beim Wechsel zwischen den Erzeugungs-Ausbauten nicht springt */
  .cu__body { height: 100px; font-size: 14px; }
  .cu__body .up__fx { margin-bottom: 0; }
  .cu__body .up__fx { height: auto; }
  .trade { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0 6px; }
  .trade > div { background: #170a36; border-radius: 14px; padding: 7px 10px 8px; min-width: 0; }
  .trade h3 { font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #c0a8ee; }
  .trade p { font-size: 14.5px; font-weight: 900; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trade small { display: block; font-size: 11.5px; font-weight: 600; color: #c0a8ee; }
  .trade > div:last-child h3 { color: #ffb27a; }
  .verdict { font-size: 12.5px; font-weight: 700; margin: 0 2px; }
  .verdict b { font-weight: 900; }
  .verdict--good { color: var(--lime); }
  .verdict--bad { color: #ffa3c2; }

  /* Hinweise */
  /* unterhalb der Tiefenanzeige, damit deren Beschriftungen frei bleiben */
  .toasts { position: absolute; z-index: 8; left: 24px; right: 64px; top: calc(268px + env(safe-area-inset-top)); display: grid; gap: 6px; justify-items: center; pointer-events: none; }
  .toast { background: #0c0f33; border-radius: 12px; padding: 6px 11px; font-size: 11.5px; font-weight: 700; box-shadow: 0 4px 0 #05061a; animation: toast 4.2s ease forwards; max-width: 100%; text-align: center; }
  .toast b { color: var(--yellow); }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  /* Dialoge */
  .modal { position: absolute; inset: 0; z-index: 10; background: rgb(5 6 26 / .78); display: none; align-items: flex-end; justify-content: center; padding: 12px; }
  .modal.open { display: flex; }
  .modal__card { width: 100%; max-height: 86%; overflow-y: auto; background: var(--panel); border-radius: 26px; padding: 18px 16px 16px; box-shadow: 0 6px 0 #080a26; }
  .modal__card h2 { font-size: 19px; font-weight: 900; margin-bottom: 4px; }
  .modal__card h3 { font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 14px 0 6px; }
  .modal__card p { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .modal__card p b { color: var(--ink); }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
  .stats dt { color: var(--muted); font-weight: 600; }
  .stats dd { font-weight: 800; text-align: right; }
  .modal__actions { display: grid; gap: 8px; margin-top: 14px; }
  .modal__actions--2 { grid-template-columns: 1fr 1fr; }
  .modal textarea { width: 100%; height: 110px; border-radius: 12px; border: 0; background: #0c0f33; color: var(--ink); font: 11px/1.3 ui-monospace, monospace; padding: 8px; resize: none; user-select: text; -webkit-user-select: text; }
  .loglist { font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; max-height: 30vh; overflow-y: auto; }
  .loglist b { color: var(--ink); }
  .busy { position: absolute; inset: 0; z-index: 12; display: none; place-items: center; background: rgb(5 6 26 / .85); font-weight: 900; }
  .busy.open { display: grid; }

  /* Messung der Darstellung (nur mit ?messung) */
  .perf { position: absolute; z-index: 9; left: 12px; top: calc(172px + env(safe-area-inset-top)); background: rgb(5 6 26 / .85); border-radius: 10px; padding: 5px 8px; font: 700 10.5px/1.4 ui-monospace, monospace; color: var(--ink); white-space: pre; pointer-events: none; }
  .perf-block { position: absolute; inset: 0; z-index: 15; }
  .perf-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .app.no-blur .layer { filter: none !important; }
  .app.no-blur #neuronOrg { filter: none; }
  .app.no-motion :is(.swim, .bob, .sig, .node__pulse, .cnode__pulse, .drift, .drift--fast, .node__sel, .swirl, .route, .paddle, .roll, .ray) { animation: none !important; }
  /* Canvas-Variante: Schwarm und Partikel zeichnet JS je Frame, Ferne, Dunst und Hintergrund der Stelle sind fertige Bilder */
  .cv-el { position: absolute; display: none; }
  .app.cv .cv-el { display: block; }
  .app.cv #farSvg, .app.cv #hazeSvg, .app.cv #mainBg, .app.cv #mainSite { visibility: hidden; }
  .app.cv #farSvg *, .app.cv #hazeSvg *, .app.cv #mainBg *, .app.cv #mainSite * { animation: none !important; }
  .ptable { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .ptable th, .ptable td { padding: 3px 4px; text-align: right; font-weight: 800; }
  .ptable th:first-child, .ptable td:first-child { text-align: left; color: var(--muted); font-weight: 600; }
  .ptable td:not(:first-child) { white-space: nowrap; }
  .ptable thead th { color: var(--muted); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; }
  .ptable .p-ok { color: var(--lime); }
  .ptable .p-mid { color: var(--yellow); }
  .ptable .p-bad { color: #ffa3c2; }
</style>
</head>
<body>
<div class="app no-anim" data-view="main" id="app">

  <!-- Ebene 3 (am tiefsten): Stimmung der nächsten Zone, ohne Stellen -->
  <div class="layer layer--far" aria-hidden="true">
    <svg id="farSvg" width="2000" height="2000" viewBox="-1000 -1000 2000 2000"></svg>
    <canvas class="cv-el" id="cvFar" style="left:-1000px;top:-1000px;width:2000px;height:2000px"></canvas>
  </div>

  <!-- Dunst zwischen Ferne und Umgebung, eigene Parallaxe -->
  <div class="layer layer--haze" aria-hidden="true">
    <svg id="hazeSvg" width="2000" height="2000" viewBox="-1000 -1000 2000 2000"></svg>
    <canvas class="cv-el" id="cvHaze" style="left:-1000px;top:-1000px;width:2000px;height:2000px"></canvas>
  </div>

  <!-- Ebene 2: Umgebung, nur die aktuelle Zone -->
  <div class="layer layer--map">
    <svg id="mapSvg" width="2000" height="2000" viewBox="-1000 -1000 2000 2000" aria-label="Umgebung: Stellen in Reichweite"><g id="mapLow"></g><g id="mapSwarm" class="map-only"></g><g id="mapHigh"></g></svg>
  </div>

  <!-- Ebene 1: Schwarm an der Stelle -->
  <div class="layer layer--main">
    <svg width="900" height="900" viewBox="-450 -450 900 900" aria-label="Schwarm">
      <defs>
        <clipPath id="cFress"><path id="pFress" d="M9 0C9-3.2 5-4.6 0-4.4C-6-4.2-9.5-3-9.5 0C-9.5 3-6 4.4-1 4.2C1 4.1 2 2.4 3.6 2.6C5.6 2.9 9 3 9 0Z"/></clipPath>
        <clipPath id="cBrut"><circle r="15"/></clipPath>
        <!-- Fressling flach mit dunklem Rand wie alle höheren Stufen; die Mundbucht bleibt als Erkennungszeichen -->
        <g id="fress">
          <use href="#pFress" fill="#6e2a12" stroke="#6e2a12" stroke-width="2.8" stroke-linejoin="round"/>
          <use href="#pFress" fill="#ffb27a"/>
          <g clip-path="url(#cFress)"><use href="#pFress" fill="#ff8a3d" transform="translate(.7 1)"/></g>
          <path d="M-1.5 3.3C.8 3.2 1.9 1.7 3.6 1.8" fill="none" stroke="#6e2a12" stroke-width=".9" stroke-linecap="round"/>
        </g>
        <g id="brut">
          <circle r="18.5" fill="#7a2560"/>
          <circle r="15" fill="#ff9cc4"/>
          <g clip-path="url(#cBrut)"><circle cx="2.2" cy="2.8" r="15" fill="#ff4f8b"/><circle cx="3" cy="22" r="13" fill="#d8336f"/></g>
          <circle cx="-4.5" cy="-3" r="3.6" fill="#ffd23f"/><circle cx="-5.5" cy="-4" r="1.1" fill="#fff4b8"/>
          <circle cx="4.5" cy="-1.5" r="3.2" fill="#ffd23f"/><circle cx="3.6" cy="-2.5" r="1" fill="#fff4b8"/>
          <circle cx="-.5" cy="5.5" r="3" fill="#ffd23f"/><circle cx="-1.4" cy="4.6" r=".9" fill="#fff4b8"/>
        </g>
        <g id="etr">
          <ellipse rx="22" ry="17" fill="#4b2a8f"/>
          <ellipse rx="19" ry="14.5" fill="#c7a6ff"/>
          <ellipse cx="2" cy="2.5" rx="18" ry="13.5" fill="#9b6bff"/>
          <g fill="#ffd23f"><circle cx="-9" cy="0" r="3.2"/><circle cx="-2" cy="-4.5" r="3.2"/><circle cx="6" cy="-1.5" r="3.2"/><circle cx="-1.5" cy="4" r="3.2"/><circle cx="6.5" cy="6.5" r="2.6"/></g>
          <g fill="#fff4b8"><circle cx="-10" cy="-1" r="1"/><circle cx="-3" cy="-5.5" r="1"/><circle cx="5" cy="-2.5" r="1"/></g>
        </g>
        <g id="gel">
          <circle r="27" fill="#5e3a14"/>
          <g fill="#ffd23f"><circle cx="-10" cy="-6" r="9"/><circle cx="8" cy="-9" r="8.5"/><circle cx="11" cy="8" r="9"/><circle cx="-8" cy="11" r="8.5"/><circle cx="0" cy="0" r="8"/></g>
          <g fill="#ffe98a"><circle cx="-13" cy="-9" r="3"/><circle cx="5" cy="-12" r="2.8"/><circle cx="8" cy="5" r="3"/><circle cx="-11" cy="8" r="2.8"/><circle cx="-2.5" cy="-2.5" r="2.6"/></g>
        </g>
        <g id="bkl">
          <circle r="36" fill="#6a1a6b"/>
          <g fill="#ff4f8b"><circle cx="-14" cy="-10" r="14"/><circle cx="12" cy="-13" r="13"/><circle cx="15" cy="11" r="14"/><circle cx="-11" cy="14" r="13"/><circle r="12"/></g>
          <g fill="#ff9cc4"><circle cx="-18" cy="-14" r="5"/><circle cx="8" cy="-17" r="4.6"/><circle cx="11" cy="7" r="5"/><circle cx="-15" cy="10" r="4.6"/></g>
          <g fill="#ffd23f"><circle cx="-12" cy="-8" r="3"/><circle cx="14" cy="-11" r="3"/><circle cx="17" cy="13" r="3"/><circle cx="-9" cy="16" r="3"/><circle r="3.4"/></g>
        </g>
        <g id="urn">
          <circle r="48" fill="#2a1060"/>
          <circle r="42" fill="#9b6bff"/>
          <circle cx="4" cy="5" r="40" fill="#6c3fd6"/>
          <circle r="27" fill="#ff8a3d"/>
          <circle cx="3" cy="3" r="24" fill="#e5612a"/>
          <g fill="#ffd23f"><circle cx="-8" cy="-6" r="6"/><circle cx="8" cy="-4" r="5.5"/><circle cx="0" cy="9" r="6"/></g>
          <g fill="#fff4b8"><circle cx="-10" cy="-8" r="2"/><circle cx="6" cy="-6" r="1.8"/><circle cx="-2" cy="7" r="2"/></g>
        </g>
        <g id="sparkle">
          <path d="M0-15L3.6-3.6 15 0 3.6 3.6 0 15-3.6 3.6-15 0-3.6-3.6Z" fill="#ffe98a"/>
        </g>
      </defs>
      <g id="mainBg"></g>
      <g id="mainSite"></g>
      <g id="mainFlow"><g id="mainDrift" class="drift"></g></g>
      <g id="mainTrek" class="trek"><g id="mainSwarm"></g></g>
    </svg>
    <canvas class="cv-el" id="cvMain" style="left:-550px;top:-550px;width:1100px;height:1100px"></canvas>
    <canvas class="cv-el" id="cvSite" style="left:-550px;top:-550px;width:1100px;height:1100px"></canvas>
    <canvas class="cv-el" id="cvLive" style="left:-340px;top:-340px;width:680px;height:800px"></canvas>
  </div>

  <!-- Ebene 0 (am nächsten): Ausbauten als Neuron im Inneren des Schwarms -->
  <div class="layer layer--neuron">
    <svg id="neuronSvg" width="1700" height="1400" viewBox="-500 -560 1700 1400" aria-label="Ausbauten als zwei Nervenzellen: Schwarm und Kette">
      <defs>
        <clipPath id="cNode"><circle r="20"/></clipPath>
        <clipPath id="cSoma"><path d="M38.1 -8C37.2 0.5 36.2 7.8 32.3 15.5C28.4 23.1 22.7 34.4 14.9 37.9C7.1 41.4 -6.1 39.9 -14.5 36.6C-22.9 33.2 -30.5 25.2 -35.5 17.8C-40.5 10.4 -45.3 0.1 -44.7 -8C-44 -16.1 -36.8 -24 -31.6 -31C-26.5 -38 -21.5 -45.7 -13.6 -50C-5.7 -54.2 7.3 -59.1 15.8 -56.7C24.4 -54.3 34.1 -43.6 37.8 -35.5C41.5 -27.3 39 -16.5 38.1 -8Z"/></clipPath>
        <filter id="nBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <rect x="-500" y="-560" width="1700" height="1400" fill="#14082f"/>
      <g transform="translate(0 -8)">
        <circle r="640" fill="#1a0b3d"/>
        <circle r="470" fill="#210f4a"/>
        <circle r="320" fill="#291358"/>
        <circle r="190" fill="#311766"/>
      </g>
      <g transform="translate(380 -8)">
        <circle r="640" fill="#1a0b3d"/>
        <circle r="470" fill="#210f4a"/>
        <circle r="320" fill="#291358"/>
        <circle r="190" fill="#311766"/>
      </g>
      <g id="neuronOrg" filter="url(#nBlur)"></g>
      <path class="twig" d="M-70 -78Q-150 -70 -200 -40"/><path class="twig" d="M-110 -118Q-170 -150 -190 -205"/><path class="twig" d="M8 -120Q60 -170 70 -230"/><path class="twig" d="M120 -110Q170 -150 205 -190"/>
      <g id="neuronG"></g>
    </svg>
  </div>

  <!-- Bedienoberfläche -->
  <header class="hud">
    <div class="pill">
      <div class="pill__k"><i style="background:var(--lime)"></i>Vorrat<em class="num" id="hudVCap"></em></div>
      <div class="pill__v num" id="hudV">0</div>
      <div class="pill__bar"><span id="hudVBar"></span></div>
    </div>
    <div class="pill">
      <div class="pill__k"><i style="background:var(--yellow)"></i>Eier</div>
      <div class="pill__v num" id="hudE">0</div>
      <div class="pill__s num" id="hudERate"></div>
    </div>
    <div class="pill">
      <div class="pill__k"><i style="background:var(--orange)"></i>Ernte</div>
      <div class="pill__v num" id="hudH">0</div>
      <div class="pill__s num" id="hudHUnit"></div>
    </div>
  </header>

  <div class="ctx">
    <div class="ctx__main">
      <svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#0c0f33" stroke-width="4"/><circle id="ctxRing" cx="13" cy="13" r="10" fill="none" stroke="#8cf25a" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 13 13)"/></svg>
      <span class="grow" id="ctxMainText"></span>
      <span class="tag tag--gold" id="ctxMainTag"></span>
    </div>
    <div class="ctx__map">
      <span class="grow" id="ctxMapText"></span>
      <span class="tag tag--teal" id="ctxMapTag"></span>
    </div>
    <div class="ctx__neuron">
      <span class="grow" id="ctxNeuronText"></span>
      <div class="seg seg--grp" role="group" aria-label="Neuron" id="grpSeg"><button data-grp="schwarm" aria-pressed="true">Schwarm</button><button data-grp="kette" aria-pressed="false">Kette</button></div>
    </div>
  </div>

  <button class="menu-btn" id="menuBtn" aria-label="Menü">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="#a7aee8"><rect x="2" y="3" width="12" height="2" rx="1"/><rect x="2" y="7" width="12" height="2" rx="1"/><rect x="2" y="11" width="12" height="2" rx="1"/></g></svg>
  </button>
  <div class="chips" id="chips"></div>

  <nav class="views" aria-label="Ansicht">
    <button class="views__btn views__btn--cyan" data-go="map" aria-label="Umgebung" aria-pressed="false">

<script>
'use strict';

/* =====================================================================
   Spielwerte (ALL-CFG-01): alle Zahlen des Balancings an einer Stelle
   ===================================================================== */
const CFG = {
  dt: 0.25,                                   // TEC-03
  start: { vorrat: 50, eier: 10, fress: 5 },  // P1-STA-01
  units: [                                    // P1-KET-01; dat: Dativ Plural
    { name: 'Fressling',   plural: 'Fresslinge',    dat: 'Fresslingen',    short: 'F.',  icon: 'fress', cost: 10,  req: 0,   prod: 0 },
    { name: 'Brutling',    plural: 'Brutlinge',     dat: 'Brutlingen',     short: 'B.',  icon: 'brut',  cost: 500, req: 10,  prod: 2 },
    { name: 'Eiträgerin',  plural: 'Eiträgerinnen', dat: 'Eiträgerinnen',  short: 'Et.', icon: 'etr',   cost: 2e4, req: 100, prod: 3 },
    { name: 'Gelege',      plural: 'Gelege',        dat: 'Gelegen',        short: 'G.',  icon: 'gel',   cost: 1e6, req: 1e3, prod: 4 },
    { name: 'Brutklumpen', plural: 'Brutklumpen',   dat: 'Brutklumpen',    short: 'Bk.', icon: 'bkl',   cost: 5e7, req: 1e4, prod: 5 },
    { name: 'Urnest',      plural: 'Urnester',      dat: 'Urnestern',      short: 'U.',  icon: 'urn',   cost: 2e9, req: 1e5, prod: 6 },
  ],
  upgrades: {                                 // P1-AUS-01: Wirkung base·factor^l, Kosten cost·growth^l
    herd:  { name: 'Brutherd',  base: 1,    factor: 1.7, cost: 30,  growth: 3 },
    verd:  { name: 'Verdauung', base: 1,    factor: 1.5, cost: 300, growth: 5 },
    geis:  { name: 'Geißeln',   base: 50,   factor: 1.8, cost: 125, growth: 2.2 },
    kropf: { name: 'Kropf',     base: 2000, factor: 1.5, cost: 80,  growth: 1.55 },
  },
  // P1-AUS-05: Erzeugungs-Ausbau für Fresslinge bis Gelege, bezahlt mit der erzeugenden Stufe.
  // Wirkung (1 + w·l) × Grundwert, Kosten ⌈a·k^l⌉ Einheiten
  chainUp: { w: 1, a: 1, k: 2 },
  reach: { base: 140, step: 70, every: 3 },   // P1-AUS-03
  travel: { base: 20, ref: 50 },              // P1-REI-02: v = base · (1 + log10(T / ref))
  zones: [                                    // P1-KAR-01
    { name: 'Wassertropfen',  threshold: 0 },
    { name: 'Gezeitentümpel', threshold: 500 },
    { name: 'Felsenbecken',   threshold: 2e4 },
    { name: 'Flachwasser',    threshold: 1e6 },
  ],
  map: {
    baseSize: 5000, sizeGrowth: 60,           // P1-STE-02
    randMin: 0.75, randMax: 1.25, startRand: 0.6,
    zoneRadius: 400,                          // [offen] P1-KAR-05: Zonenfläche als Kreis um den Ursprung
    minDist: 20,                              // [offen] P1-KAR-05: Vorschlag Mindestabstand
    initial: { algen: 3, krebs: 1, schnee: 1 },  // P1-KAR-02
    goneDelay: 10,                            // P1-STE-05
  },
  siteTypes: {                                // P1-STE-03
    algen:    { name: 'Algenfilm',     factor: 1,   g: 0.01 },
    plankton: { name: 'Planktonwolke', factor: 4,   g: 0, lifetime: 180 },
    krebs:    { name: 'Toter Krebs',   factor: 10,  g: 0, decay: 0.003, minFrac: 0.01 },
    schnee:   { name: 'Meeresschnee',  factor: 3,   g: 0.003, eggMult: 2 },
    seegras:  { name: 'Seegraswiese',  factor: 1e5, g: 0.004, threshold: 1e8, floorFrac: 0.01, goal: true, zone: 3 },
  },
  spawn: { interval: 25, maxInReach: 10, minTargets: 3, weights: { algen: 3, plankton: 1, krebs: 1, schnee: 1 } }, // P1-STE-07/08
  finds: {                                    // P1-FUN-04
    respawnMin: 120, respawnMax: 240,
    types: {
      fress: { name: 'Fressrausch',       weight: 3, text: 'Appetit ×3 für 60 s' },
      lege:  { name: 'Legeschub',         weight: 3, text: 'Eier-Rate ×5 für 60 s' },
      verm:  { name: 'Vermehrungsrausch', weight: 3, text: 'Erzeugung der Kette ×3 für 60 s' },
      wind:  { name: 'Rückenwind',        weight: 2, text: 'Reisetempo ×4 für 60 s' },
      blase: { name: 'Nahrungsblase',     weight: 3, text: 'Sofort Vorrat: 180 s Ø-Ernte' },
      ballen:{ name: 'Eierballen',        weight: 2, text: 'Sofort Eier: 180 s Eier-Rate' },
      schub: { name: 'Wachstumsschub',    weight: 2, text: 'Sofort 120 s Erzeugung je Stufe' },
      keim:  { name: 'Keimzelle',         weight: 1, text: 'Nächster Rang eines Schwarm-Ausbaus gratis' },
    },
    buffDuration: 60, mult: { fress: 3, lege: 5, verm: 3, wind: 4 },
    blaseMin: 1000, blaseSec: 180, avgWindow: 120, ballenMin: 50, ballenSec: 180, schubSec: 120,
  },
  offlineMax: 24 * 3600,                      // ALL-OFF-02
  saveEvery: 10,                              // ALL-OFF-01
};
const SAVE_KEY = 'idleswarm-prototyp';
const SAVE_VERSION = 2;
const HIST_LEN = Math.round(CFG.finds.avgWindow / CFG.dt);

/* =====================================================================
   Spiellogik: reine Funktionen auf dem Zustand, ohne DOM (TEC-04)
   ===================================================================== */
function rnd(s) { // mulberry32, Zustand im Spielstand für reproduzierbare Läufe
  let t = (s.rng = (s.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function pickWeighted(s, weights) {
  const entries = Object.entries(weights);
  let r = rnd(s) * entries.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of entries) { r -= w; if (r < 0) return k; }
  return entries[entries.length - 1][0];
}
const upEff = (k, l) => CFG.upgrades[k].base * CFG.upgrades[k].factor ** l;
const upCost = (k, l) => CFG.upgrades[k].cost * CFG.upgrades[k].growth ** l;
const reachFor = (l) => CFG.reach.base + CFG.reach.step * Math.floor(l / CFG.reach.every);
const speedFor = (thrust) => CFG.travel.base * (1 + Math.log10(Math.max(1, thrust / CFG.travel.ref)));
// Erzeugungs-Ausbau i steigert die Erzeugung von Einheit i durch Stufe i + 1 und kostet Einheiten der Stufe i + 1
const CHAIN_UPS = 4;
const chainCost = (l) => Math.ceil(CFG.chainUp.a * CFG.chainUp.k ** l - 1e-9);
const chainFactor = (l) => 1 + CFG.chainUp.w * l;
// Erzeugung je Einheit der Stufe k (k ≥ 1) mit Erzeugungs-Ausbau, ohne Boni
const prodOf = (s, k) => CFG.units[k].prod * (k - 1 < CHAIN_UPS ? chainFactor(s.chainRanks[k - 1]) : 1);
const chainLocked = (s, i) => s.chainRanks[i] === 0 && s.units[i + 1] < 1;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function newGame(seed) {
  const s = {
    v: SAVE_VERSION, seed, rng: seed, t: 0,
    vorrat: CFG.start.vorrat, eier: CFG.start.eier,
    units: [CFG.start.fress, 0, 0, 0, 0, 0], unlocked: [true, true, false, false, false, false],
    ranks: { herd: 0, verd: 0, geis: 0, kropf: 0 }, chainRanks: [0, 0, 0, 0], free: 0,
    zone: 0, pos: { x: 0, y: 0 }, at: null, travel: null,
    sites: [], finds: [], findTimers: {}, spawnTimers: [0, 0, 0, 0],
    buffs: { fress: 0, lege: 0, verm: 0, wind: 0 },
    mark: null, leave: false, nextId: 1,
    hist: new Array(HIST_LEN).fill(0), histI: 0, histSum: 0, lastH: 0,
    stats: { firstTravel: null, travels: 0, dried: 0, spawned: 0, finds: 0, marks: 0, leaves: 0,
      noHarvest: 0, noHarvestZone: [0, 0, 0, 0], timeZone: [0, 0, 0, 0], total: 0, endAt: null },
    ended: false, endSeen: false, savedAt: Date.now(),
  };
  const start = makeSite(s, 'algen', 0, 0, 0, CFG.map.startRand);
  start.known = true;
  s.sites.push(start);
  s.at = start.id;
  for (let z = 0; z < CFG.zones.length; z++) {
    for (const [type, n] of Object.entries(CFG.map.initial)) {
      for (let i = 0; i < n; i++) {
        const p = placeInDisc(s, z, 0, 0, CFG.map.zoneRadius);
        s.sites.push(makeSite(s, type, z, p.x, p.y, randF(s)));
      }
    }
    if (z === CFG.siteTypes.seegras.zone) {
      const p = placeInDisc(s, z, 0, 0, CFG.map.zoneRadius * 0.8);
      s.sites.push(makeSite(s, 'seegras', z, p.x, p.y, randF(s)));
    }
    s.finds.push(makeFind(s, z));
  }
  discover(s, derive(s));
  return s;
}
const randF = (s) => CFG.map.randMin + rnd(s) * (CFG.map.randMax - CFG.map.randMin);

function makeSite(s, type, zone, x, y, rf) {
  const T = CFG.siteTypes[type];
  const size = CFG.map.baseSize * CFG.map.sizeGrowth ** zone * T.factor * rf;
  return { id: s.nextId++, type, zone, x, y, size, stock: size, born: s.t, dead: false, goneAt: null, known: false, shape: Math.floor(rnd(s) * 1e6) };
}
function makeFind(s, zone) {
  const p = placeInDisc(s, zone, 0, 0, CFG.map.zoneRadius);
  return { id: s.nextId++, type: pickWeighted(s, Object.fromEntries(Object.entries(CFG.finds.types).map(([k, v]) => [k, v.weight]))), zone, x: p.x, y: p.y };
}
// Zufällige Position in einem Kreis, innerhalb der Zonenfläche, mit Mindestabstand zu Stellen der Zone und zum Schwarm
function placeInDisc(s, zone, cx, cy, r) {
  let best = null, bestD = -1;
  for (let i = 0; i < 40; i++) {
    const a = rnd(s) * Math.PI * 2, rr = Math.sqrt(rnd(s)) * r;
    const p = { x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr };
    if (Math.hypot(p.x, p.y) > CFG.map.zoneRadius) continue;
    let d = dist(p, s.pos);
    for (const o of s.sites) if (o.zone === zone) d = Math.min(d, dist(p, o));
    if (d >= CFG.map.minDist) return p;
    if (d > bestD) { bestD = d; best = p; }
  }
  return best || { x: cx, y: cy };
}

function derive(s) {
  const r = s.ranks, b = s.buffs, F = CFG.finds.mult;
  const thrust = upEff('geis', r.geis);
  // P1-REI-02: Das Reisetempo hängt nur vom Antrieb ab, im Zeitalter Winzlinge gibt es keine Masse
  const baseSpeed = speedFor(thrust);
  const speed = baseSpeed * (b.wind > 0 ? F.wind : 1);
  const digest = upEff('verd', r.verd);
  const appetite = s.units[0] * digest * (b.fress > 0 ? F.fress : 1);
  const capacity = upEff('kropf', r.kropf);
  const site = currentSite(s);
  const eatingSchnee = site && !site.dead && CFG.siteTypes[site.type].eggMult && s.lastH > 0;
  const eggRate = upEff('herd', r.herd) * (eatingSchnee ? CFG.siteTypes.schnee.eggMult : 1) * (b.lege > 0 ? F.lege : 1);
  const chainMult = b.verm > 0 ? F.verm : 1;
  // Über der Kapazität frisst der Schwarm langsamer: Fressrate = Appetit · C/V (P1-VOR-02)
  const eat = appetite * Math.min(1, capacity / Math.max(s.vorrat, 1e-9));
  return { thrust, speed, baseSpeed, digest, appetite, eat, capacity, eggRate, chainMult, reach: reachFor(r.geis) };
}
const getSite = (s, id) => s.sites.find((x) => x.id === id) || null;
const getFind = (s, id) => s.finds.find((x) => x.id === id) || null;
const currentSite = (s) => (s.at != null && !s.travel ? getSite(s, s.at) : null);
function avail(site) {
  const T = CFG.siteTypes[site.type];
  if (site.dead) return 0;
  return T.floorFrac ? Math.max(0, site.stock - T.floorFrac * site.size) : site.stock;
}
const siteThreshold = (site) => Math.max(CFG.zones[site.zone].threshold, CFG.siteTypes[site.type].threshold || 0);
const reachable = (site, d) => d.thrust >= siteThreshold(site);
const zoneOk = (s, z) => z === s.zone || z === s.zone + 1;
function targetable(s, site, d) {
  return site && site.known && !site.dead && zoneOk(s, site.zone) && reachable(site, d);
}
const findTargetable = (s, f, d) => f && zoneOk(s, f.zone) && d.thrust >= CFG.zones[f.zone].threshold;

// P1-ABZ-01: verfügbare Nahrung bei Ankunft, mit Verfall und Versiegen aus den Eigenheiten
function availAtArrival(s, site, tt) {
  const T = CFG.siteTypes[site.type];
  let A = avail(site);
  if (T.lifetime && site.born + T.lifetime <= s.t + tt) return 0;
  if (T.decay) {
    A *= Math.exp(-T.decay * tt);
    if (A < T.minFrac * site.size) return 0;
  }
  return A;
}
function rate(s, site, d) {
  const tt = dist(s.pos, site) / d.speed;
  const A = availAtArrival(s, site, tt);
  const avg = d.eat > 0 && A > 0 ? A / (tt + A / d.eat) : 0;
  return { tt, A, avg };
}
function bestAlternative(s, d) {
  let best = null;
  for (const site of s.sites) {
    if (site.id === s.at || !targetable(s, site, d)) continue;
    const r = rate(s, site, d);
    if (!best || r.avg > best.avg || (r.avg === best.avg && r.tt < best.tt)) best = { site, ...r };
  }
  return best;
}
function markTarget(s, d) {
  if (!s.mark) return null;
  if (s.mark.kind === 'site') { const x = getSite(s, s.mark.id); return targetable(s, x, d) && x.id !== s.at ? { kind: 'site', obj: x } : null; }
  const f = getFind(s, s.mark.id);
  return findTargetable(s, f, d) ? { kind: 'find', obj: f } : null;
}
function addVorrat(s, h, C) { // P1-VOR-01/02, exakt integriert
  if (h <= 0) return;
  const a = Math.min(h, Math.max(0, C - s.vorrat));
  s.vorrat += a;
  const rest = h - a;
  if (rest > 0) s.vorrat = Math.sqrt(s.vorrat * s.vorrat + 2 * C * rest);
}
function avgHarvest(s) {
  const span = Math.min(CFG.finds.avgWindow, s.t);
  return span > 0 ? s.histSum / span : 0;
}
function drySite(s, site, log) {
  site.dead = true; site.stock = 0;
  site.goneAt = s.at === site.id && !s.travel ? null : s.t + CFG.map.goneDelay;
  s.stats.dried++;
  log && log('dry', site);
}
function discover(s, d) {
  for (const site of s.sites) if (!site.known && zoneOk(s, site.zone) && dist(s.pos, site) <= d.reach) site.known = true;
}
function spawnSite(s, zone, d) {
  const type = pickWeighted(s, CFG.spawn.weights);
  const p = placeInDisc(s, zone, s.pos.x, s.pos.y, d.reach);
  const site = makeSite(s, type, zone, p.x, p.y, randF(s));
  site.known = true;
  s.sites.push(site);
  s.stats.spawned++;
}

function depart(s, target, d, log) {
  const prev = s.at != null ? getSite(s, s.at) : null;
  if (prev && prev.dead) prev.goneAt = s.t + CFG.map.goneDelay;
  const obj = target.obj;
  if (obj.zone > s.zone) { // P1-KAR-06: die verlassene Zone verschwindet
    const old = s.zone;
    s.zone = obj.zone;
    s.sites = s.sites.filter((x) => x.zone >= s.zone);
    s.finds = s.finds.filter((x) => x.zone >= s.zone);
    for (const z of Object.keys(s.findTimers)) if (+z < s.zone) delete s.findTimers[z];
    s.spawnTimers[s.zone + 1] = 0;
    log && log('zone', { from: old, to: s.zone });
  }
  s.at = null;
  s.travel = { kind: target.kind, id: obj.id, x0: s.pos.x, y0: s.pos.y, tx: obj.x, ty: obj.y, dist: dist(s.pos, obj), done: 0 };
  s.leave = false;
  s.stats.travels++;
  if (s.stats.firstTravel == null) s.stats.firstTravel = s.t;
  log && log('depart', target);
}
function applyFind(s, f, d, log) {
  const F = CFG.finds;
  switch (f.type) {
    case 'fress': case 'lege': case 'verm': case 'wind': s.buffs[f.type] += F.buffDuration; break; // P1-FUN-05
    case 'blase': s.vorrat += Math.max(F.blaseMin, F.blaseSec * avgHarvest(s)); break;          // ohne Kapazität
    case 'ballen': s.eier += Math.max(F.ballenMin, F.ballenSec * d.eggRate); break;
    case 'schub': {
      const u = s.units.slice();
      for (let k = 0; k < 5; k++) s.units[k] += F.schubSec * u[k + 1] * prodOf(s, k + 1);
      break;
    }
    case 'keim': s.free++; break;
  }
  s.stats.finds++;
  log && log('find', f);
}

function step(s, log) {
  const dt = CFG.dt;
  const d = derive(s);
  const B = s.buffs;

  // Eier und Kette erzeugen immer (P1-STR-01)
  s.eier += d.eggRate * dt;
  const u = s.units.slice();
  for (let k = 1; k < 6; k++) s.units[k - 1] += u[k] * prodOf(s, k) * d.chainMult * dt;
  for (let k = 2; k < 6; k++) if (s.units[k - 1] >= 1) s.unlocked[k] = true;

  // Ernte (P1-ERN-01/02)
  let H = 0;
  const site = currentSite(s);
  if (site && !site.dead) {
    // Exakt integriert: gefressen wird, was im Vorrat ankommt; begrenzt durch die verfügbare Nahrung
    const before = s.vorrat;
    addVorrat(s, d.appetite * dt, d.capacity);
    let eaten = s.vorrat - before;
    if (eaten > avail(site)) { eaten = avail(site); s.vorrat = before + eaten; }
    site.stock -= eaten;
    H = eaten / dt;
  }
  s.lastH = H;
  s.histSum += H * dt - s.hist[s.histI];
  s.hist[s.histI] = H * dt;
  s.histI = (s.histI + 1) % HIST_LEN;
  s.stats.total += H * dt;
  s.stats.timeZone[s.zone] += dt;
  if (H <= 0) { s.stats.noHarvest += dt; s.stats.noHarvestZone[s.zone] += dt; }

  // Restdauern (P1-FUN-06)
  if (H > 0 && B.fress > 0) B.fress = Math.max(0, B.fress - dt);
  B.lege = Math.max(0, B.lege - dt);
  B.verm = Math.max(0, B.verm - dt);
  if (s.travel && B.wind > 0) B.wind = Math.max(0, B.wind - dt);

  // Stellen: Wuchs, Verfall, Versiegen
  for (const x of s.sites) {
    if (x.dead) continue;
    const T = CFG.siteTypes[x.type];
    if (T.lifetime && s.t - x.born >= T.lifetime) { drySite(s, x, log); continue; }
    if (T.decay) x.stock *= Math.exp(-T.decay * dt);
    if (T.g && x.stock > 0) x.stock += T.g * x.stock * (1 - x.stock / x.size) * dt;
    if (T.minFrac && x.stock < T.minFrac * x.size) { drySite(s, x, log); continue; }
    if (!T.floorFrac && x.stock <= x.size * 1e-12) drySite(s, x, log);
  }
  // Verschwinden (P1-STE-05/06)
  if (s.sites.some((x) => x.goneAt != null && s.t >= x.goneAt)) {
    const gone = new Set(s.sites.filter((x) => x.goneAt != null && s.t >= x.goneAt).map((x) => x.id));
    s.sites = s.sites.filter((x) => !gone.has(x.id));
    if (s.travel && s.travel.kind === 'site' && gone.has(s.travel.id)) {
      s.travel = null; s.at = null;
      log && log('abort');
    }
  }

  // Reise
  if (s.travel) {
    const tr = s.travel;
    tr.done = Math.min(tr.dist, tr.done + d.speed * dt);
    const f = tr.dist > 0 ? tr.done / tr.dist : 1;
    s.pos = { x: tr.x0 + (tr.tx - tr.x0) * f, y: tr.y0 + (tr.ty - tr.y0) * f };
    if (tr.done >= tr.dist) {
      s.travel = null;
      s.pos = { x: tr.tx, y: tr.ty };
      if (s.mark && s.mark.kind === tr.kind && s.mark.id === tr.id) s.mark = null;
      if (tr.kind === 'site') {
        s.at = tr.id;
        log && log('arrive', getSite(s, tr.id));
      } else {
        const fnd = getFind(s, tr.id);
        s.at = null;
        if (fnd) {
          applyFind(s, fnd, d, log);
          s.finds = s.finds.filter((x) => x.id !== fnd.id);
          s.findTimers[fnd.zone] = s.t + CFG.finds.respawnMin + rnd(s) * (CFG.finds.respawnMax - CFG.finds.respawnMin);
        }
      }
    }
  }

  // Entdecken und neue Stellen (P1-KAR-03, P1-STE-07/08)
  const d2 = derive(s);
  discover(s, d2);
  const last = CFG.zones.length - 1;
  for (const z of [s.zone, s.zone + 1]) {
    if (z > last) continue;
    s.spawnTimers[z] += dt;
    if (s.spawnTimers[z] >= CFG.spawn.interval) {
      s.spawnTimers[z] -= CFG.spawn.interval;
      const n = s.sites.filter((x) => x.zone === z && !x.dead && !CFG.siteTypes[x.type].goal && dist(s.pos, x) <= d2.reach).length;
      if (n < CFG.spawn.maxInReach) spawnSite(s, z, d2);
    }
  }
  for (let guard = 0; guard < CFG.spawn.minTargets; guard++) {
    const n = s.sites.filter((x) => x.id !== s.at && targetable(s, x, d2) && dist(s.pos, x) <= d2.reach).length;
    if (n >= CFG.spawn.minTargets) break;
    const next = s.zone + 1 <= last && d2.thrust >= CFG.zones[s.zone + 1].threshold ? s.zone + 1 : s.zone;
    spawnSite(s, next, d2);
  }
  // Fundstücke nachlegen (P1-FUN-02)
  for (const z of Object.keys(s.findTimers)) {
    if (s.t >= s.findTimers[z]) {
      delete s.findTimers[z];
      if (+z >= s.zone) s.finds.push(makeFind(s, +z));
    }
  }
  // Markierung erlischt, sobald das Ziel nicht mehr ansteuerbar ist (P1-AUT-03)
  if (s.mark && !(s.travel && s.travel.kind === s.mark.kind && s.travel.id === s.mark.id) && !markTarget(s, d2)) {
    const isCur = s.mark.kind === 'site' && s.mark.id === s.at;
    s.mark = null;
    if (!isCur) log && log('unmark');
  }

  // Abzugsreife und Wanderautomatik (P1-ABZ-02, P1-AUT-01)
  if (!s.travel) {
    const cur = currentSite(s);
    let ripe = s.leave || !cur || cur.dead;
    const best = bestAlternative(s, d2);
    if (cur && !cur.dead && avail(cur) <= 0) ripe = true;
    // Ernte, die an der aktuellen Stelle jetzt möglich ist (im Ankunftsschritt war H noch 0).
    // Ein Rest kleiner als eine Schrittration wird noch gefressen, statt ihn liegen zu lassen.
    if (cur && !cur.dead && best && Math.min(d2.eat, avail(cur) / dt) < best.avg) ripe = true;
    if (ripe) {
      const target = markTarget(s, d2) || (best ? { kind: 'site', obj: best.site } : null);
      if (target) {
        if (s.leave) s.stats.leaves++;
        depart(s, target, d2, log);
      } else if (s.leave) {
        s.leave = false;
        log && log('noTarget');
      }
    }
  }

  // Ende des MVP (P1-END-01)
  const now = currentSite(s);
  if (!s.ended && now && CFG.siteTypes[now.type].goal && s.lastH > 0 && s.units[5] >= 1) {
    s.ended = true;
    s.stats.endAt = s.t;
    log && log('end');
  }
  s.t += dt;
}

function maxBuy(s, k) {
  const U = CFG.units[k];
  let m = Math.min(Math.floor(s.vorrat / U.cost), Math.floor(s.eier));
  if (k > 0) m = Math.min(m, Math.floor(s.units[k - 1] / U.req));
  return Math.max(0, m);
}
function buyAmount(s, k, mode) {
  const m = maxBuy(s, k);
  if (m < 1) return 0;
  if (mode === '1') return 1;
  if (mode === 'q') return Math.max(1, Math.floor(m * 0.25));
  return m;
}
function buyUnit(s, k, n) {
  if (n < 1 || n > maxBuy(s, k) || !s.unlocked[k]) return false;
  const U = CFG.units[k];
  s.vorrat -= U.cost * n;
  s.eier -= n;
  if (k > 0) s.units[k - 1] -= U.req * n;
  s.units[k] += n;
  return true;
}
function buyUpgrade(s, key) {
  const l = s.ranks[key];
  if (s.free > 0) { s.free--; s.ranks[key]++; return 'free'; }
  const c = upCost(key, l);
  if (s.vorrat < c) return false;
  s.vorrat -= c;
  s.ranks[key]++;
  return true;
}
// P1-AUS-05: verbraucht Einheiten der erzeugenden Stufe; Keimzellen gelten nur für P1-AUS-01
function buyChainUp(s, i) {
  const c = chainCost(s.chainRanks[i]);
  if (s.units[i + 1] < c) return false;
  s.units[i + 1] -= c;
  s.chainRanks[i]++;
  return true;
}

/* =====================================================================
   Formatierung (de-DE)
   ===================================================================== */
const SUFFIX = ['', 'Tsd.', 'Mio.', 'Mrd.', 'Bio.', 'Brd.', 'Trio.', 'Trd.', 'Quad.', 'Qrd.', 'Quint.'];
function dec(n, digits) {
  return n.toFixed(digits).replace('.', ',').replace(/,0+$/, '');
}
function group(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '−' + fmt(-n);
  if (n < 100) return dec(Math.floor(n * 10) / 10, 1);
  if (n < 10000) return group(Math.floor(n));
  const e = Math.min(SUFFIX.length - 1, Math.floor(Math.log10(n) / 3));
  if (Math.log10(n) / 3 >= SUFFIX.length) return dec(n / 10 ** Math.floor(Math.log10(n)), 2) + 'e' + Math.floor(Math.log10(n));
  const v = n / 10 ** (e * 3);
  return (v < 100 ? dec(Math.floor(v * 10) / 10, 1) : group(Math.floor(v))) + ' ' + SUFFIX[e];
}
const fmtInt = (n) => fmt(Math.floor(n + 1e-9));
function fmtTime(sec) {
  if (!isFinite(sec)) return '–';
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function fmtDuration(sec) {
  sec = Math.round(sec);
  if (sec < 60) return `${sec} s`;
  if (sec < 3600) return `${Math.floor(sec / 60)} min ${sec % 60} s`;
  return `${Math.floor(sec / 3600)} h ${Math.floor((sec % 3600) / 60)} min`;
}

/* ---------- Kleine Helfer für prozedurale Formen ---------- */
function lcg(seed) { let x = seed % 2147483647 || 1; return () => ((x = (x * 16807) % 2147483647) - 1) / 2147483646; }
function blobPath(r, seed, n = 9, jitter = 0.28, cx = 0, cy = 0) {
  const R = lcg(seed + 7);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + R() * 0.3;
    const rr = r * (1 - jitter + R() * jitter * 2);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let d = `M${mid(pts[n - 1], pts[0]).map((v) => v.toFixed(1)).join(' ')}`;
  for (let i = 0; i < n; i++) {
    const p = pts[i], m = mid(p, pts[(i + 1) % n]);
    d += `Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`;
  }
  return d + 'Z';
}

/* ---------- Symbole der Stellen auf der Umgebungskarte ---------- */
function siteIcon(site, r) {
  const R = lcg(site.shape);
  switch (site.type) {
    case 'algen': {
      const p = blobPath(r, site.shape);
      return `<path d="${p}" fill="#22a86a" transform="translate(${r * .09} ${r * .12})"/><path d="${p}" fill="#8cf25a"/>`;
    }
    case 'plankton': {
      let dots = '';
      for (let i = 0; i < 8; i++) { const a = R() * 6.28, rr = Math.sqrt(R()) * r * .62; dots += `<circle cx="${(Math.cos(a) * rr).toFixed(1)}" cy="${(Math.sin(a) * rr).toFixed(1)}" r="${(r * (.07 + R() * .05)).toFixed(1)}"/>`; }
      return `<circle r="${r}" fill="#233e8b"/><circle r="${r * .67}" fill="#275597"/><g fill="#8ffcff">${dots}</g>`;
    }
    case 'krebs': {

      return `<g transform="rotate(${Math.round(R() * 360)}) scale(${k.toFixed(2)})"><g stroke="#ff6a3d" stroke-width="1.2" stroke-linecap="round" fill="none"><path d="M-3 3l-3 4M0 3.6l-1 4.6M3 3l3 4M-3-3l-3-4M0-3.6l-1-4.6M3-3l3-4"/><path d="M5.4-1.5q3.5-2 4.5-5M5.4 1.5q3.5 2 4.5 5"/></g><path d="${blobPath(5.2, site.shape, 8, .12)}" fill="#ff6a3d" transform="translate(.6 .9)"/><path d="${blobPath(5.2, site.shape, 8, .12)}" fill="#ffb07a"/></g>`;
    }
    case 'schnee': {
      let dots = '';
      for (let i = 0; i < 7; i++) { const a = R() * 6.28, rr = Math.sqrt(R()) * r * .7; dots += `<circle cx="${(Math.cos(a) * rr).toFixed(1)}" cy="${(Math.sin(a) * rr).toFixed(1)}" r="${(r * (.1 + R() * .1)).toFixed(1)}"/>`; }
      return `<circle r="${r}" fill="#374287"/><g fill="#f6f4ff">${dots}</g>`;
    }
    case 'seegras': {
      let blades = '';
      for (let i = 0; i < 9; i++) {
        const x = (i - 4) * r * .2, h = r * (1.1 + R() * .7), bend = (R() - .5) * r * .8;
        blades += `<path d="M${(x - r * .07).toFixed(1)} ${r * .5}Q${(x + bend).toFixed(1)} ${(r * .5 - h * .6).toFixed(1)} ${(x + bend * 1.4).toFixed(1)} ${(r * .5 - h).toFixed(1)}Q${(x + bend * .6 + r * .08).toFixed(1)} ${(r * .5 - h * .5).toFixed(1)} ${(x + r * .07).toFixed(1)} ${r * .5}Z" fill="${i % 2 ? '#8cf25a' : '#22a86a'}"/>`;
      }
      return `<ellipse cy="${r * .5}" rx="${r * 1.1}" ry="${r * .3}" fill="#1e7e66"/>${blades}`;
    }
  }
  return '';
}
