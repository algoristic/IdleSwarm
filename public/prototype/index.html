  $('grpSeg').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.grp === g)));
  $('upSwarm').hidden = g !== 'schwarm';
  $('upChain').hidden = g !== 'kette';
  if (g === 'kette') { renderChainSheet(d); return; }
  const l = s.ranks[k];
  $('upName').textContent = CFG.upgrades[k].name;
  $('upRank').textContent = `Rang ${l} → ${l + 1}`;
  const a = upEff(k, l), b = upEff(k, l + 1);
  let fx = '';
  if (k === 'herd') {
    fx = `<dt>Eier-Rate</dt><dd>${fmt(a)} → <em>${fmt(b)}</em> /s</dd><dt>Aktuell</dt><dd>${fmt(d.eggRate)} Eier/s <small>mit Boni</small></dd>`;
  } else if (k === 'verd') {
    fx = `<dt>Fressleistung</dt><dd>${fmt(a)} → <em>${fmt(b)}</em> /s je Fressling</dd><dt>Appetit</dt><dd>${fmt(d.appetite)} → <em>${fmt(d.appetite * b / a)}</em> /s</dd>`;
  } else if (k === 'kropf') {
    fx = `<dt>Kapazität</dt><dd>${fmt(a)} → <em>${fmt(b)}</em></dd><dt>Vorrat</dt><dd>${fmt(s.vorrat)} <small>· darüber kommt nur der Anteil C/V an</small></dd>`;
  } else {
    const ev = CFG.reach.every, nextM = (Math.floor(l / ev) + 1) * ev;
    fx = `<dt>Antrieb</dt><dd>${fmt(a)} → <em>${fmt(b)}</em></dd><dt>Reichweite</dt><dd>${fmt(d.reach)} KP <small>· ${fmt(reachFor(nextM))} KP ab Rang ${nextM}</small></dd><dt>Reisetempo</dt><dd>${fmt(d.baseSpeed)} → <em>${fmt(speedFor(b))}</em> KP/s</dd>`;
    const nz = s.zone + 1;
    if (nz < CFG.zones.length) {
      const th = CFG.zones[nz].threshold;
      if (a >= th) fx += `<dt>Zone ${nz}</dt><dd>erreichbar <small>· ${CFG.zones[nz].name}</small></dd>`;
      else { let n = l; while (upEff('geis', n) < th) n++; fx += `<dt>Zone ${nz}</dt><dd>ab Antrieb ${fmt(th)} <small>· noch ${n - l} ${n - l === 1 ? 'Rang' : 'Ränge'}</small></dd>`; }
    } else {
      const th = CFG.siteTypes.seegras.threshold;
      if (a >= th) fx += `<dt>Seegraswiese</dt><dd>erreichbar</dd>`;
      else { let n = l; while (upEff('geis', n) < th) n++; fx += `<dt>Seegraswiese</dt><dd>ab Antrieb ${fmt(th)} <small>· noch ${n - l} Ränge</small></dd>`; }
    }
  }
  $('upFx').innerHTML = fx;
  const btn = $('upBuy');
  btn.setAttribute('aria-disabled', canAfford(k) ? 'false' : 'true');
  btn.querySelector('span').textContent = s.free > 0 ? `Gratis · Keimzelle (${s.free})` : `${fmt(upCost(k, l))} Vorrat`;
}
// Erzeugungs-Ausbau (P1-AUS-05): Abwägung, was die geopferten Einheiten erzeugt hätten, gegen das, was der
// nächste Rang allen übrigen bringt. Vereinfacht: Der Wert der Einheiten für Käufe der Stufe darüber fehlt.
function renderChainSheet(d) {
  const s = S, i = chainIdx(selUp), l = s.chainRanks[i], U = CFG.units[i], P = CFG.units[i + 1];
  const btn = $('cuBuy'), w = CFG.chainUp.w;
  $('cuName').textContent = U.dat;
  if (chainLocked(s, i)) {
    $('cuRank').textContent = 'gesperrt';
    $('cuBody').innerHTML = `<dl class="up__fx"><dt>Erzeugt von</dt><dd>${P.plural} <small>· je ${fmt(P.prod)} /s</small></dd><dt>Freischaltung</dt><dd>ab 1 ${P.name}</dd><dt>Erster Rang</dt><dd>1 ${P.name} <small>· +${Math.round(w * 100)} % Erzeugung</small></dd></dl>`;
    btn.setAttribute('aria-disabled', 'true');
    btn.querySelector('span').textContent = `ab 1 ${P.name}`;
    return;
  }
  const cost = chainCost(l), stock = s.units[i + 1], m = d.chainMult;
  const perNow = P.prod * chainFactor(l) * m, step = P.prod * w * m;
  const keep = cost * perNow, rest = Math.max(0, stock - cost), gain = rest * step, net = gain - keep;
  $('cuRank').textContent = `Rang ${l} → ${l + 1}`;
  let verdict;
  if (stock < cost) verdict = `<p class="verdict verdict--bad">Kostet ${unitsLabel(P, cost)}, vorhanden ${fmtInt(stock)}</p>`;
  else if (net > 0) verdict = `<p class="verdict verdict--good">Lohnt sich sofort: <b>+${fmt(net)} ${U.plural}/s</b></p>`;
  else verdict = `<p class="verdict verdict--bad">Lohnt sich erst ab ${fmt(Math.floor(cost * (l + 1 + 1 / w)) + 1)} ${P.dat}, jetzt ${fmtInt(stock)}: <b>${fmt(net)} ${U.plural}/s</b></p>`;
  $('cuBody').innerHTML = `<div class="trade">
      <div><h3>Behalten</h3><p>${unitsLabel(P, cost)}</p><small>erzeugen ${fmt(keep)} /s</small></div>
      <div><h3>Opfern</h3><p>+${fmt(step)} /s je ${P.name}</p><small>übrige ${fmt(rest)}: +${fmt(gain)} /s</small></div>
    </div>${verdict}`;
  btn.setAttribute('aria-disabled', canAfford(selUp) ? 'false' : 'true');
  btn.querySelector('span').textContent = `${unitsLabel(P, cost)} · Rang ${l + 1}`;
}

/* ---------- Kopfzeile, Kontext, Tiefenanzeige ---------- */
function renderHud(d) {
  const s = S;
  $('hudV').textContent = fmtInt(s.vorrat);
  $('hudVCap').textContent = '/ ' + fmt(d.capacity);
  const bar = $('hudVBar');
  bar.style.width = Math.min(100, (s.vorrat / d.capacity) * 100) + '%';
  bar.classList.toggle('over', s.vorrat > d.capacity);
  $('hudE').textContent = fmtInt(s.eier);
  $('hudERate').textContent = `+${fmt(d.eggRate)} pro s`;
  $('hudH').textContent = s.travel ? '0' : fmt(s.lastH);
  // Drosselung der Fressrate über der Kapazität (P1-VOR-02)
  $('hudHUnit').innerHTML = s.travel ? 'unterwegs' : s.vorrat > d.capacity ? `Drossel <b>−${Math.max(1, Math.round(100 * (1 - d.capacity / s.vorrat)))} %</b>` : 'pro Sekunde';

  // Schwarm-Kontext
  const cur = currentSite(s), ring = $('ctxRing');
  const mt = markTarget(s, d);
  if (s.travel) {
    const tr = s.travel, obj = tr.kind === 'site' ? getSite(s, tr.id) : getFind(s, tr.id);
    const nm = obj ? (tr.kind === 'site' ? CFG.siteTypes[obj.type].name : CFG.finds.types[obj.type].name) : '';
    ring.setAttribute('stroke', '#3ee6e0');
    ring.setAttribute('stroke-dasharray', `${(tr.dist > 0 ? (Math.min(tr.dist, tr.done + d.speed * acc) / tr.dist) * 100 : 100).toFixed(1)} 100`);
    $('ctxMainText').innerHTML = `<b>Unterwegs</b> <span class="sub num">· ${nm} in ${fmtTime((tr.dist - tr.done) / d.speed)}</span>`;
  } else if (cur) {
    const T = CFG.siteTypes[cur.type];
    ring.setAttribute('stroke', '#8cf25a');
    ring.setAttribute('stroke-dasharray', `${(shownFrac(cur) * 100).toFixed(1)} 100`);
    let sub;
    if (cur.dead) sub = 'versiegt';
    else if (s.lastH > 0) sub = T.goal ? `Ø ${fmt(s.lastH)}/s` : `leer in ${fmtTime(avail(cur) / s.lastH)}`;
    else sub = 'keine Ernte';
    $('ctxMainText').innerHTML = `<b>${T.name}</b> <span class="sub num">· ${sub}</span>`;
  } else {
    ring.setAttribute('stroke-dasharray', '0 100');
    $('ctxMainText').innerHTML = `<b>An keiner Stelle</b> <span class="sub">· keine Ernte</span>`;
  }
  const tag = $('ctxMainTag');
  if (mt) { tag.className = 'tag tag--gold'; tag.textContent = '★ ' + (mt.kind === 'site' ? CFG.siteTypes[mt.obj.type].name : CFG.finds.types[mt.obj.type].name); }
  else if (!s.travel) { const a = bestAlternative(s, d); tag.className = 'tag tag--teal'; tag.textContent = a ? '→ ' + CFG.siteTypes[a.site.type].name : ''; }
  else tag.textContent = '';

  $('ctxMapText').innerHTML = `<b>${CFG.zones[s.zone].name}</b> <span class="sub num">· Tempo ${fmt(d.speed)} KP/s</span>`;
  $('ctxMapTag').textContent = `Zone ${s.zone}`;
  const nAff = ALL_UPS.filter(canAfford).length;
  $('ctxNeuronText').innerHTML = `<b class="num">${nAff}/${ALL_UPS.length}</b> <span class="sub">bezahlbar</span>`;

  // Wirkungen und Testmodus
  let chips = '';
  // Nächste Zone mit Zugangsschwelle, unterhalb der Kopfzeile
  const nz = s.zone + 1;
  if (nz < CFG.zones.length) {
    const open = d.thrust >= CFG.zones[nz].threshold;
    const lock = '<svg width="8" height="9" viewBox="0 0 8 9" aria-hidden="true"><rect x=".5" y="4" width="7" height="5" rx="1.2" fill="currentColor"/><path d="M2 4.2V3a2 2 0 0 1 4 0v1.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
    chips += open
      ? `<span class="chip chip--zone is-open num">↓ Zone ${nz} offen</span>`
      : `<span class="chip chip--zone num">↓ Zone ${nz} · ${lock} Antrieb ${fmt(CFG.zones[nz].threshold)}</span>`;
  }
  for (const [k, v] of Object.entries(s.buffs)) if (v > 0) chips += `<span class="chip num">${CFG.finds.types[k].name} ${fmtTime(v)}</span>`;
  if (s.free > 0) chips += `<span class="chip chip--free">Keimzelle ×${s.free}</span>`;
  if (speed !== 1) chips += `<span class="chip chip--speed">Test ${speed}×</span>`;
  if ($('chips').innerHTML !== chips) $('chips').innerHTML = chips;
}

let lastMap = 0, lastSheet = 0;
function render(force) {
  const d = derive(S);
  const now = performance.now();
  renderHud(d);
  const view = app.dataset.view;
  if (force || now - lastSheet > 200) {
    lastSheet = now;
    if (view === 'main' || force) renderUnits(d);
    if (view === 'map' || force) renderMapSheet(d);
    if (view === 'neuron' || force) renderUpSheet(d);
    renderNeuron();
    renderMainSite();
    renderSwarm();
  }
  if (force || now - lastMap > (view === 'map' ? 250 : 1000)) {
    lastMap = now;
    renderMap(d);
    renderFar();
    setPan(pan.x, pan.y);
  }
  mapFollow(d);
  siteFollow();
}

/* ---------- Ansichten und Verschieben ---------- */
const hashOf = { main: '', map: '#umgebung', neuron: '#ausbau' };
const fromHash = { '#umgebung': 'map', '#ausbau': 'neuron' };
function setView(v) {
  app.dataset.view = v;
  setPan(0, 0);
  document.querySelectorAll('.views__btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.go === v)));
  history.replaceState(null, '', location.pathname + location.search + hashOf[v]);
  render(true);
  if (v === 'neuron') focusUp();
}
function setPan(x, y) {
  if (app.dataset.view === 'neuron') {
    // Frei verschiebbar, unabhängig von der Auswahl: Jeder Punkt beider Neuronen lässt sich in die Mitte holen
    const [x0, x1, y0, y1] = NEURON_AREA, sc = NEURON_SCALE, cy = neuronMid - app.clientHeight * 0.4;
    pan = { x: Math.min(-x0 * sc, Math.max(-x1 * sc, x)), y: Math.min(cy - y0 * sc, Math.max(cy - y1 * sc, y)) };
  } else {
    let dx = x, dy = y;
    const len = Math.hypot(dx, dy);
    if (len > REACH_PX) { dx *= REACH_PX / len; dy *= REACH_PX / len; }
    pan = { x: dx, y: dy };
  }
  app.style.setProperty('--px', pan.x + 'px');
  app.style.setProperty('--py', pan.y + 'px');
  app.classList.toggle('panned', Math.hypot(pan.x, pan.y) > 6);
}
// Freie Fläche der Ausbau-Ansicht zwischen Kontextzeile mit Hinweisen und Blatt
function neuronFree() {
  const sheet = document.querySelector('.sheet--neuron'), H = app.clientHeight, ctx = document.querySelector('.ctx'), chips = $('chips');
  const top = Math.max(ctx.offsetTop + ctx.offsetHeight, chips.offsetTop + chips.offsetHeight) + 8;
  const bottom = sheet.classList.contains('is-collapsed') ? H - 30 : sheet.offsetTop;
  return { H, top, bottom };
}
// Ausbau: Waagrecht rückt das gewählte Feld zur Mitte; senkrecht steht das ganze Neuron in der freien Fläche.
// Passt es nicht hinein, rückt das gewählte Feld so weit, dass es sichtbar ist.
function focusUp() {
  const { H, top, bottom } = neuronFree(), sc = NEURON_SCALE;
  neuronMid = (top + bottom) / 2;
  neuronH = H;
  const half = Math.max(0, (bottom - top) / 2 / sc - 40), y = upPoint(selUp)[1];
  let fy = (NEURON_TOP + NEURON_BOTTOM) / 2;
  if (y < fy - half) fy = y + half;
  else if (y > fy + half) fy = y - half;
  setPan(-upFocusX(selUp) * sc, neuronMid - H * 0.4 - fy * sc); // Ebenen-Ursprung: 50 % / 40 %
}
// Ändert sich die Höhe, bleibt das Neuron an seinem Platz in der freien Fläche, statt an der alten Grenze zu hängen
addEventListener('resize', () => {
  if (app.dataset.view !== 'neuron' || !neuronH) return;
  const { H, top, bottom } = neuronFree(), mid = (top + bottom) / 2;
  const y = pan.y + (mid - neuronMid) - 0.4 * (H - neuronH);
  neuronMid = mid;
  neuronH = H;
  setPan(pan.x, y);
});
function selectUp(k) {
  selUp = k;
  lastUp[groupOf(k)] = k;
  render(true);
  focusUp();
}
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.go)));
document.querySelector('[data-recenter]').addEventListener('click', () => setPan(0, 0));

// Blätter: Antippen des Griffs klappt um, Wischen nach unten/oben klappt ein/aus
function setCollapsed(sheet, on) {
  // Ohne die Verzögerung des Ansichtswechsels umklappen
  sheet.style.transition = 'transform .35s var(--ease)';
  clearTimeout(sheet._t);
  sheet._t = setTimeout(() => { sheet.style.transition = ''; }, 400);
  sheet.classList.toggle('is-collapsed', on);
  const g = sheet.querySelector('.sheet__grip');
  g.setAttribute('aria-expanded', String(!on));
  g.setAttribute('aria-label', on ? 'Blatt ausklappen' : 'Blatt einklappen');
  if (sheet.classList.contains('sheet--neuron') && app.dataset.view === 'neuron') focusUp();
}
document.querySelectorAll('.sheet__grip').forEach((g) => {
  const sheet = g.closest('.sheet');
  let start = null;
  g.addEventListener('pointerdown', (e) => { start = { id: e.pointerId, y: e.clientY }; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointerup', (e) => {
    if (!start || e.pointerId !== start.id) return;
    const dy = e.clientY - start.y;
    start = null;
    if (Math.abs(dy) < 12) setCollapsed(sheet, !sheet.classList.contains('is-collapsed'));
    else setCollapsed(sheet, dy > 0);
  });
  g.addEventListener('pointercancel', () => { start = null; });
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setCollapsed(sheet, !sheet.classList.contains('is-collapsed')); } });
});

app.addEventListener('pointerdown', (e) => {
  if (app.dataset.view === 'main' || e.target.closest('.sheet, .hud, .ctx, .menu-btn, .views, .modal')) return;
  drag = { id: e.pointerId, x: e.clientX - pan.x, y: e.clientY - pan.y, sx: e.clientX, sy: e.clientY, moved: false };
  app.setPointerCapture(e.pointerId);
});
app.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; app.classList.add('panning'); }
  if (drag.moved) setPan(e.clientX - drag.x, e.clientY - drag.y);
});
const endDrag = (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const wasTap = !drag.moved;
  drag = null;
  app.classList.remove('panning');
  if (wasTap && e.type === 'pointerup') {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const t = el && el.closest('[data-mark], [data-up], [data-soma]');
    if (t && t.dataset.mark) onMark(t.dataset.mark);
    else if (t && app.dataset.view === 'neuron') selectUp(t.dataset.up || lastUp[t.dataset.soma]); // Zellkörper: zuletzt gewählter Ausbau dieses Neurons
  }
};
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);
app.addEventListener('wheel', (e) => {
  if (app.dataset.view === 'main' || e.target.closest('.sheet, .modal')) return;
  e.preventDefault();
  app.classList.add('panning');
  setPan(pan.x - e.deltaX, pan.y - e.deltaY);
  clearTimeout(app._wheelEnd);
  app._wheelEnd = setTimeout(() => app.classList.remove('panning'), 120);
}, { passive: false });

/* ---------- Eingaben ---------- */
function onMark(ref) {
  const [kind, idStr] = ref.split(':');
  const id = +idStr;
  const d = derive(S);
  if (S.mark && S.mark.kind === kind && S.mark.id === id) { S.mark = null; render(true); return; }
  if (kind === 'site') {
    const x = getSite(S, id);
    if (!x) return;
    if (x.id === S.at) { toast('Hier frisst der Schwarm gerade.'); return; }
    if (x.dead) { toast('Diese Stelle ist versiegt.'); return; }
    if (!targetable(S, x, d)) { toast(`<b>${CFG.siteTypes[x.type].name}</b> ist erst ab Antrieb ${fmt(siteThreshold(x))} erreichbar.`); return; }
    S.mark = { kind, id };
    S.stats.marks++;
    if (rate(S, x, d).A <= 0) toast(`Hinweis: <b>${CFG.siteTypes[x.type].name}</b> versiegt vor der Ankunft.`);
  } else {
    const f = getFind(S, id);
    if (!f) return;
    if (!findTargetable(S, f, d)) { toast(`Zone ${f.zone} ist erst ab Antrieb ${fmt(CFG.zones[f.zone].threshold)} erreichbar.`); return; }
    S.mark = { kind, id };
    S.stats.marks++;
  }
  render(true);
}

function save() {

  if (!Array.isArray(s.hist) || s.hist.length !== HIST_LEN) { s.hist = new Array(HIST_LEN).fill(0); s.histI = 0; s.histSum = 0; }

}
function load() {

    const s = migrate(JSON.parse(raw));

async function catchUp(seconds) {
  const steps = Math.floor(Math.min(seconds, CFG.offlineMax) / CFG.dt);
  if (steps <= 0) return;
  const before = { vorrat: S.vorrat, total: S.stats.total, noHarvest: S.stats.noHarvest, units: S.units.slice(), zone: S.zone };
  const ev = { arrive: 0, zones: [], dry: 0, finds: [] };
  const log = (type, x) => {
    if (type === 'arrive') ev.arrive++;
    else if (type === 'zone') ev.zones.push(CFG.zones[x.to].name);
    else if (type === 'dry') ev.dry++;
    else if (type === 'find') ev.finds.push(CFG.finds.types[x.type].name);
  };
  const busy = steps > 20000;
  if (busy) $('busy').classList.add('open');
  const CHUNK = 20000;
  for (let i = 0; i < steps; i += CHUNK) {
    const n = Math.min(CHUNK, steps - i);
    for (let j = 0; j < n; j++) step(S, log);
    if (busy) { $('busyText').textContent = `Nachberechnung … ${Math.round(((i + n) / steps) * 100)} %`; await new Promise((r) => setTimeout(r, 0)); }
  }
  $('busy').classList.remove('open');
  if (seconds < 60) return;
  const harvested = S.stats.total - before.total;
  openModal(`<h2>Während du weg warst</h2>
    <p><b>${fmtDuration(steps * CFG.dt)}</b> nachberechnet${seconds > CFG.offlineMax ? ' (höchstens 24 Stunden)' : ''}.</p>
    <div class="loglist">
      <div>Gesamternte: <b>${fmt(harvested)}</b> · Vorrat jetzt <b>${fmt(S.vorrat)}</b></div>
      <div>Ankünfte an Stellen: <b>${ev.arrive}</b></div>
      ${ev.zones.map((z) => `<div>Wechsel in die nächste Zone: <b>${z}</b></div>`).join('')}
      <div>Versiegte Stellen: <b>${ev.dry}</b></div>
      <div>Dauer ohne Ernte: <b>${fmtDuration(S.stats.noHarvest - before.noHarvest)}</b></div>
      ${ev.finds.length ? `<div>Fundstücke: <b>${ev.finds.join(', ')}</b></div>` : ''}
      <div>Fresslinge: <b>${fmtInt(before.units[0])} → ${fmtInt(S.units[0])}</b></div>
    </div>
    <div class="modal__actions"><button class="btn btn--gold" data-act="close">Weiter</button></div>`);
}

/* ---------- Messung der Darstellung (nur mit ?messung) ---------- */
// Gemessen wird der Abstand der requestAnimationFrame-Aufrufe. Verlorene Frames werden gegen die

const PERF_KEY = 'idleswarm-prototyp-messung';

  { stress: 10, canvas: false, motion: false },
  { stress: 1, canvas: true, motion: true },
  { stress: 3, canvas: true, motion: true },
  { stress: 10, canvas: true, motion: true },

const perfLabel = (r) => `×${r.stress} · ${r.canvas ? 'Canvas' : 'SVG'}${r.motion === false ? ' · ohne Bewegung' : ''}${r.blur === false ? ' · Blur aus' : ''}`;
const PERF_PHASES = [

  { name: 'Zoom → Schwarm', ms: 2000, start: () => setView('main') },
  { name: 'Zoom → Ausbau', ms: 2000, start: () => setView('neuron') },
  { name: 'Zoom → Schwarm', ms: 2000, start: () => setView('main') },
  { name: 'Aufbruch, Wanderung', ms: 4000, start: () => { S.leave = true; } },

function perfScenario() {
  const s = newGame(4242);
  const goal = s.sites.find((x) => CFG.siteTypes[x.type].goal);
  s.zone = goal.zone;
  s.sites = s.sites.filter((x) => x.zone >= s.zone);
  s.finds = s.finds.filter((x) => x.zone >= s.zone);
  s.pos = { x: goal.x, y: goal.y };
  s.at = goal.id;
  s.units = [1e6, 1e4, 1e3, 1e3, 1e3, 1e3];

function perfStart() {

  r.phase++;
  r.t0 = now;
  if (r.phase >= PERF_PHASES.length) { r.results.push(r.result); perfNextRun(now); return; }
  const next = PERF_PHASES[r.phase];
  if (next.start) next.start();
  renderPerfMeter();
}
function perfFinish(aborted) {
  const r = perf.run;
  if (!r) return;
  perf.run = null;
  app.classList.remove('panning');
  S = JSON.parse(r.saved);
  STRESS = r.stress;
  app.classList.toggle('no-blur', !r.blur);
  applyCanvas(r.canvas);
  setMotion(r.motion);
  speed = r.speed;
  resetRenderCaches();
  setView(r.view);
  $('perfBlock').hidden = true;
  renderPerfMeter();
  if (aborted) { toast('Messlauf abgebrochen.'); return; }
  const base = perfBase(r.all);
  const res = {
    at: new Date().toLocaleString('de-DE'),
    device: { ua: navigator.userAgent, dpr: Math.round(devicePixelRatio * 100) / 100, w: innerWidth, h: innerHeight, cores: navigator.hardwareConcurrency || null, mem: navigator.deviceMemory || null, hz: Math.round(1000 / base) },
    runs: r.results.map((x) => ({ stress: x.stress, canvas: x.canvas, motion: x.motion, phases: x.phases.map((p) => ({ name: p.name, ...perfStats(p.samples, base) })) })),
  };
  try { localStorage.setItem(PERF_KEY, JSON.stringify(res)); } catch { /* Speicher voll oder gesperrt */ }
  showPerfResult(res);
}
function perfLoad() {
  try { return JSON.parse(localStorage.getItem(PERF_KEY)); } catch { return null; }
}
function perfText(res) {
  const d = res.device, n = (v, w) => String(Math.round(v)).padStart(w);
  let t = `IdleSwarm Messlauf ${res.at}\n${d.ua}\nDPR ${String(d.dpr).replace(".", ",")} · ${d.w}×${d.h} · Kerne ${d.cores ?? '?'} · RAM ${d.mem ?? '?'} GB · ~${d.hz} Hz\n`;
  for (const r of res.runs) {
    t += `\n${perfLabel(r)}\n`;
    for (const p of r.phases) t += `${p.name.padEnd(21)} ${n(p.fps, 3)} fps ${dec(p.lost, 1).padStart(5)} % verloren  p95 ${n(p.p95, 3)} ms  max ${n(p.max, 4)} ms\n`;
  }
  return t;
}
function showPerfResult(res) {
  const d = res.device;
  const cls = (lost) => (lost < 5 ? 'p-ok' : lost < 15 ? 'p-mid' : 'p-bad');
  const tables = res.runs.map((r) => `<h3>${perfLabel(r)}</h3>
    <table class="ptable"><thead><tr><th>Abschnitt</th><th>fps</th><th>verloren</th><th>p95</th><th>max</th></tr></thead><tbody>
    ${r.phases.map((p) => `<tr><td>${p.name}</td><td>${Math.round(p.fps)}</td><td class="${cls(p.lost)}">${dec(p.lost, 1)} %</td><td>${Math.round(p.p95)} ms</td><td>${Math.round(p.max)} ms</td></tr>`).join('')}
    </tbody></table>`).join('');
  openModal(`<h2>Messlauf</h2>
    <p>${res.at} · ~${d.hz} Hz · DPR ${String(d.dpr).replace(".", ",")} · ${d.w}×${d.h}. Verlorene Frames: grün unter 5 %, gelb unter 15 %, rot darüber.</p>
    ${tables}
    <h3>Als Text</h3>
    <textarea readonly id="perfTa">${perfText(res)}</textarea>
    <div class="modal__actions modal__actions--2"><button class="btn" data-act="perfCopy">Kopieren</button><button class="btn btn--gold" data-act="close">Fertig</button></div>`);
}
function perfMenuHtml() {
  const blurOn = !app.classList.contains('no-blur');
  return `<h3>Messung</h3>
    <p>Ohne Messung zeichnet der Prototyp mit Canvas. Der Messlauf spielt einen festen Ablauf mit großem Schwarm in sieben Stufen ab: SVG mit ×1, ×3, ×10 und ×10 ohne Bewegung, dann Canvas mit ×1, ×3 und ×10. Er dauert etwa zweieinhalb Minuten. Dabei das Smartphone nicht berühren und den Bildschirm anlassen. Der Spielstand bleibt unverändert.</p>
    <div class="perf-row"><span>Anzeige</span><div class="seg">${[['1', 'an'], ['0', 'aus']].map(([v, l]) => `<button data-act="perfMeter" data-v="${v}" aria-pressed="${(v === '1') === perf.meter}">${l}</button>`).join('')}</div></div>
    <div class="perf-row"><span>Belastung</span><div class="seg">${[1, 3, 10].map((x) => `<button data-act="perfStress" data-v="${x}" aria-pressed="${x === STRESS}">×${x}</button>`).join('')}</div></div>
    <div class="perf-row"><span>Zeichenfläche</span><div class="seg">${[['0', 'SVG'], ['1', 'Canvas']].map(([v, l]) => `<button data-act="perfCanvas" data-v="${v}" aria-pressed="${(v === '1') === CANVAS}">${l}</button>`).join('')}</div></div>
    <div class="perf-row"><span>Bewegung</span><div class="seg">${[['1', 'an'], ['0', 'aus']].map(([v, l]) => `<button data-act="perfMotion" data-v="${v}" aria-pressed="${(v === '1') === MOTION}">${l}</button>`).join('')}</div></div>
    <div class="perf-row"><span>Weichzeichner</span><div class="seg">${[['1', 'an'], ['0', 'aus']].map(([v, l]) => `<button data-act="perfBlur" data-v="${v}" aria-pressed="${(v === '1') === blurOn}">${l}</button>`).join('')}</div></div>
    <div class="modal__actions modal__actions--2">
      <button class="btn" data-act="perfLast"${perfLoad() ? '' : ' aria-disabled="true"'}>Letztes Ergebnis</button>
      <button class="btn btn--gold" data-act="perfRun">Messlauf starten</button>
    </div>`;
}

/* ---------- Spielschleife ---------- */
let last = performance.now(), acc = 0, sinceSave = 0, paused = false;
function frame(now) {
  if (!paused) {
    const el = Math.min((now - last) / 1000, 1);
    acc += el * speed;
    sinceSave += el;
    let n = 0;
    while (acc >= CFG.dt && n < 2000) { noteStock(); step(S, liveLog); acc -= CFG.dt; n++; }
    if (n >= 2000) acc = 0;
    if (S.ended && !S.endSeen) showEnd();
    if (sinceSave >= CFG.saveEvery) { sinceSave = 0; save(); }
    render(false);
  }
  if (CANVAS) cvDraw(now);
  last = now;
  requestAnimationFrame(frame);
}
let hiddenAt = null;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { if (perf.run) perfFinish(true); hiddenAt = Date.now(); save(); return; }
  if (hiddenAt != null) {
    const gap = (Date.now() - hiddenAt) / 1000;
    hiddenAt = null;
    if (gap > 2) { paused = true; await catchUp(gap); paused = false; last = performance.now(); render(true); }
  }
});
window.addEventListener('pagehide', save);

/* ---------- Start ---------- */
(async function init() {
  buildUnits();
  renderNeuronOrganelles();
  app.style.setProperty('--nsc', NEURON_SCALE);
  applyCanvas(true);
  const res = load();
  S = res.s;
  app.dataset.view = fromHash[location.hash] || 'main';
  document.querySelectorAll('.views__btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.go === app.dataset.view)));
  render(true);
  if (app.dataset.view === 'neuron') focusUp();
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('no-anim')));
  if (!res.fresh) {
    paused = true;
    await catchUp((Date.now() - (S.savedAt || Date.now())) / 1000);
    paused = false;
    last = performance.now();
    render(true);
  } else {
    if (res.reset) toast('Der alte Spielstand passte nicht zu dieser Version und wurde zurückgesetzt.');
    else toast('Kaufe <b>Fresslinge</b> – sie fressen den Algenfilm. Ist er leer, zieht der Schwarm weiter.');
    save();
  }
  requestAnimationFrame(frame);
  if (PERF) requestAnimationFrame(perfFrame);
})();
</script>
