<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IdleSwarm · Dummy B: Gezeitenkreis</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      :root {
        --bg: #061a1f;
        --surface: #0c2a30;
        --surface-2: #123940;
        --border: #1f525a;
        --fg: #e6f6f3;
        --muted: #8fbab4;
        --accent: #7ee0b5;
        --accent-fg: #04261a;
        --zone-0: #1d6b73;
        --zone-1: #175a66;
        --zone-2: #124a5a;
        --zone-3: #0e3b4d;
        --radius: 18px;
      }
      body {
        background: radial-gradient(circle at 50% 40%, #0d3a40 0, var(--bg) 70%);
        min-height: 100vh;
      }
      .layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 300px;
        gap: 1rem;
        padding: 1rem;
        min-height: 100vh;
      }
      @media (max-width: 1150px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .stage {
          order: -1;
        }
      }
      .side {
        display: grid;
        gap: 0.8rem;
        align-content: start;
      }
      .box {
        background: color-mix(in srgb, var(--surface) 85%, transparent);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.9rem 1rem;
        backdrop-filter: blur(6px);
      }
      .box h2 {
        font-size: 15px;
        margin-bottom: 0.6rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .seg button {
        font: inherit;
        font-size: 12px;
        background: transparent;
        color: var(--fg);
        border: 0;
        padding: 0.15rem 0.6rem;
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }
      .unit {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.1rem 0.6rem;
        padding: 0.5rem 0;
        border-top: 1px solid var(--border);
      }
      .unit:first-child {
        border-top: 0;
      }
      .unit__name {
        font-weight: 600;
      }
      .unit__count {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .unit__meta {
        grid-column: 1 / -1;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .unit__buy {
        grid-column: 1 / -1;
        width: 100%;
        text-align: left;
        display: flex;
        justify-content: space-between;
      }
      .unit--locked {
        opacity: 0.4;
      }
      .stage {
        position: relative;
        display: grid;
        place-items: center;
      }
      .hud {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
        z-index: 2;
        width: 100%;
      }
      .pill {
        background: color-mix(in srgb, var(--surface) 90%, transparent);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
        font-variant-numeric: tabular-nums;
        display: grid;
        line-height: 1.15;
        text-align: center;
      }
      .pill small {
        color: var(--muted);
        font-size: 11px;
      }
      .pill strong {
        font-size: 16px;
      }
      .pill--status {
        align-content: center;
        font-weight: 700;
      }
      .pill--frisst {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .pill--unterwegs {
        color: var(--warn);
        border-color: var(--warn);
      }
      .pill--stelle-leer,
      .pill--keine-stelle {
        color: var(--danger);
        border-color: var(--danger);
      }
      .map-box {
        position: relative;
        width: min(100%, calc(100vh - 2rem));
        aspect-ratio: 1;
        margin-top: 3.5rem;
      }
      .map {
        width: 100%;
        height: 100%;
        display: block;
      }
      .map [data-action] {
        cursor: pointer;
      }
      .popover {
        position: absolute;
        transform: translate(-50%, calc(-100% - 18px));
        width: 230px;
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 14px;
        padding: 0.7rem 0.8rem;
        display: grid;
        gap: 0.35rem;
        z-index: 3;
        box-shadow: 0 10px 30px #0008;
        font-size: 13px;
      }
      .popover__close {
        position: absolute;
        top: 4px;
        right: 8px;
        background: none;
        border: 0;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
      }
      .here {
        position: absolute;
        bottom: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, 100%);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.3rem 1rem;
        align-items: center;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 0.7rem 1rem;
        z-index: 2;
      }
      .here__meta {
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .upg {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.1rem 0.6rem;
        padding: 0.5rem 0;
        border-top: 1px solid var(--border);
        align-items: center;
      }
      .upg:first-of-type {
        border-top: 0;
      }
      .upg__meta {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .warn {
        color: var(--warn);
        font-size: 12.5px;
      }
      .effect {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--find);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="side">
        <section class="box" id="chain"></section>
      </aside>
      <section class="stage">
        <div class="hud" id="hud"></div>
        <div class="map-box" id="mapbox">
          <svg class="map" id="map" viewBox="-305 -305 610 610" role="img" aria-label="Ringkarte der Winzlinge"></svg>
          <div id="popover"></div>
          <div class="here" id="here"></div>
        </div>
      </section>
      <aside class="side">
        <section class="box" id="upgrades"></section>
        <section class="box" id="effects"></section>
        <section class="box" id="log"></section>
      </aside>
    </div>

    <script src="shared/sim.js"></script>
    <script src="shared/ui.js"></script>
    <script>
      const sim = IdleSwarmSim.create({ geometry: 'rings' });
      const { CFG } = sim;
      const U = IdleSwarmUI;
      const { num, int, rate, time, esc } = U;
      const R = sim.geo.radii;
      const COLOR = { algenfilm: '#8be28f', plankton: '#a6dcff', krebs: '#ffab7a', schnee: '#f2f6fa', seegras: '#3fd17a' };
      let buyMode = '1';
      let selected = null;
      const $ = (id) => document.getElementById(id);

      function blobPath(x, y, r, seed) {
        const pts = [];
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2;
          const rr = r * (0.82 + 0.18 * Math.sin(seed * 3.1 + i * 1.7));
          pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
        }
        let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[(i + 1) % pts.length];
          const c = pts[i];
          d += ` Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${((c[0] + p[0]) / 2).toFixed(1)} ${((c[1] + p[1]) / 2).toFixed(1)}`;
        }
        return d + 'Z';
      }

      function radius(p) {
        if (p.type === 'seegras') return 13;
        return Math.max(4, Math.min(12, 3 + 1.4 * Math.log10(p.size / 1000)));
      }

      function renderHud(d) {
        const s = sim.state;
        const st = U.statusOf(sim, d);
        U.setHTML(
          $('hud'),
          `<div class="pill"><small>Vorrat · Kap. ${num(d.capacity)}</small><strong style="color:${s.vorrat > d.capacity ? 'var(--warn)' : 'inherit'}">${num(s.vorrat)}</strong></div>
          <div class="pill"><small>Eier · ${d.starre ? 'ruhen' : rate(d.eggRate)}</small><strong>${int(s.eier)}</strong></div>
          <div class="pill"><small>Ernte · Appetit ${num(d.appetite)}</small><strong>${rate(d.harvest)}</strong></div>
          <div class="pill"><small>Antrieb / Masse</small><strong>${num(d.thrust)} / ${num(d.mass)}</strong></div>
          <div class="pill pill--status pill--${st.code}">${esc(st.text)}</div>`,
        );
      }

      function renderMap(d) {
        const s = sim.state;
        const out = [];
        out.push(`<defs>
          <radialGradient id="water"><stop offset="0" stop-color="#2aa1a0"/><stop offset="1" stop-color="#0b2f3d"/></radialGradient>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#00000055" stroke-width="3"/></pattern>
          ${[0, 1, 2, 3].map((z) => `<path id="arc${z}" d="M ${-(R[z + 1] - 9)} 0 A ${R[z + 1] - 9} ${R[z + 1] - 9} 0 0 1 ${R[z + 1] - 9} 0"/>`).join('')}
        </defs>`);
        for (let z = 3; z >= 0; z--) {
          const locked = z > d.reachZone;
          out.push(`<circle r="${R[z + 1]}" fill="var(--zone-${z})" stroke="#ffffff22"/>`);
          if (locked) out.push(`<circle r="${R[z + 1]}" fill="url(#hatch)"/>`);
        }
        for (let z = 0; z < 4; z++) {
          const locked = z > d.reachZone;
          out.push(`<text font-size="10" fill="${locked ? 'var(--muted)' : 'var(--fg)'}" letter-spacing="1.5"><textPath href="#arc${z}" startOffset="50%" text-anchor="middle">${locked ? '🔒 ' : ''}${esc(CFG.zones[z].name.toUpperCase())} · ANTRIEB ${num(CFG.zones[z].threshold)}</textPath></text>`);
        }
        out.push(`<circle cx="${s.pos.x}" cy="${s.pos.y}" r="${d.range}" fill="#7ee0b50c" stroke="var(--accent)" stroke-opacity=".45" stroke-dasharray="3 5"/>`);

        if (s.travel) out.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${s.travel.to.x}" y2="${s.travel.to.y}" stroke="var(--warn)" stroke-width="2" stroke-linecap="round"/>`);
        else {
          const next = sim.nextTarget();
          if (next) out.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${next.obj.x}" y2="${next.obj.y}" stroke="${next.reason === 'mark' ? 'var(--mark)' : '#ffffff66'}" stroke-dasharray="1 5" stroke-linecap="round" stroke-width="2"/>`);
        }

        for (const p of s.places) {
          if (!p.known) continue;
          const r = radius(p);
          const frac = p.sealed ? 0 : Math.max(0.12, Math.sqrt(p.stock / p.size));
          const reachable = d.thrust >= sim.placeThreshold(p);
          const isMark = s.mark && s.mark.kind === 'place' && s.mark.id === p.id;
          const isSel = selected && selected.kind === 'place' && selected.id === p.id;
          out.push(`<g data-action="select" data-kind="place" data-id="${p.id}" opacity="${p.sealed ? 0.3 : reachable ? 1 : 0.45}">
            <circle cx="${p.x}" cy="${p.y}" r="${r + 6}" fill="transparent"/>
            <path d="${blobPath(p.x, p.y, r, p.id)}" fill="${COLOR[p.type]}" opacity=".22"/>
            <path d="${blobPath(p.x, p.y, r * frac, p.id)}" fill="${COLOR[p.type]}"/>
            ${isMark ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 5}" fill="none" stroke="var(--mark)" stroke-width="2.5"/>` : ''}
            ${isSel ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 8}" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="2 3"/>` : ''}
          </g>`);
        }
        for (const f of s.finds) {
          const ok = sim.findTargetable(f);
          const isMark = s.mark && s.mark.kind === 'find' && s.mark.id === f.id;
          const pulse = 9 + Math.sin(s.t * 3) * 1.5;
          out.push(`<g data-action="select" data-kind="find" data-id="${f.id}" opacity="${ok ? 1 : 0.5}">
            <circle cx="${f.x}" cy="${f.y}" r="${pulse}" fill="#f7a8ff22" stroke="${isMark ? 'var(--mark)' : 'var(--find)'}" stroke-width="${isMark ? 2.5 : 1.2}"/>
            <text x="${f.x}" y="${f.y + 4}" text-anchor="middle" font-size="11">${CFG.finds[f.type].icon}</text>
          </g>`);
        }
        const n = Math.min(18, 4 + Math.floor(Math.log10(1 + s.units[0]) * 3));
        let dots = '';
        for (let i = 0; i < n; i++) {
          const a = i * 2.39 + s.t * (s.travel ? 0.8 : 1.6);
          const rr = 3 + (i % 5) * 1.6;
          dots += `<ellipse cx="${(s.pos.x + Math.cos(a) * rr).toFixed(1)}" cy="${(s.pos.y + Math.sin(a) * rr).toFixed(1)}" rx="1.8" ry="1.1" fill="#d7fff0" transform="rotate(${((a * 180) / Math.PI).toFixed(0)} ${(s.pos.x + Math.cos(a) * rr).toFixed(1)} ${(s.pos.y + Math.sin(a) * rr).toFixed(1)})"/>`;
        }
        out.push(dots);
        U.setHTML($('map'), out.join(''));
      }

      function renderPopover(d) {
        const s = sim.state;
        if (!selected) return U.setHTML($('popover'), '');
        const obj = selected.kind === 'place' ? sim.placeById(selected.id) : sim.findById(selected.id);
        if (!obj || (selected.kind === 'place' && !obj.known)) {
          selected = null;
          return U.setHTML($('popover'), '');
        }
        const left = ((obj.x + 305) / 610) * 100;
        const top = ((obj.y + 305) / 610) * 100;
        const isMark = s.mark && s.mark.kind === selected.kind && s.mark.id === obj.id;
        let body = '';
        let can = false;
        if (selected.kind === 'place') {
          const t = CFG.placeTypes[obj.type];
          const info = sim.travelInfo(obj);
          const reachable = d.thrust >= sim.placeThreshold(obj);
          can = sim.placeTargetable(obj) && obj !== d.here;
          body = `<strong>${t.name}</strong><span class="muted">${esc(CFG.zones[obj.zone].name)} · ${esc(t.trait)}</span>
            <div class="meter"><div class="meter__fill" style="width:${(obj.sealed ? 0 : obj.stock / obj.size) * 100}%;background:${COLOR[obj.type]}"></div></div>
            <span class="num">${num(obj.stock)} / ${num(obj.size)} Nahrung</span>
            ${obj === d.here ? '<span class="muted">Hier frisst der Schwarm gerade.</span>' : obj.sealed ? '<span class="warn">Versiegt</span>' : !reachable ? `<span class="warn">Braucht Antrieb ${num(sim.placeThreshold(obj))}</span>` : `<span class="num muted">Reise ${time(info.time)} · Ø ${rate(info.avg)}</span>`}`;
        } else {
          const f = CFG.finds[obj.type];
          can = sim.findTargetable(obj);
          body = `<strong>${f.icon} ${f.name}</strong><span class="muted">${f.text}</span>
            ${can ? `<span class="num muted">Reise ${time(sim.travelInfo(obj).time)} · Umweg lohnt sich?</span>` : `<span class="warn">Vorschau – ansteuerbar ab Antrieb ${num(CFG.zones[obj.zone].threshold)}</span>`}`;
        }
        U.setHTML(
          $('popover'),
          `<div class="popover" style="left:${left}%;top:${top}%;${top < 35 ? 'transform:translate(-50%,18px)' : ''}">
            <button class="popover__close" data-action="close" aria-label="Schließen">×</button>
            ${body}
            ${isMark ? `<button class="btn btn--mark" data-action="mark">Markierung aufheben</button>` : can ? `<button class="btn btn--primary" data-action="mark">🚩 Hierhin als Nächstes</button>` : ''}
          </div>`,
        );
      }

      function renderHere(d) {
        const s = sim.state;
        const next = sim.nextTarget();
        const nextName = next ? (next.kind === 'place' ? CFG.placeTypes[next.obj.type].name : CFG.finds[next.obj.type].name) : null;
        const nextLine = next ? `${next.reason === 'mark' ? '🚩' : '→'} danach: ${nextName} (${esc(CFG.zones[next.obj.zone].name)})` : 'Kein Ziel bekannt';
        const warn = sim.markWarning();
        let main;
        if (s.travel) {
          const left = (s.travel.dist - s.travel.done) / d.speed;
          main = `<div><strong>Unterwegs · noch ${time(left)}</strong><div class="here__meta">Starre: keine Eier, keine Erzeugung · ${nextLine}</div></div><span></span>`;
        } else if (d.here) {
          const t = CFG.placeTypes[d.here.type];
          main = `<div><strong>${t.name}</strong> <span class="muted">· ${esc(CFG.zones[d.here.zone].name)}</span>
            <div class="meter" style="margin:.3rem 0"><div class="meter__fill" style="width:${(d.here.stock / d.here.size) * 100}%;background:${COLOR[d.here.type]}"></div></div>
            <div class="here__meta">${num(d.here.stock)} Nahrung · ${d.timeToEmpty !== null ? `leer in ${time(d.timeToEmpty)}` : 'versiegt nie'} · ${nextLine}</div></div>
            <button class="btn" data-action="leave">Verlassen</button>`;
        } else main = `<div><strong>An keiner Stelle</strong><div class="here__meta">${nextLine}</div></div><span></span>`;
        U.setHTML($('here'), main + (warn ? `<div class="warn" style="grid-column:1/-1">⚠ ${warn}</div>` : ''));
      }

      function renderChain(d) {
        const s = sim.state;
        const modes = [
          ['1', '1'],
          ['25', '25 %'],
          ['max', 'Max'],
        ];
        const rows = CFG.units
          .map((u, i) => {
            if (!s.unlocked[i]) return `<div class="unit unit--locked"><span class="unit__name">🔒 ${u.name}</span><span></span><span class="unit__meta">ab 1 ${CFG.units[i - 1].name}</span></div>`;
            const max = sim.maxBuy(i);
            const n = buyMode === 'max' ? max : buyMode === '25' ? Math.max(1, Math.floor(max * 0.25)) : 1;
            const ok = max >= 1;
            const effect = i === 0 ? `erntet ${num(d.feed)}/s` : `+${rate(d.production[i - 1])} ${CFG.units[i - 1].plural}`;
            return `<div class="unit">
              <span class="unit__name">${u.name}</span><span class="unit__count">${int(s.units[i])}</span>
              <span class="unit__meta">${effect} · Masse ${num(u.mass)}</span>
              <button class="btn unit__buy" data-action="buy" data-i="${i}" ${ok ? '' : 'disabled'}><span>+${int(ok ? n : 1)}</span><span class="muted">${num(u.cost * Math.max(1, ok ? n : 1))} V · ${int(ok ? n : 1)} Ei${i ? ` · ${num(u.req * Math.max(1, ok ? n : 1))} ${CFG.units[i - 1].plural}` : ''}</span></button>
            </div>`;
          })
          .join('');
        U.setHTML(
          $('chain'),
          `<h2>Schwarm <span class="seg">${modes.map(([k, l]) => `<button data-action="mode" data-v="${k}" aria-pressed="${buyMode === k}">${l}</button>`).join('')}</span></h2>${rows}`,
        );
      }

      function renderUpgrades(d) {
        const s = sim.state;
        U.setHTML(
          $('upgrades'),
          `<h2>Ausbauten ${s.freeRanks ? `<span class="warn">✨ ${s.freeRanks} gratis</span>` : ''}</h2>` +
            CFG.upgradeOrder
              .map((k) => {
                const u = CFG.upgrades[k];
                const l = s.upg[k];
                const cost = sim.upgradeCost(k);
                return `<div class="upg"><div><strong>${u.name}</strong> <span class="muted">${l}</span>
                  <div class="upg__meta">${u.label}: ${num(u.effect(l))} → ${num(u.effect(l + 1))}${k === 'geisseln' ? ` · Sicht ${num(d.range)}` : ''}</div></div>
                  <button class="btn btn--small" data-action="upg" data-k="${k}" ${s.freeRanks || s.vorrat >= cost ? '' : 'disabled'}>${s.freeRanks ? '✨' : num(cost)}</button></div>`;
              })
              .join(''),
        );
        const eff = Object.entries(s.effects).filter(([, v]) => v > 0);
        U.setHTML(
          $('effects'),
          `<h2>Wirkungen</h2>${eff.length ? eff.map(([k, v]) => `<div class="effect"><span>${CFG.finds[k].icon} ${CFG.finds[k].name}</span><span>${time(v)}</span></div>`).join('') : '<span class="muted">Leuchtende Fundstücke auf der Karte antippen.</span>'}`,
        );
        U.setHTML(
          $('log'),
          `<h2>Geschehen</h2><ul class="log">${s.log
            .slice(0, 7)
            .map((e) => `<li class="log__item log__item--${e.kind}">${esc(e.text)}</li>`)
            .join('')}</ul>`,
        );
      }

      function render() {
        const d = sim.derive();
        renderHud(d);
        renderMap(d);
        renderPopover(d);
        renderHere(d);
        renderChain(d);
        renderUpgrades(d);
      }

      U.delegate(document.body, (action, data) => {
        if (action === 'mode') buyMode = data.v;
        if (action === 'buy') sim.buyUnit(Number(data.i), buyMode);
        if (action === 'upg') sim.buyUpgrade(data.k);
        if (action === 'leave') sim.leave();
        if (action === 'select') selected = { kind: data.kind, id: Number(data.id) };
        if (action === 'close') selected = null;
        if (action === 'mark' && selected) {
          sim.toggleMark(selected.kind, selected.id);
          selected = null;
        }
        render();
      });
      U.run(sim, render);
    </script>
  </body>
</html>
