<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IdleSwarm · Dummy E: Tiefenschichten</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      :root {
        --bg: #02121a;
        --surface: #0a2230;
        --surface-2: #10303f;
        --border: #1d4a5c;
        --fg: #e4f4f8;
        --muted: #8bb3c3;
        --accent: #8ef0c0;
        --accent-fg: #052a1a;
        --zone-0: #2a8a8c;
        --zone-1: #1c6b7a;
        --zone-2: #134f66;
        --zone-3: #0c3650;
      }
      body {
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      @media (max-width: 860px) {
        body {
          grid-template-columns: 1fr;
          height: auto;
          overflow: auto;
        }
        .stage {
          height: 70vh;
        }
      }
      .stage {
        position: relative;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 30%, #0e3a48, var(--bg) 75%);
      }
      .view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .view [data-action] {
        cursor: pointer;
      }
      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        z-index: 2;
      }
      .chip-res {
        background: #031a24cc;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }
      .chip-res b {
        font-size: 15px;
      }
      .chip-res small {
        color: var(--muted);
      }
      .peek {
        position: absolute;
        top: 52px;
        left: 12px;
        z-index: 2;
        font-size: 15px;
        text-shadow: 0 1px 4px #000;
      }
      .card-slot {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 2;
      }
      .now {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 2;
        max-width: 420px;
        background: #031a24dd;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.6rem 0.8rem;
        display: grid;
        gap: 0.35rem;
        font-size: 13px;
      }
      .gauge {
        background: var(--surface);
        border-left: 1px solid var(--border);
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 0.9rem 0.8rem;
        gap: 0.6rem;
        min-height: 0;
      }
      .gauge h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .layers {
        display: grid;
        grid-auto-rows: 1fr;
        gap: 0.35rem;
      }
      .layer {
        font: inherit;
        text-align: left;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.5rem 0.6rem;
        cursor: pointer;
        display: grid;
        align-content: center;
        gap: 0.15rem;
        position: relative;
      }
      .layer[aria-current='true'] {
        outline: 2px solid var(--accent);
      }
      .layer--locked {
        opacity: 0.55;
      }
      .layer b {
        font-size: 14px;
      }
      .layer small {
        color: #ffffffb0;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      .layer__swarm {
        position: absolute;
        right: 8px;
        top: 6px;
        font-size: 12px;
        background: var(--accent);
        color: var(--accent-fg);
        border-radius: 99px;
        padding: 0 0.45rem;
        font-weight: 700;
      }
      .drawer {
        grid-column: 1 / -1;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      .drawer__bar {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        padding: 0.4rem 0.9rem;
      }
      .drawer__bar .chip {
        font-size: 13px;
        padding: 0.2rem 0.8rem;
      }
      .drawer__body {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 0 1.5rem;
        padding: 0 0.9rem 0.8rem;
        max-height: 34vh;
        overflow-y: auto;
      }
      .drawer__body .plist__row {
        border-top: 1px solid var(--border);
      }
      .drawer__grid {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 0 1.5rem;
      }
    </style>
  </head>
  <body>
    <section class="stage">
      <svg class="view" id="view" viewBox="-30 -30 320 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Aktuelle Schicht"></svg>
      <div class="hud" id="hud"></div>
      <div class="peek" id="peek"></div>
      <div class="card-slot" id="card"></div>
      <div class="now" id="now"></div>
    </section>
    <aside class="gauge">
      <h2>Tiefenmesser</h2>
      <div class="layers" id="layers"></div>
      <p class="muted" style="font-size: 12px; margin: 0">
        Jede Zone ist eine eigene Schicht. Die nächste liegt verschwommen darunter. Klick auf eine Schicht zeigt sie an.
      </p>
    </aside>
    <section class="drawer" id="drawer"></section>

    <script src="shared/sim.js"></script>
    <script src="shared/ui.js"></script>
    <script>
      const sim = IdleSwarmSim.create({ geometry: 'layers' });
      const { CFG } = sim;
      const U = IdleSwarmUI;
      const { num, int, rate, esc } = U;
      const PITCH = sim.geo.layerPitch;
      const SIZE = sim.geo.layerSize;
      const COLOR = { algenfilm: '#93ec97', plankton: '#a6dcff', krebs: '#ffab7a', schnee: '#f4f7fb', seegras: '#46d684' };
      const $ = (id) => document.getElementById(id);
      let selected = null;
      let peekLayer = null;
      let drawerTab = 'kette';

      // Feste Schwebeteilchen je Schicht als Dekoration
      const motes = [0, 1, 2, 3].map((z) => {
        let a = 1234 + z * 77;
        const r = () => ((a = (a * 16807) % 2147483647) / 2147483647);
        return Array.from({ length: 40 }, () => ({ x: r() * SIZE, y: r() * SIZE, s: 0.5 + r() * 1.8 }));
      });

      function swarmLayer() {
        const s = sim.state;
        if (s.travel) {
          const tz = sim.geo.zoneOf(s.travel.to);
          const f = s.travel.done / s.travel.dist;
          return f > 0.5 ? tz : sim.geo.zoneOf(s.travel.from);
        }
        return sim.geo.zoneOf(s.pos);
      }

      const rOf = (p) => (p.type === 'seegras' ? 22 : Math.max(3, Math.min(16, 2 + 1.3 * Math.log10(p.size / 1000))));

      function layerContent(z, d, interactive) {
        const s = sim.state;
        const ox = z * PITCH;
        const out = [];
        out.push(`<rect x="0" y="0" width="${SIZE}" height="${SIZE}" rx="26" fill="var(--zone-${z})" fill-opacity=".72" stroke="#ffffff30"/>`);
        for (const m of motes[z]) out.push(`<circle cx="${m.x}" cy="${m.y}" r="${m.s}" fill="#ffffff22"/>`);
        for (const p of s.places) {
          if (!p.known || p.zone !== z) continue;
          const x = p.x - ox;
          const r = rOf(p);
          const frac = p.sealed ? 0 : Math.max(0.15, Math.sqrt(p.stock / p.size));
          const isMark = s.mark && s.mark.kind === 'place' && s.mark.id === p.id;
          const isSel = selected && selected.kind === 'place' && selected.id === p.id;
          const reachable = d.thrust >= sim.placeThreshold(p);
          out.push(`<g ${interactive ? `data-action="select" data-kind="place" data-id="${p.id}"` : ''} opacity="${p.sealed ? 0.3 : reachable ? 1 : 0.6}">
            <circle cx="${x}" cy="${p.y}" r="${r + 5}" fill="transparent"/>
            <circle cx="${x}" cy="${p.y}" r="${r}" fill="${COLOR[p.type]}" fill-opacity=".18"/>
            <circle cx="${x}" cy="${p.y}" r="${r * frac}" fill="${COLOR[p.type]}"/>
            ${isMark ? `<circle cx="${x}" cy="${p.y}" r="${r + 4}" fill="none" stroke="var(--mark)" stroke-width="2.5"/>` : ''}
            ${isSel ? `<circle cx="${x}" cy="${p.y}" r="${r + 7}" fill="none" stroke="#fff" stroke-dasharray="2 3"/>` : ''}
          </g>`);
        }
        for (const f of s.finds) {
          if (f.zone !== z) continue;
          const x = f.x - ox;
          const isMark = s.mark && s.mark.kind === 'find' && s.mark.id === f.id;
          out.push(`<g ${interactive ? `data-action="select" data-kind="find" data-id="${f.id}"` : ''}>
            <circle cx="${x}" cy="${f.y}" r="${9 + Math.sin(s.t * 3)}" fill="#f7a8ff30" stroke="${isMark ? 'var(--mark)' : 'var(--find)'}" stroke-width="${isMark ? 2.5 : 1.3}"/>
            <text x="${x}" y="${f.y + 4}" text-anchor="middle" font-size="11">${CFG.finds[f.type].icon}</text></g>`);
        }
        return out.join('');
      }

      function render() {
        const d = sim.derive();
        const s = sim.state;
        const sl = swarmLayer();
        const vl = peekLayer === null ? sl : peekLayer;
        const out = [];

        // Tiefere Schicht: verkleinert, verschwommen, mit Parallaxe zur Position des Schwarms
        if (vl < 3) {
          const lx = Math.max(0, Math.min(SIZE, s.pos.x - sl * PITCH));
          const px = (lx - SIZE / 2) * -0.12;
          const py = (s.pos.y - SIZE / 2) * -0.12;
          // Größer dargestellt: die tiefere Schicht ist die Welt der größeren Stellen
          out.push(`<defs><filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter></defs>`);
          out.push(`<g transform="translate(${SIZE / 2 + px} ${SIZE / 2 + py}) scale(1.45) translate(${-SIZE / 2} ${-SIZE / 2})" filter="url(#blur)" opacity=".65">${layerContent(vl + 1, d, true)}</g>`);
          out.push(`<rect x="-200" y="-200" width="660" height="660" fill="#02121a" opacity=".3" pointer-events="none"/>`);
          out.push(`<text x="${SIZE / 2}" y="${SIZE + 24}" text-anchor="middle" font-size="9" fill="var(--muted)">darunter: ${esc(CFG.zones[vl + 1].name)}${vl + 1 > d.reachZone ? ` · 🔒 ab Antrieb ${num(CFG.zones[vl + 1].threshold)}` : ''}</text>`);
        }
        // Aktuelle Schicht leicht durchsichtig, damit die Tiefe durchscheint
        out.push(layerContent(vl, d, true));

        if (sl === vl) {
          const sx = Math.max(-14, Math.min(SIZE + 14, s.pos.x - vl * PITCH));
          out.push(`<circle cx="${sx}" cy="${s.pos.y}" r="${d.range}" fill="none" stroke="var(--accent)" stroke-opacity=".4" stroke-dasharray="3 5"/>`);
          const next = s.travel ? null : sim.nextTarget();
          const tgt = s.travel ? s.travel.to : next ? next.obj : null;
          if (tgt) {
            const tz = sim.geo.zoneOf(tgt);
            const tx = tz === vl ? tgt.x - vl * PITCH : tz > vl ? SIZE + 10 : -10;
            const col = s.travel ? 'var(--warn)' : next && next.reason === 'mark' ? 'var(--mark)' : '#ffffff80';
            out.push(`<line x1="${sx}" y1="${s.pos.y}" x2="${tx}" y2="${tgt.y}" stroke="${col}" stroke-width="1.6" stroke-dasharray="${s.travel ? '' : '2 4'}"/>`);
            if (tz !== vl) out.push(`<text x="${tx}" y="${tgt.y - 6}" text-anchor="middle" font-size="9" fill="${col}">${tz > vl ? '↓ abtauchen' : '↑ aufsteigen'} in Schicht ${tz}</text>`);
          }
          let dots = '';
          const n = Math.min(18, 4 + Math.floor(Math.log10(1 + s.units[0]) * 3));
          for (let i = 0; i < n; i++) {
            const a = i * 2.39 + s.t * (s.travel ? 0.8 : 1.6);
            const rr = 2.5 + (i % 5) * 1.5;
            dots += `<circle cx="${(sx + Math.cos(a) * rr).toFixed(1)}" cy="${(s.pos.y + Math.sin(a) * rr).toFixed(1)}" r="1.4" fill="#eafff4"/>`;
          }
          out.push(dots);
        }
        U.setHTML($('view'), out.join(''));

        U.setHTML(
          $('hud'),
          `<span class="chip-res"><small>Vorrat</small> <b>${num(s.vorrat)}</b> <small>/ ${num(d.capacity)}</small></span>
          <span class="chip-res"><small>Eier</small> <b>${int(s.eier)}</b> <small>${d.starre ? 'ruhen' : '+' + rate(d.eggRate)}</small></span>
          <span class="chip-res"><small>Ernte</small> <b>${rate(d.harvest)}</b></span>
          <span class="chip-res"><small>Antrieb</small> <b>${num(d.thrust)}</b> <small>Masse ${num(d.mass)}</small></span>`,
        );
        U.setHTML(
          $('peek'),
          `<b>Schicht ${vl} · ${esc(CFG.zones[vl].name)}</b>${vl > d.reachZone ? ` <span class="warn">🔒 ab Antrieb ${num(CFG.zones[vl].threshold)}</span>` : ''}
          ${peekLayer !== null && peekLayer !== sl ? ` <button class="btn btn--small btn--primary" data-action="peek" data-v="">Zurück zum Schwarm (Schicht ${sl})</button>` : ''}`,
        );
        U.setHTML($('card'), U.targetCard(sim, d, selected));
        const st = U.statusOf(sim, d);
        const warn = sim.markWarning();
        U.setHTML(
          $('now'),
          `<b>${esc(st.text)}</b><span class="muted">${U.nextLine(sim, d)}</span>${warn ? `<span class="warn">⚠ ${warn}</span>` : ''}
          ${d.here ? '<button class="btn" data-action="leave">Stelle verlassen</button>' : ''}`,
        );

        U.setHTML(
          $('layers'),
          CFG.zones
            .map((z, i) => {
              const locked = i > d.reachZone;
              const known = s.places.filter((p) => p.known && !p.sealed && p.zone === i).length;
              const find = s.finds.find((f) => f.zone === i);
              return `<button class="layer ${locked ? 'layer--locked' : ''}" style="background:var(--zone-${i})" data-action="peek" data-v="${i}" aria-current="${vl === i}">
                ${sl === i ? '<span class="layer__swarm">Schwarm</span>' : ''}
                <b>${i} · ${esc(z.name)}</b>
                <small>${locked ? '🔒 ' : ''}Antrieb ${num(z.threshold)}</small>
                <small>${known} Stellen bekannt${find ? ` · ${CFG.finds[find.type].icon}` : ''}${i === 3 ? ' · Seegraswiese' : ''}</small>
              </button>`;
            })
            .join(''),
        );

        const tabs = [
          ['kette', 'Kette'],
          ['ausbau', `Ausbauten${s.freeRanks ? ' ✨' : ''}`],
          ['log', 'Logbuch'],
          ['zu', 'Einklappen'],
        ];
        const body =
          drawerTab === 'kette'
            ? `<div class="drawer__grid">${U.chainList(sim, d)}</div>`
            : drawerTab === 'ausbau'
              ? `<div>${U.upgradeList(sim, d)}</div><div><h3 style="font-size:13px;margin:.5rem 0">Wirkungen</h3>${U.effectsList(sim)}</div>`
              : drawerTab === 'log'
                ? `<div>${U.logList(sim, 10)}</div>`
                : '';
        U.setHTML(
          $('drawer'),
          `<div class="drawer__bar">${tabs.map(([k, l]) => `<button class="chip ${drawerTab === k ? 'chip--on' : ''}" data-action="drawer" data-v="${k}">${l}</button>`).join('')}</div>
          ${body ? `<div class="drawer__body">${body}</div>` : ''}`,
        );
      }

      U.delegate(document.body, (action, data) => {
        if (action === 'buy') sim.buyUnit(Number(data.i), data.mode);
        if (action === 'upg') sim.buyUpgrade(data.k);
        if (action === 'leave') sim.leave();
        if (action === 'select') selected = { kind: data.kind, id: Number(data.id) };
        if (action === 'close') selected = null;
        if (action === 'mark' && selected) {
          sim.toggleMark(selected.kind, selected.id);
          selected = null;
        }
        if (action === 'peek') peekLayer = data.v === '' ? null : Number(data.v);
        if (action === 'drawer') drawerTab = data.v;
        render();
      });
      U.run(sim, render);
    </script>
  </body>
</html>
