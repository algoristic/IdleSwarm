<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IdleSwarm · Dummy G: Sichtfeld</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      :root {
        --bg: #04141c;
        --surface: #0b2230;
        --surface-2: #11303f;
        --border: #1e4558;
        --fg: #e3f2f7;
        --muted: #8db1c1;
        --accent: #6fe3c8;
        --accent-fg: #03261e;
        --zone-0: #1a6a78;
        --zone-1: #155868;
        --zone-2: #104657;
        --zone-3: #0b3546;
      }
      body {
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
      }
      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 62vh auto;
          height: auto;
          overflow: auto;
        }
      }
      .stage {
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #0b3644, var(--bg));
      }
      .view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .view [data-action] {
        cursor: pointer;
      }
      .minimap {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: #02101688;
        border: 1px solid var(--border);
        box-shadow: 0 6px 20px #0008;
      }
      .minimap__label {
        position: absolute;
        top: 206px;
        left: 12px;
        width: 190px;
        text-align: center;
        font-size: 11.5px;
        color: var(--muted);
      }
      .scale {
        position: absolute;
        left: 12px;
        bottom: 12px;
        background: #02101699;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.4rem 0.7rem;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        display: grid;
        gap: 0.2rem;
      }
      .scale__bar {
        height: 4px;
        background: var(--fg);
        border-radius: 2px;
      }
      .card-slot {
        position: absolute;
        right: 12px;
        top: 12px;
      }
      .side {
        background: var(--surface);
        border-left: 1px solid var(--border);
        overflow-y: auto;
        padding: 0.9rem 1rem 5rem;
        display: grid;
        gap: 1rem;
        align-content: start;
      }
      .side h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin-bottom: 0.3rem;
      }
      .res {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem 1rem;
      }
      .res small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .res strong {
        font-size: 17px;
        font-variant-numeric: tabular-nums;
      }
      .res span {
        font-size: 11.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .now {
        background: var(--surface-2);
        border-radius: 10px;
        padding: 0.65rem 0.75rem;
        display: grid;
        gap: 0.4rem;
        font-size: 13px;
      }
      .now__status {
        font-weight: 700;
      }
      .now__status--frisst {
        color: var(--accent);
      }
      .now__status--unterwegs {
        color: var(--warn);
      }
      .now__status--stelle-leer,
      .now__status--keine-stelle {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <section class="stage" id="stage">
      <svg class="view" id="view" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sichtfeld um den Schwarm"></svg>
      <svg class="minimap" id="mini" viewBox="-810 -810 1620 1620" role="img" aria-label="Minimap"></svg>
      <div class="minimap__label" id="minilabel"></div>
      <div class="scale" id="scale"></div>
      <div class="card-slot" id="card"></div>
    </section>
    <aside class="side" id="side"></aside>

    <script src="shared/sim.js"></script>
    <script src="shared/ui.js"></script>
    <script>
      const sim = IdleSwarmSim.create({ geometry: 'bigRings' });
      const { CFG } = sim;
      const U = IdleSwarmUI;
      const { num, int, rate, esc } = U;
      const R = sim.geo.radii;
      const COLOR = { algenfilm: '#8be28f', plankton: '#a6dcff', krebs: '#ffab7a', schnee: '#eef3f8', seegras: '#3fd17a' };
      const $ = (id) => document.getElementById(id);
      let selected = null;
      let viewR = null;
      let refLog = null;
      let cam = null;

      // Fläche ∝ Bestand: Bezugsgröße ist die Basisgröße der höchsten erreichbaren Zone (gleitend)
      const R_REF = 14;
      const rawRadius = (stock) => R_REF * Math.sqrt(Math.max(0, stock) / Math.pow(10, refLog));
      // Obergrenze 20 % des Sichtradius, sonst überdecken Stellen höherer Zonen das Bild
      const radiusFor = (stock) => Math.max(1.4, Math.min(viewR * 0.2, rawRadius(stock)));

      function render() {
        const d = sim.derive();
        const s = sim.state;
        const targetR = d.range * 1.12;
        viewR = viewR === null ? targetR : viewR + (targetR - viewR) * 0.08;
        const targetRef = Math.log10(CFG.baseSize(d.reachZone));
        refLog = refLog === null ? targetRef : refLog + (targetRef - refLog) * 0.06;
        cam = cam === null ? { ...s.pos } : { x: cam.x + (s.pos.x - cam.x) * 0.35, y: cam.y + (s.pos.y - cam.y) * 0.35 };
        renderView(d);
        renderMini(d);
        renderSide(d);
        U.setHTML($('card'), U.targetCard(sim, d, selected));
      }

      function renderView(d) {
        const s = sim.state;
        const vr = viewR;
        const el = $('view');
        const k = (2 * vr) / Math.max(1, Math.min(el.clientWidth, el.clientHeight)); // Kartenpunkte je Bildschirmpixel
        $('view').setAttribute('viewBox', `${cam.x - vr} ${cam.y - vr} ${2 * vr} ${2 * vr}`);
        const out = [];
        out.push(`<defs><pattern id="hatch" width="${10 * k}" height="${10 * k}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${10 * k}" stroke="#00000040" stroke-width="${4 * k}"/></pattern></defs>`);
        for (let z = 3; z >= 0; z--) {
          out.push(`<circle r="${R[z + 1]}" fill="var(--zone-${z})"/>`);
          if (z > d.reachZone) out.push(`<circle r="${R[z + 1]}" fill="url(#hatch)"/>`);
        }
        for (let z = 1; z < 4; z++) {
          out.push(`<circle r="${R[z]}" fill="none" stroke="#ffffff30" stroke-width="${1.5 * k}" stroke-dasharray="${6 * k} ${6 * k}"/>`);
        }
        // Zonennamen entlang der Grenze, dort wo der Schwarm hinschaut
        const ang = Math.atan2(s.pos.y, s.pos.x) || 0;
        for (let z = 0; z < 4; z++) {
          const rr = R[z + 1] - 14 * k;
          const lx = Math.cos(ang) * rr;
          const ly = Math.sin(ang) * rr;
          out.push(`<text x="${lx}" y="${ly}" font-size="${12 * k}" fill="#ffffffaa" text-anchor="middle" transform="rotate(${((ang * 180) / Math.PI + 90).toFixed(1)} ${lx} ${ly})">${z > d.reachZone ? '🔒 ' : ''}${esc(CFG.zones[z].name)} · Antrieb ${num(CFG.zones[z].threshold)}</text>`);
        }

        if (s.travel) out.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${s.travel.to.x}" y2="${s.travel.to.y}" stroke="var(--warn)" stroke-width="${2 * k}"/>`);
        else {
          const next = sim.nextTarget();
          if (next) out.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${next.obj.x}" y2="${next.obj.y}" stroke="${next.reason === 'mark' ? 'var(--mark)' : '#ffffff70'}" stroke-width="${1.5 * k}" stroke-dasharray="${2 * k} ${5 * k}" stroke-linecap="round"/>`);
        }

        for (const p of s.places) {
          if (!p.known) continue;
          const reachable = d.thrust >= sim.placeThreshold(p);
          const rNow = p.sealed ? 0 : radiusFor(sim.available(p) + (p.type === 'seegras' ? p.size * 0.01 : 0));
          const rFull = radiusFor(p.size);
          const capped = rawRadius(p.size) > rFull + 0.01;
          const isMark = s.mark && s.mark.kind === 'place' && s.mark.id === p.id;
          const isSel = selected && selected.kind === 'place' && selected.id === p.id;
          const hit = Math.max(rFull, 7 * k);
          out.push(`<g data-action="select" data-kind="place" data-id="${p.id}" opacity="${p.sealed ? 0.35 : reachable ? 1 : 0.5}">
            <circle cx="${p.x}" cy="${p.y}" r="${hit}" fill="transparent"/>
            <circle cx="${p.x}" cy="${p.y}" r="${rFull}" fill="none" stroke="${COLOR[p.type]}" stroke-opacity=".35" stroke-width="${k}" stroke-dasharray="${2 * k} ${2 * k}"/>
            <circle cx="${p.x}" cy="${p.y}" r="${rNow}" fill="${COLOR[p.type]}" fill-opacity="${reachable ? 0.8 : 0.3}"/>
            ${capped ? `<circle cx="${p.x}" cy="${p.y}" r="${rFull + 3 * k}" fill="none" stroke="${COLOR[p.type]}" stroke-width="${1.2 * k}"/>` : ''}
            ${isMark ? `<circle cx="${p.x}" cy="${p.y}" r="${rFull + 4 * k}" fill="none" stroke="var(--mark)" stroke-width="${2.5 * k}"/>` : ''}
            ${isSel ? `<circle cx="${p.x}" cy="${p.y}" r="${rFull + 7 * k}" fill="none" stroke="#fff" stroke-width="${k}" stroke-dasharray="${3 * k} ${3 * k}"/>` : ''}
          </g>`);
        }

        // Nebel außerhalb der Reichweite
        const big = 5000;
        out.push(`<path d="M${-big} ${-big}H${big}V${big}H${-big}Z M${s.pos.x + d.range} ${s.pos.y} a${d.range} ${d.range} 0 1 0 ${-2 * d.range} 0 a${d.range} ${d.range} 0 1 0 ${2 * d.range} 0Z" fill="#020b10" fill-opacity=".55" fill-rule="evenodd" pointer-events="none"/>`);
        out.push(`<circle cx="${s.pos.x}" cy="${s.pos.y}" r="${d.range}" fill="none" stroke="var(--accent)" stroke-opacity=".35" stroke-width="${k}"/>`);

        for (const f of s.finds) {
          const ok = sim.findTargetable(f);
          const isMark = s.mark && s.mark.kind === 'find' && s.mark.id === f.id;
          const fr = 11 * k + Math.sin(s.t * 3) * k;
          out.push(`<g data-action="select" data-kind="find" data-id="${f.id}" opacity="${ok ? 1 : 0.55}">
            <circle cx="${f.x}" cy="${f.y}" r="${fr}" fill="#f7a8ff26" stroke="${isMark ? 'var(--mark)' : 'var(--find)'}" stroke-width="${(isMark ? 2.5 : 1.2) * k}"/>
            <text x="${f.x}" y="${f.y + 4.5 * k}" text-anchor="middle" font-size="${13 * k}">${CFG.finds[f.type].icon}</text>
          </g>`);
        }

        // Richtung zu den höheren Zonen: radial nach außen
        const out1 = Math.hypot(s.pos.x, s.pos.y) < 1 ? { x: 1, y: 0 } : { x: s.pos.x / Math.hypot(s.pos.x, s.pos.y), y: s.pos.y / Math.hypot(s.pos.x, s.pos.y) };
        const nz = Math.min(3, d.reachZone + 1);
        if (d.reachZone < 3 || d.thrust < 1e8) {
          const ax = cam.x + out1.x * vr * 0.86;
          const ay = cam.y + out1.y * vr * 0.86;
          const rot = (Math.atan2(out1.y, out1.x) * 180) / Math.PI;
          const label = d.reachZone < 3 ? `${CFG.zones[nz].name} ab Antrieb ${num(CFG.zones[nz].threshold)}` : 'Seegraswiese ab Antrieb 100 Mio.';
          out.push(`<g transform="translate(${ax} ${ay})" pointer-events="none">
            <path d="M0 0" /><g transform="rotate(${rot})"><path d="M${-6 * k} ${-6 * k} L${6 * k} 0 L${-6 * k} ${6 * k}" fill="none" stroke="var(--fg)" stroke-width="${2 * k}" stroke-linecap="round"/></g>
            <text y="${-12 * k}" font-size="${12 * k}" fill="var(--fg)" text-anchor="middle">nach außen: ${esc(label)}</text></g>`);
        }

        const n = Math.min(22, 5 + Math.floor(Math.log10(1 + s.units[0]) * 3));
        let dots = '';
        for (let i = 0; i < n; i++) {
          const a = i * 2.39 + s.t * (s.travel ? 0.8 : 1.6);
          const rr = (3 + (i % 5) * 2.4) * k;
          dots += `<circle cx="${(s.pos.x + Math.cos(a) * rr).toFixed(2)}" cy="${(s.pos.y + Math.sin(a) * rr).toFixed(2)}" r="${2.2 * k}" fill="#e6fff6"/>`;
        }
        out.push(dots);
        U.setHTML($('view'), out.join(''));

        const barKP = [5, 10, 20, 50, 100, 200, 500].find((v) => v >= vr * 0.25) || 500;
        const px = (Math.min($('view').clientWidth, $('view').clientHeight) / (2 * vr)) * barKP;
        const exampleStock = Math.pow(10, refLog);
        U.setHTML(
          $('scale'),
          `<div class="scale__bar" style="width:${px}px"></div><span>${barKP} Kartenpunkte · Sicht ${num(d.range)} KP</span>
          <span>Fläche ∝ Futter: Kreis Ø ${num(R_REF * 2)} KP ≙ ${num(exampleStock)} Nahrung</span>
          <span>◎ Doppelring: größer als dargestellt</span>`,
        );
      }

      function renderMini(d) {
        const s = sim.state;
        const out = [];
        for (let z = 3; z >= 0; z--) out.push(`<circle r="${R[z + 1]}" fill="var(--zone-${z})" opacity="${z > d.reachZone ? 0.35 : 1}" stroke="#ffffff22" stroke-width="4"/>`);
        for (const p of s.places) {
          if (!p.known || p.sealed) continue;
          out.push(`<circle cx="${p.x}" cy="${p.y}" r="${p.type === 'seegras' ? 26 : 12}" fill="${COLOR[p.type]}"/>`);
        }
        for (const f of s.finds) out.push(`<rect x="${f.x - 14}" y="${f.y - 14}" width="28" height="28" transform="rotate(45 ${f.x} ${f.y})" fill="none" stroke="${s.mark && s.mark.id === f.id ? 'var(--mark)' : 'var(--find)'}" stroke-width="7" opacity="${sim.findTargetable(f) ? 1 : 0.5}"/>`);
        if (s.travel) out.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${s.travel.to.x}" y2="${s.travel.to.y}" stroke="var(--warn)" stroke-width="8"/>`);
        out.push(`<circle cx="${cam.x}" cy="${cam.y}" r="${viewR}" fill="#ffffff14" stroke="#fff" stroke-width="7"/>`);
        out.push(`<circle cx="${s.pos.x}" cy="${s.pos.y}" r="18" fill="var(--accent)"/>`);
        U.setHTML($('mini'), out.join(''));
        U.setHTML($('minilabel'), `Minimap · Zone ${d.reachZone + 1 <= 3 ? `${d.reachZone + 1} liegt weiter außen` : '3 erreicht'}`);
      }

      function renderSide(d) {
        const s = sim.state;
        const st = U.statusOf(sim, d);
        const warn = sim.markWarning();
        U.setHTML(
          $('side'),
          `<div class="res">
            <div><small>Vorrat</small><strong>${num(s.vorrat)}</strong><span> / ${num(d.capacity)}</span></div>
            <div><small>Eier</small><strong>${int(s.eier)}</strong><span> ${d.starre ? 'ruhen' : '+' + rate(d.eggRate)}</span></div>
            <div><small>Ernte</small><strong>${rate(d.harvest)}</strong><span> Appetit ${num(d.appetite)}</span></div>
            <div><small>Antrieb / Masse</small><strong>${num(d.thrust)}</strong><span> / ${num(d.mass)}</span></div>
          </div>
          <div class="now"><span class="now__status now__status--${st.code}">${esc(st.text)}</span><span class="muted">${U.nextLine(sim, d)}</span>
            ${warn ? `<span class="warn">⚠ ${warn}</span>` : ''}
            ${d.here ? '<button class="btn" data-action="leave">Stelle verlassen</button>' : ''}</div>
          <section><h2>Kette</h2>${U.chainList(sim, d)}</section>
          <section><h2>Ausbauten</h2>${U.upgradeList(sim, d)}<p class="muted" style="font-size:12px">Jeder 3. Rang Geißeln vergrößert die Reichweite – und damit das Sichtfeld.</p></section>
          <section><h2>Wirkungen</h2>${U.effectsList(sim)}</section>
          <section><h2>Logbuch</h2>${U.logList(sim, 6)}</section>`,
        );
      }

      U.delegate(document.body, (action, data) => {
        if (action === 'buy') sim.buyUnit(Number(data.i), data.mode);
        if (action === 'upg') sim.buyUpgrade(data.k);
        if (action === 'leave') sim.leave();
        if (action === 'select') selected = { kind: data.kind, id: Number(data.id) };
        if (action === 'close') selected = null;
        if (action === 'mark' && selected) {
          sim.toggleMark(selected.kind, selected.id);
          selected = null;
        }
        render();
      });
      U.run(sim, render);
    </script>
  </body>
</html>
