<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IdleSwarm – Mockup 2: Abstieg</title>
<style>
  :root {
    --paper: #f6f1e7;
    --card: #fffdf8;
    --ink: #1d3640;
    --muted: #5f7a80;
    --line: #d9cfbc;
    --teal: #237f7a;
    --coral: #d4553d;
    --leaf: #3f8a45;
    --gold: #c98a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #d9d2c3;
    color: var(--ink);
    font: 14px/1.35 "Avenir Next", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .phone { width: 100%; max-width: 430px; height: 100dvh; position: relative; overflow: hidden; background: var(--paper); }
  @media (min-width: 600px) {
    body { align-items: center; }
    .phone { height: min(900px, 96dvh); border-radius: 36px; box-shadow: 0 30px 70px rgb(60 50 30 / .35); }
  }

  /* Die Karte ist die Seite: senkrecht scrollen */
  .scroller { position: absolute; inset: 0; overflow-y: auto; padding-bottom: 230px; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .world { display: block; width: 100%; height: auto; }

  .t { font-size: 3.5px; fill: var(--ink); paint-order: stroke; stroke: rgb(246 241 231 / .9); stroke-width: 1.1px; stroke-linejoin: round; }
  .t--m { fill: var(--muted); }
  .t--b { font-weight: 700; }
  .t--zone { font-size: 3.3px; font-weight: 700; letter-spacing: .25px; fill: var(--ink); }
  .t--small { font-size: 2.9px; }
  .route { fill: none; stroke: var(--coral); stroke-width: .8; stroke-dasharray: 1.6 1.4; stroke-linecap: round; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -6; } }
  .swarm circle { animation: bob 1.8s ease-in-out infinite alternate; }
  .swarm circle:nth-child(2n) { animation-delay: -.9s; }
  @keyframes bob { from { transform: translateY(-.5px); } to { transform: translateY(.5px); } }

  /* HUD */
  .hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    padding: 12px 16px 10px;
    background: linear-gradient(var(--paper) 82%, rgb(246 241 231 / 0));
  }
  .hud__row { display: flex; align-items: baseline; justify-content: space-between; }
  .hud__title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .hud__era { font-size: 12px; color: var(--muted); }
  .chips { display: flex; gap: 6px; margin-top: 8px; }
  .chip { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; min-width: 0; }
  .chip__k { font-size: 11px; color: var(--muted); }
  .chip__v { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .chip__v small { font-weight: 500; font-size: 11px; color: var(--muted); }
  .chip__bar { height: 3px; background: #ece3d1; border-radius: 2px; margin-top: 4px; }
  .chip__bar span { display: block; height: 100%; width: 83%; background: var(--teal); border-radius: 2px; }
  .paused { color: var(--coral) !important; }

  /* Tiefenanzeige */
  .gauge { position: absolute; right: 10px; top: 150px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 5px; border-radius: 999px; background: rgb(255 253 248 / .9); border: 1px solid var(--line); }
  .gauge span { width: 18px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: #e3eeec; color: var(--muted); }
  .gauge span.is-done { background: #c9e1dd; color: var(--teal); }
  .gauge span.is-here { background: var(--teal); color: #fff; box-shadow: 0 0 0 3px rgb(35 127 122 / .2); }
  .gauge span.is-locked { background: repeating-linear-gradient(45deg, #e9e2d3 0 3px, #f3eee4 3px 6px); }
  .gauge svg { margin-top: 2px; }

  /* Unten: Reise und Navigation */
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; }
  .travel {
    margin: 0 12px 10px; padding: 14px; border-radius: 22px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgb(60 50 30 / .18);
  }
  .travel__head { display: flex; align-items: center; gap: 10px; }
  .travel__icon { width: 36px; height: 36px; border-radius: 12px; background: #fbe7e1; display: grid; place-items: center; flex: none; }
  .travel__title { font-weight: 800; font-size: 16px; }
  .travel__sub { font-size: 12px; color: var(--muted); }
  .travel__eta { margin-left: auto; text-align: right; }
  .travel__eta b { font-size: 20px; display: block; line-height: 1; }
  .travel__eta small { font-size: 11px; color: var(--muted); }
  .progress { height: 8px; border-radius: 4px; background: #efe6d6; margin: 12px 0 10px; position: relative; }
  .progress span { position: absolute; inset: 0 45% 0 0; border-radius: 4px; background: linear-gradient(90deg, #f0a08f, var(--coral)); }
  .note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 12px; background: #f3ede1; }
  .note b { color: var(--ink); }

  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; border-radius: 12px; position: relative; }
  .tabbar button[aria-current="page"] { color: var(--teal); font-weight: 700; background: #e6f1ef; }
  .badge { position: absolute; top: 0; right: 22%; min-width: 16px; height: 16px; border-radius: 8px; background: var(--coral); color: #fff; font-size: 10px; display: grid; place-items: center; font-weight: 700; }
</style>
</head>
