<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IdleSwarm · Dummy A: Streifen</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      body {
        min-height: 100vh;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.5rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .brand {
        font-weight: 700;
        font-size: 16px;
        margin-right: auto;
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 12px;
        color: var(--muted);
      }
      .res {
        min-width: 120px;
      }
      .res__label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .res__value {
        font-size: 18px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .res__sub {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .status {
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .status--frisst {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .status--unterwegs {
        color: var(--warn);
        border-color: var(--warn);
      }
      .status--stelle-leer,
      .status--keine-stelle {
        color: var(--danger);
        border-color: var(--danger);
      }

      .map-wrap {
        padding: 0.75rem 1.25rem 0.25rem;
      }
      .map {
        width: 100%;
        height: auto;
        display: block;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--locked);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        font-size: 12px;
        color: var(--muted);
        padding: 0.4rem 0.1rem;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 0.3rem;
        vertical-align: -1px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 1rem;
        padding: 0.5rem 1.25rem 5rem;
      }
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.9rem 1rem;
        display: grid;
        gap: 0.6rem;
        align-content: start;
      }
      .panel h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.2rem 0.75rem;
        padding: 0.55rem 0;
        border-top: 1px solid var(--border);
      }
      .row:first-of-type {
        border-top: 0;
      }
      .row--locked {
        opacity: 0.45;
      }
      .row__name {
        font-weight: 600;
      }
      .row__count {
        font-size: 16px;
        font-weight: 700;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .row__meta {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .row__actions {
        display: flex;
        gap: 0.3rem;
        justify-content: flex-end;
        align-items: center;
      }
      .card {
        background: var(--surface-2);
        border-radius: 8px;
        padding: 0.7rem 0.8rem;
        display: grid;
        gap: 0.35rem;
      }
      .card__title {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        font-weight: 600;
      }
      .card__hint {
        font-size: 12.5px;
        color: var(--muted);
      }
      .warn {
        color: var(--warn);
        font-size: 12.5px;
      }
      .effects {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }
      .effect {
        font-size: 12px;
        border: 1px solid var(--find);
        color: var(--find);
        border-radius: 999px;
        padding: 0.1rem 0.5rem;
        font-variant-numeric: tabular-nums;
      }
      .map [data-action] {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="top" id="top"></header>
    <section class="map-wrap">
      <svg class="map" id="map" viewBox="-4 -22 1048 146" role="img" aria-label="Karte der Winzlinge"></svg>
      <div class="legend">
        <span><i style="background: #7bd389"></i>Algenfilm</span>
        <span><i style="background: #9ad1ff"></i>Planktonwolke</span>
        <span><i style="background: #ff9f6e"></i>Toter Krebs</span>
        <span><i style="background: #e8eef5"></i>Meeresschnee</span>
        <span><i style="background: #46c46a"></i>Seegraswiese</span>
        <span>◆ Fundstück</span>
        <span>◌ Reichweite</span>
        <span>Klick auf Stelle oder Fundstück: auswählen und markieren</span>
      </div>
    </section>
    <main class="grid">
      <section class="panel" id="chain"></section>
      <section class="panel" id="upgrades"></section>
      <section class="panel" id="place"></section>
    </main>

    <script src="shared/sim.js"></script>
    <script src="shared/ui.js"></script>
    <script>
      const sim = IdleSwarmSim.create({ geometry: 'strip' });
      const { CFG } = sim;
      const U = IdleSwarmUI;
      const { num, int, rate, time, esc } = U;
      const TYPE_COLOR = { algenfilm: '#7bd389', plankton: '#9ad1ff', krebs: '#ff9f6e', schnee: '#e8eef5', seegras: '#46c46a' };
      let selected = null;

      const $ = (id) => document.getElementById(id);

      function radius(p) {
        if (p.type === 'seegras') return 11;
        return Math.max(3.5, Math.min(13, 3 + 1.5 * Math.log10(p.size / 1000)));
      }

      function renderTop(d) {
        const s = sim.state;
        const st = U.statusOf(sim, d);
        const next = CFG.zones[d.reachZone + 1];
        const fill = Math.min(1, s.vorrat / d.capacity);
        U.setHTML(
          $('top'),
          `<div class="brand">IdleSwarm<small>Zeitalter Winzlinge · Dummy A „Streifen“</small></div>
          <div class="res"><div class="res__label">Vorrat</div><div class="res__value" data-testid="res.vorrat">${num(s.vorrat)}</div>
            <div class="meter"><div class="meter__fill ${fill >= 1 ? 'meter__fill--warn' : ''}" style="width:${fill * 100}%"></div></div>
            <div class="res__sub">Kapazität ${num(d.capacity)}${s.vorrat > d.capacity ? ' · gedämpft' : ''}</div></div>
          <div class="res"><div class="res__label">Eier</div><div class="res__value">${int(s.eier)}</div><div class="res__sub">${d.starre ? '0/s (Starre)' : rate(d.eggRate)}</div></div>
          <div class="res"><div class="res__label">Ernte</div><div class="res__value">${rate(d.harvest)}</div><div class="res__sub">Appetit ${rate(d.appetite)}</div></div>
          <div class="res"><div class="res__label">Antrieb / Masse</div><div class="res__value">${num(d.thrust)} / ${num(d.mass)}</div><div class="res__sub">Tempo ${num(d.baseSpeed)} KP/s${d.ratio < 1 ? ' · gebremst' : ''}</div></div>
          <div class="res"><div class="res__label">Nächste Zone</div><div class="res__value">${next ? esc(next.name) : 'Seegras'}</div><div class="res__sub">${next ? `ab Antrieb ${num(next.threshold)}` : 'ab Antrieb 100 Mio.'}</div></div>
          <span class="status status--${st.code}">${esc(st.text)}</span>`,
        );
      }

      function renderMap(d) {
        const s = sim.state;
        const parts = [];
        parts.push(`<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff14" stroke-width="3"/></pattern></defs>`);
        CFG.zones.forEach((z, i) => {
          const locked = i > d.reachZone;
          parts.push(`<rect x="${i * 260}" y="0" width="260" height="120" fill="var(--zone-${i})" opacity="${locked ? 0.45 : 1}"/>`);
          if (locked) parts.push(`<rect x="${i * 260}" y="0" width="260" height="120" fill="url(#hatch)"/>`);
          parts.push(`<text x="${i * 260 + 6}" y="-8" font-size="11" fill="var(--fg)" font-weight="600">${i} · ${esc(z.name)}</text>`);
          parts.push(`<text x="${i * 260 + 254}" y="-8" font-size="10" fill="var(--muted)" text-anchor="end">${locked ? '🔒 ' : ''}Antrieb ${num(z.threshold)}</text>`);
        });
        parts.push(`<circle cx="${s.pos.x}" cy="${s.pos.y}" r="${d.range}" fill="#4fd1c50a" stroke="var(--accent)" stroke-opacity=".5" stroke-dasharray="4 4"/>`);

        const next = s.travel ? null : sim.nextTarget();
        if (s.travel) {
          parts.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${s.travel.to.x}" y2="${s.travel.to.y}" stroke="var(--warn)" stroke-width="1.5"/>`);
        } else if (next) {
          parts.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${next.obj.x}" y2="${next.obj.y}" stroke="${next.reason === 'mark' ? 'var(--mark)' : 'var(--muted)'}" stroke-dasharray="2 4" stroke-width="1"/>`);
        }

        for (const p of s.places) {
          if (!p.known) continue;
          const r = radius(p);
          const isSel = selected && selected.kind === 'place' && selected.id === p.id;
          const isMark = s.mark && s.mark.kind === 'place' && s.mark.id === p.id;
          const reachable = d.thrust >= sim.placeThreshold(p);
          const frac = p.sealed ? 0 : Math.sqrt(Math.max(0, p.stock / p.size));
          const col = TYPE_COLOR[p.type];
          parts.push(`<g data-action="select" data-kind="place" data-id="${p.id}" opacity="${p.sealed ? 0.35 : reachable ? 1 : 0.5}">
            <circle cx="${p.x}" cy="${p.y}" r="${r + 5}" fill="transparent"/>
            <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="none" stroke="${col}" stroke-width="1.5"/>
            <circle cx="${p.x}" cy="${p.y}" r="${r * frac}" fill="${col}" opacity=".85"/>
            ${p.sealed ? `<path d="M${p.x - 4} ${p.y - 4}l8 8M${p.x + 4} ${p.y - 4}l-8 8" stroke="var(--danger)" stroke-width="1.5"/>` : ''}
            ${isMark ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 4}" fill="none" stroke="var(--mark)" stroke-width="2"/><text x="${p.x}" y="${p.y - r - 6}" text-anchor="middle" font-size="10">🚩</text>` : ''}
            ${isSel ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 7}" fill="none" stroke="#fff" stroke-dasharray="2 2"/>` : ''}
          </g>`);
        }
        for (const f of s.finds) {
          const reachable = sim.findTargetable(f);
          const isSel = selected && selected.kind === 'find' && selected.id === f.id;
          const isMark = s.mark && s.mark.kind === 'find' && s.mark.id === f.id;
          parts.push(`<g data-action="select" data-kind="find" data-id="${f.id}" opacity="${reachable ? 1 : 0.45}">
            <rect x="${f.x - 7}" y="${f.y - 7}" width="14" height="14" transform="rotate(45 ${f.x} ${f.y})" fill="#2a1430" stroke="${isMark ? 'var(--mark)' : 'var(--find)'}" stroke-width="${isMark ? 2.5 : 1.5}"/>
            <text x="${f.x}" y="${f.y + 3.5}" text-anchor="middle" font-size="9">${CFG.finds[f.type].icon}</text>
            ${isSel ? `<circle cx="${f.x}" cy="${f.y}" r="14" fill="none" stroke="#fff" stroke-dasharray="2 2"/>` : ''}
          </g>`);
        }
        // Schwarm als Gewimmel
        const n = Math.min(14, 3 + Math.floor(Math.log10(1 + s.units[0]) * 3));
        let dots = '';
        for (let i = 0; i < n; i++) {
          const a = i * 2.4 + s.t * (s.travel ? 0.5 : 2);
          const rr = 2 + (i % 4) * 1.6;
          dots += `<circle cx="${(s.pos.x + Math.cos(a) * rr).toFixed(1)}" cy="${(s.pos.y + Math.sin(a) * rr).toFixed(1)}" r="1.4" fill="var(--accent)"/>`;
        }
        parts.push(`<g>${dots}<circle cx="${s.pos.x}" cy="${s.pos.y}" r="9" fill="none" stroke="var(--accent)" stroke-opacity=".6"/></g>`);
        U.setHTML($('map'), parts.join(''));
      }

      function renderChain(d) {
        const s = sim.state;
        const rows = CFG.units
          .map((u, i) => {
            const unlocked = s.unlocked[i];
            const max = sim.maxBuy(i);
            const quarter = Math.max(1, Math.floor(max * 0.25));
            const prod = i > 0 ? `erzeugt ${rate(d.production[i - 1])} ${CFG.units[i - 1].plural}` : `erntet ${num(d.feed)}/s`;
            const cost = `${num(u.cost)} Vorrat · 1 Ei${i > 0 ? ` · ${num(u.req)} ${CFG.units[i - 1].plural}` : ''}`;
            if (!unlocked)
              return `<div class="row row--locked"><div><div class="row__name">Stufe ${i + 1}: ${u.name}</div><div class="row__meta">Freigeschaltet ab 1 ${CFG.units[i - 1].name}</div></div><div class="row__count">🔒</div></div>`;
            return `<div class="row">
              <div><div class="row__name">${u.name}</div><div class="row__meta">${prod}</div><div class="row__meta">${cost}</div></div>
              <div class="row__count">${int(s.units[i])}</div>
              <div class="row__actions" style="grid-column:1/-1">
                <button class="btn btn--small" data-action="buy" data-i="${i}" data-mode="1" ${max < 1 ? 'disabled' : ''}>+1</button>
                <button class="btn btn--small" data-action="buy" data-i="${i}" data-mode="25" ${max < 1 ? 'disabled' : ''}>+${int(quarter)} (25 %)</button>
                <button class="btn btn--small btn--primary" data-action="buy" data-i="${i}" data-mode="max" ${max < 1 ? 'disabled' : ''}>Max +${int(max)}</button>
              </div>
            </div>`;
          })
          .join('');
        U.setHTML($('chain'), `<h2>Kette</h2><div>${rows}</div>`);
      }

      function renderUpgrades(d) {
        const s = sim.state;
        const rows = CFG.upgradeOrder
          .map((k) => {
            const u = CFG.upgrades[k];
            const l = s.upg[k];
            const cost = sim.upgradeCost(k);
            const free = s.freeRanks > 0;
            const extra = k === 'geisseln' ? ` · Reichweite ${num(d.range)} KP` : '';
            return `<div class="row">
              <div><div class="row__name">${u.name} <span class="muted">Rang ${l}</span></div>
              <div class="row__meta">${u.label} ${num(u.effect(l))} → ${num(u.effect(l + 1))} ${u.unit}${extra}</div></div>
              <div class="row__actions"><button class="btn btn--small ${free ? 'btn--mark' : ''}" data-action="upg" data-k="${k}" ${!free && s.vorrat < cost ? 'disabled' : ''}>${free ? 'Gratis ✨' : num(cost)}</button></div>
            </div>`;
          })
          .join('');
        const effects = Object.entries(s.effects)
          .filter(([, v]) => v > 0)
          .map(([k, v]) => `<span class="effect">${CFG.finds[k].icon} ${CFG.finds[k].name} ${time(v)}</span>`)
          .join('');
        U.setHTML(
          $('upgrades'),
          `<h2>Ausbauten</h2><div>${rows}</div>
          ${s.freeRanks > 0 ? `<p class="warn">✨ ${s.freeRanks} Keimzelle(n): der nächste Rang eines Ausbaus nach Wahl ist gratis.</p>` : ''}
          <h2>Aktive Wirkungen</h2>${effects ? `<div class="effects">${effects}</div>` : '<p class="muted">Keine. Fundstücke auf der Karte markieren, um sie einzusammeln.</p>'}`,
        );
      }

      function placeCard(p, d, title) {
        const t = CFG.placeTypes[p.type];
        const info = sim.travelInfo(p);
        const fill = p.sealed ? 0 : p.stock / p.size;
        const reachable = d.thrust >= sim.placeThreshold(p);
        return `<div class="card">
          <div class="card__title"><span>${title ? `${title}: ` : ''}${t.name}</span><span class="muted">Zone ${p.zone}</span></div>
          <div class="meter"><div class="meter__fill" style="width:${fill * 100}%;background:${TYPE_COLOR[p.type]}"></div></div>
          <div class="row__meta">Bestand ${num(p.stock)} / ${num(p.size)} · ${esc(t.trait)}</div>
          ${p.sealed ? '<div class="warn">Versiegt – verschwindet bald.</div>' : ''}
          ${!reachable ? `<div class="warn">Nicht erreichbar: braucht Antrieb ${num(sim.placeThreshold(p))}.</div>` : ''}
          ${p !== d.here && !p.sealed && reachable ? `<div class="row__meta">${num(info.distance)} KP · Reise ${time(info.time)} · Ø ${rate(info.avg)}</div>` : ''}
        </div>`;
      }

      function renderPlace(d) {
        const s = sim.state;
        const h = d.here;
        const parts = ['<h2>Stelle und Reise</h2>'];
        if (s.travel) {
          const left = (s.travel.dist - s.travel.done) / d.speed;
          parts.push(`<div class="card"><div class="card__title"><span>Unterwegs</span><span class="num">${time(left)}</span></div>
            <div class="meter"><div class="meter__fill meter__fill--warn" style="width:${(s.travel.done / s.travel.dist) * 100}%"></div></div>
            <div class="card__hint">Starre: keine Eier, keine Erzeugung. Markieren ist möglich, umlenken nicht.</div></div>`);
        } else if (h) {
          parts.push(placeCard(h, d, 'Hier'));
          parts.push(`<div class="card__hint">${d.timeToEmpty !== null ? `Leer in etwa ${time(d.timeToEmpty)} – dann zieht der Schwarm weiter.` : 'Diese Stelle versiegt nie.'}</div>`);
          parts.push(`<button class="btn" data-action="leave">Stelle verlassen</button>`);
        } else {
          parts.push(`<div class="card"><div class="card__title">An keiner Stelle</div><div class="card__hint">Starre, bis ein Ziel ansteuerbar ist.</div></div>`);
        }
        const next = sim.nextTarget();
        if (next) {
          const name = next.kind === 'place' ? CFG.placeTypes[next.obj.type].name : CFG.finds[next.obj.type].name;
          parts.push(`<div class="card"><div class="card__title"><span>${s.travel ? 'Danach' : 'Nächstes Ziel'}</span><span class="muted">${next.reason === 'mark' ? '🚩 markiert' : 'beste Alternative'}</span></div>
            <div>${name} · Zone ${next.obj.zone}</div>
            ${next.info ? `<div class="row__meta">Ø-Ernte ${rate(next.info.avg)} inkl. ${time(next.info.time)} Reise</div>` : ''}</div>`);
        } else parts.push(`<div class="card__hint">Kein ansteuerbares Ziel bekannt. Mehr Reichweite durch Geißeln (alle 3 Ränge).</div>`);
        const warn = sim.markWarning();
        if (warn) parts.push(`<div class="warn">⚠ ${warn}</div>`);

        if (selected) {
          const obj = selected.kind === 'place' ? sim.placeById(selected.id) : sim.findById(selected.id);
          if (!obj) selected = null;
          else {
            const isMark = s.mark && s.mark.kind === selected.kind && s.mark.id === obj.id;
            const can = selected.kind === 'place' ? sim.placeTargetable(obj) && obj !== d.here : sim.findTargetable(obj);
            parts.push('<h2>Auswahl</h2>');
            if (selected.kind === 'place') parts.push(placeCard(obj, d));
            else {
              const f = CFG.finds[obj.type];
              const info = sim.travelInfo(obj);
              parts.push(`<div class="card"><div class="card__title"><span>${f.icon} ${f.name}</span><span class="muted">Zone ${obj.zone}</span></div><div class="row__meta">${f.text}</div>
                ${can ? `<div class="row__meta">${num(info.distance)} KP · Reise ${time(info.time)}</div>` : `<div class="warn">Erst ansteuerbar ab Antrieb ${num(CFG.zones[obj.zone].threshold)}.</div>`}</div>`);
            }
            parts.push(
              isMark
                ? `<button class="btn btn--mark" data-action="mark">🚩 Markierung aufheben</button>`
                : `<button class="btn btn--mark" data-action="mark" ${can ? '' : 'disabled'}>🚩 Als nächstes Ziel markieren</button>`,
            );
          }
        }
        parts.push(`<h2>Logbuch</h2><ul class="log">${s.log
          .slice(0, 6)
          .map((e) => `<li class="log__item log__item--${e.kind}"><span class="muted">${U.clock(e.t)}</span> ${esc(e.text)}</li>`)
          .join('')}</ul>`);
        U.setHTML($('place'), parts.join(''));
      }

      function render() {
        const d = sim.derive();
        renderTop(d);
        renderMap(d);
        renderChain(d);
        renderUpgrades(d);
        renderPlace(d);
      }

      U.delegate(document.body, (action, data) => {
        if (action === 'buy') sim.buyUnit(Number(data.i), data.mode);
        if (action === 'upg') sim.buyUpgrade(data.k);
        if (action === 'leave') sim.leave();
        if (action === 'select') selected = { kind: data.kind, id: Number(data.id) };
        if (action === 'mark' && selected) sim.toggleMark(selected.kind, selected.id);
        render();
      });
      U.run(sim, render);
    </script>
  </body>
</html>
