<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IdleSwarm · Dummy F: Zellblick</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      :root {
        --bg: #03161c;
        --surface: #0b2731;
        --surface-2: #123642;
        --border: #24576a;
        --fg: #eaf7f6;
        --muted: #94bcc4;
        --accent: #9df5a8;
        --accent-fg: #0a2a10;
        --zone-0: #2a8f8a;
        --zone-1: #1f7380;
        --zone-2: #165a6e;
        --zone-3: #0f4259;
      }
      body {
        height: 100vh;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        background: var(--bg);
      }
      .view {
        width: 100%;
        height: 100%;
        display: block;
      }
      .view [data-action] {
        cursor: pointer;
      }
      .growth {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: min(720px, calc(100vw - 32px));
        z-index: 3;
        display: grid;
        gap: 0.3rem;
        text-align: center;
        font-size: 12.5px;
      }
      .growth__track {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .growth__seg {
        height: 12px;
        border-radius: 99px;
        background: #ffffff1a;
        overflow: hidden;
        border: 1px solid #ffffff30;
      }
      .growth__seg i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #e7ff8a);
      }
      .growth__names {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        font-size: 11px;
        color: var(--muted);
      }
      .growth__goal {
        font-variant-numeric: tabular-nums;
      }
      .dock {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        align-items: flex-end;
        gap: 0.6rem;
        background: #021117d9;
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 0.55rem 0.8rem;
        max-width: calc(100vw - 24px);
        flex-wrap: wrap;
        justify-content: center;
      }
      .dock__res {
        display: grid;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 110px;
      }
      .dock__res b {
        font-size: 16px;
        color: var(--fg);
      }
      .unit {
        font: inherit;
        color: var(--fg);
        width: 74px;
        display: grid;
        justify-items: center;
        gap: 0.1rem;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .unit__orb {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 35% 30%, #ffffff40, var(--surface-2) 70%);
        border: 2px solid var(--accent);
        font-weight: 800;
        font-size: 15px;
        position: relative;
      }
      .unit__plus {
        position: absolute;
        right: -6px;
        bottom: -4px;
        background: var(--accent);
        color: var(--accent-fg);
        border-radius: 99px;
        font-size: 10.5px;
        padding: 0 0.35rem;
        font-variant-numeric: tabular-nums;
      }
      .unit small {
        font-size: 10.5px;
        color: var(--muted);
        white-space: nowrap;
      }
      .unit strong {
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
      }
      .unit[disabled] .unit__orb {
        border-color: var(--border);
        opacity: 0.5;
      }
      .unit[disabled] .unit__plus {
        background: var(--border);
        color: var(--muted);
      }
      .unit--locked {
        opacity: 0.35;
        cursor: default;
      }
      .dock__side {
        display: grid;
        gap: 0.3rem;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 99px;
        overflow: hidden;
      }
      .seg button {
        font: inherit;
        font-size: 11px;
        border: 0;
        background: none;
        color: var(--fg);
        padding: 0.1rem 0.45rem;
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .card-slot {
        position: fixed;
        right: 12px;
        top: 90px;
        z-index: 3;
      }
      .status {
        position: fixed;
        left: 12px;
        top: 90px;
        z-index: 3;
        max-width: 320px;
        background: #021117cc;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.5rem 0.7rem;
        font-size: 12.5px;
        display: grid;
        gap: 0.3rem;
      }
      .kammer {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #021117ee;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
        padding: 4rem 2rem 2rem;
        overflow-y: auto;
        align-content: start;
      }
      .kammer h2 {
        font-size: 18px;
        margin-bottom: 0.5rem;
      }
      .kammer__close {
        position: fixed;
        top: 16px;
        right: 20px;
      }
      .kammer__title {
        position: fixed;
        top: 18px;
        left: 2rem;
        font-size: 20px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="stage"><svg class="view" id="view" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Nahansicht des Schwarms"></svg></div>
    <div class="growth" id="growth"></div>
    <div class="status" id="status"></div>
    <div class="card-slot" id="card"></div>
    <div class="dock" id="dock"></div>
    <div id="kammer"></div>

    <script src="shared/sim.js"></script>
    <script src="shared/ui.js"></script>
    <script>
      const sim = IdleSwarmSim.create({ geometry: 'bigRings' });
      const { CFG } = sim;
      const U = IdleSwarmUI;
      const { num, int, rate, time, esc } = U;
      const R = sim.geo.radii;
      const VR = 110;
      const COLOR = { algenfilm: '#96ee9a', plankton: '#a9ddff', krebs: '#ffae7d', schnee: '#f4f8fb', seegras: '#46d684' };
      const GLYPH = { fressling: 'F', brutling: 'B', eitraegerin: 'E', gelege: 'G', brutklumpen: 'K', urnest: 'U' };
      const $ = (id) => document.getElementById(id);
      let selected = null;
      let buyMode = '1';
      let kammer = false;
      let cam = null;

      const rOf = (p) => (p.type === 'seegras' ? 30 : Math.max(4, Math.min(18, 2.5 + 1.6 * Math.log10(p.size / 1000))));

      function extents() {
        const el = $('view');
        const w = el.clientWidth || 1;
        const h = el.clientHeight || 1;
        return { hx: VR * Math.max(1, w / h), hy: VR * Math.max(1, h / w) };
      }

      function renderView(d) {
        const s = sim.state;
        cam = cam === null ? { ...s.pos } : { x: cam.x + (s.pos.x - cam.x) * 0.3, y: cam.y + (s.pos.y - cam.y) * 0.3 };
        $('view').setAttribute('viewBox', `${cam.x - VR} ${cam.y - VR} ${2 * VR} ${2 * VR}`);
        const { hx, hy } = extents();
        const el = $('view');
        const k = (2 * VR) / Math.max(1, Math.min(el.clientWidth, el.clientHeight)); // Kartenpunkte je Bildschirmpixel
        const out = [];
        // Parallaxe: zwei Teilchenmuster, die langsamer als die Welt wandern
        out.push(`<defs>
          <pattern id="far" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="translate(${cam.x * 0.55} ${cam.y * 0.55})"><circle cx="12" cy="18" r=".8" fill="#ffffff22"/><circle cx="44" cy="40" r="1.2" fill="#ffffff18"/><circle cx="30" cy="5" r=".6" fill="#ffffff20"/></pattern>
          <pattern id="mid" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="translate(${cam.x * 0.25} ${cam.y * 0.25})"><circle cx="20" cy="60" r="2.4" fill="#ffffff10"/><ellipse cx="70" cy="22" rx="5" ry="2" fill="#ffffff0c"/></pattern>
          <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#00000044" stroke-width="3"/></pattern>
          <radialGradient id="glow"><stop offset="0" stop-color="#ffffff" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
        </defs>`);
        out.push(`<rect x="${cam.x - hx}" y="${cam.y - hy}" width="${2 * hx}" height="${2 * hy}" fill="#021016"/>`);
        for (let z = 3; z >= 0; z--) {
          out.push(`<circle r="${R[z + 1]}" fill="var(--zone-${z})"/>`);
          if (z > d.reachZone) out.push(`<circle r="${R[z + 1]}" fill="url(#hatch)"/>`);
        }
        out.push(`<rect x="${cam.x - hx}" y="${cam.y - hy}" width="${2 * hx}" height="${2 * hy}" fill="url(#far)"/>`);
        out.push(`<rect x="${cam.x - hx}" y="${cam.y - hy}" width="${2 * hx}" height="${2 * hy}" fill="url(#mid)"/>`);
        for (let z = 1; z < 4; z++) {
          out.push(`<circle r="${R[z]}" fill="none" stroke="#ffffff50" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round"/>`);
          // Beschriftung der Grenze am nächstgelegenen Punkt
          const a = Math.atan2(s.pos.y, s.pos.x) || 0;
          const bx = Math.cos(a) * R[z];
          const by = Math.sin(a) * R[z];
          if (Math.abs(bx - cam.x) < hx && Math.abs(by - cam.y) < hy)
            out.push(`<text x="${bx}" y="${by - 6 * k}" font-size="${12 * k}" fill="#ffffffcc" text-anchor="middle">Grenze: ${esc(CFG.zones[z].name)}${z > d.reachZone ? ` · 🔒 Antrieb ${num(CFG.zones[z].threshold)}` : ''}</text>`);
        }

        if (s.travel) out.push(`<line x1="${s.pos.x}" y1="${s.pos.y}" x2="${s.travel.to.x}" y2="${s.travel.to.y}" stroke="var(--warn)" stroke-width="1.5"/>`);

        for (const p of s.places) {
          if (!p.known) continue;
          const r = rOf(p);
          const frac = p.sealed ? 0 : Math.max(0.12, Math.sqrt(p.stock / p.size));
          const isMark = s.mark && s.mark.kind === 'place' && s.mark.id === p.id;
          const isSel = selected && selected.kind === 'place' && selected.id === p.id;
          const wob = Math.sin(s.t * 1.3 + p.id) * 0.6;
          out.push(`<g data-action="select" data-kind="place" data-id="${p.id}" opacity="${p.sealed ? 0.3 : d.thrust >= sim.placeThreshold(p) ? 1 : 0.55}">
            <circle cx="${p.x}" cy="${p.y}" r="${r * 1.6}" fill="url(#glow)"/>
            <ellipse cx="${p.x}" cy="${p.y}" rx="${r + wob}" ry="${r - wob}" fill="${COLOR[p.type]}" fill-opacity=".2" stroke="${COLOR[p.type]}" stroke-opacity=".6"/>
            <ellipse cx="${p.x}" cy="${p.y}" rx="${(r + wob) * frac}" ry="${(r - wob) * frac}" fill="${COLOR[p.type]}"/>
            ${isMark ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 4}" fill="none" stroke="var(--mark)" stroke-width="2"/>` : ''}
            ${isSel ? `<circle cx="${p.x}" cy="${p.y}" r="${r + 7}" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="2 2"/>` : ''}
          </g>`);
        }
        for (const f of s.finds) {
          const isMark = s.mark && s.mark.kind === 'find' && s.mark.id === f.id;
          out.push(`<g data-action="select" data-kind="find" data-id="${f.id}" opacity="${sim.findTargetable(f) ? 1 : 0.5}">
            <circle cx="${f.x}" cy="${f.y}" r="${8 + Math.sin(s.t * 3)}" fill="#f7a8ff30" stroke="${isMark ? 'var(--mark)' : 'var(--find)'}" stroke-width="${isMark ? 2 : 1}"/>
            <text x="${f.x}" y="${f.y + 4 * k}" text-anchor="middle" font-size="${13 * k}">${CFG.finds[f.type].icon}</text></g>`);
        }

        // Schwarm mit Beschriftung der aktuellen Stelle
        const n = Math.min(26, 6 + Math.floor(Math.log10(1 + s.units[0]) * 4));
        let dots = '';
        for (let i = 0; i < n; i++) {
          const a = i * 2.39 + s.t * (s.travel ? 1 : 2);
          const rr = 2.5 + (i % 6) * 1.3;
          const x = s.pos.x + Math.cos(a) * rr;
          const y = s.pos.y + Math.sin(a) * rr;
          dots += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="1.7" ry="1" fill="#f1fff7" transform="rotate(${((a * 180) / Math.PI + 90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
        }
        out.push(dots);
        if (d.here && d.timeToEmpty !== null) {
          const w = 30;
          const f = d.here.stock / d.here.size;
          out.push(`<g pointer-events="none"><rect x="${s.pos.x - w / 2}" y="${s.pos.y - 20}" width="${w}" height="${5 * k}" rx="${2 * k}" fill="#00000080"/><rect x="${s.pos.x - w / 2}" y="${s.pos.y - 20}" width="${w * f}" height="${5 * k}" rx="${2 * k}" fill="${COLOR[d.here.type]}"/>
            <text x="${s.pos.x}" y="${s.pos.y - 20 - 5 * k}" text-anchor="middle" font-size="${11 * k}" fill="#fff">leer in ${time(d.timeToEmpty)}</text></g>`);
        }

        // Randpfeile für Ziele außerhalb des Bildes
        const targets = [];
        const next = sim.nextTarget();
        if (s.travel) targets.push({ obj: s.travel.kind === 'place' ? sim.placeById(s.travel.id) : sim.findById(s.travel.id), kind: s.travel.kind, tag: 'Reiseziel', col: 'var(--warn)' });
        else if (next) targets.push({ obj: next.obj, kind: next.kind, tag: next.reason === 'mark' ? 'markiert' : 'als Nächstes', col: next.reason === 'mark' ? 'var(--mark)' : 'var(--accent)' });
        for (const f of s.finds) if (sim.findTargetable(f)) targets.push({ obj: f, kind: 'find', tag: CFG.finds[f.type].name, col: 'var(--find)' });
        sim.alternatives().slice(0, 3).forEach((a) => targets.push({ obj: a.place, kind: 'place', tag: `Ø ${rate(a.avg)}`, col: '#ffffffaa' }));
        const seen = new Set();
        for (const t of targets) {
          if (!t.obj || seen.has(t.kind + t.obj.id)) continue;
          seen.add(t.kind + t.obj.id);
          const dx = t.obj.x - cam.x;
          const dy = t.obj.y - cam.y;
          // Sichtbarer Bereich ohne Wachstumsleiste oben und Bedienleiste unten
          const left = -hx + 24 * k;
          const right = hx - 24 * k;
          const top = -hy + 100 * k;
          const bottom = hy - 140 * k;
          if (dx > left && dx < right && dy > top && dy < bottom) continue;
          const sc = Math.min(dx > 0 ? right / dx : dx < 0 ? left / dx : Infinity, dy > 0 ? bottom / dy : dy < 0 ? top / dy : Infinity);
          const ex = cam.x + dx * sc;
          const ey = cam.y + dy * sc;
          const rot = (Math.atan2(dy, dx) * 180) / Math.PI;
          const icon = t.kind === 'find' ? CFG.finds[t.obj.type].icon : '●';
          const dist = Math.hypot(t.obj.x - s.pos.x, t.obj.y - s.pos.y);
          out.push(`<g data-action="select" data-kind="${t.kind}" data-id="${t.obj.id}">
            <circle cx="${ex}" cy="${ey}" r="${14 * k}" fill="#021117dd" stroke="${t.col}" stroke-width="${1.5 * k}"/>
            <text x="${ex}" y="${ey + 4.5 * k}" text-anchor="middle" font-size="${13 * k}" fill="${t.kind === 'place' ? COLOR[t.obj.type] : '#fff'}">${icon}</text>
            <g transform="rotate(${rot} ${ex} ${ey})"><path d="M${ex + 17 * k} ${ey - 5 * k} L${ex + 24 * k} ${ey} L${ex + 17 * k} ${ey + 5 * k}Z" fill="${t.col}"/></g>
            <text x="${ex}" y="${ey + (ey > cam.y ? -20 * k : 28 * k)}" text-anchor="middle" font-size="${11 * k}" fill="${t.col}">${esc(t.tag)} · ${num(dist)} KP</text>
          </g>`);
        }
        U.setHTML($('view'), out.join(''));
      }

      function renderGrowth(d) {
        const s = sim.state;
        const steps = [
          [50, 500, 'Gezeitentümpel'],
          [500, 2e4, 'Felsenbecken'],
          [2e4, 1e6, 'Flachwasser'],
          [1e6, 1e8, 'Seegraswiese'],
        ];
        const segs = steps.map(([a, b]) => Math.max(0, Math.min(1, (Math.log10(d.thrust) - Math.log10(a)) / (Math.log10(b) - Math.log10(a)))));
        const cur = steps.find(([, b]) => d.thrust < b);
        U.setHTML(
          $('growth'),
          `<div class="growth__track">${segs.map((f) => `<div class="growth__seg"><i style="width:${f * 100}%"></i></div>`).join('')}</div>
          <div class="growth__names">${steps.map(([, , n]) => `<span>${n}</span>`).join('')}</div>
          <div class="growth__goal">${cur ? `Antrieb ${num(d.thrust)} / ${num(cur[1])} bis ${cur[2]}` : `Seegraswiese erreichbar · Urnest ${s.units[5] >= 1 ? '✔' : 'fehlt noch'}`}</div>`,
        );
      }

      function renderDock(d) {
        const s = sim.state;
        const units = CFG.units
          .map((u, i) => {
            if (!s.unlocked[i]) return i <= 2 || s.unlocked[i - 1] ? `<span class="unit unit--locked"><span class="unit__orb">?</span><small>ab 1 ${CFG.units[i - 1].name}</small></span>` : '';
            const max = sim.maxBuy(i);
            const n = buyMode === 'max' ? max : buyMode === '25' ? Math.max(1, Math.floor(max * 0.25)) : 1;
            return `<button class="unit" data-action="buy" data-i="${i}" ${max < 1 ? 'disabled' : ''} title="${u.name}: ${num(u.cost)} Vorrat, 1 Ei${i ? `, ${num(u.req)} ${CFG.units[i - 1].plural}` : ''}">
              <span class="unit__orb">${GLYPH[u.id]}<span class="unit__plus">+${int(max < 1 ? 1 : n)}</span></span>
              <strong>${int(s.units[i])}</strong><small>${u.name}</small></button>`;
          })
          .join('');
        U.setHTML(
          $('dock'),
          `<div class="dock__res"><span>Vorrat <b>${num(s.vorrat)}</b></span><span>Kapazität ${num(d.capacity)}</span><span>Eier <b>${int(s.eier)}</b> ${d.starre ? '' : '+' + rate(d.eggRate)}</span></div>
          ${units}
          <div class="dock__side">
            <span class="seg">${[['1', '1'], ['25', '25 %'], ['max', 'Max']].map(([k, l]) => `<button data-action="mode" data-v="${k}" aria-pressed="${buyMode === k}">${l}</button>`).join('')}</span>
            <button class="btn btn--primary" data-action="kammer">Brutkammer${s.freeRanks ? ' ✨' : ''}</button>
            ${d.here ? '<button class="btn" data-action="leave">Weiterziehen</button>' : ''}
          </div>`,
        );
      }

      function renderKammer(d) {
        if (!kammer) return U.setHTML($('kammer'), '');
        U.setHTML(
          $('kammer'),
          `<div class="kammer">
            <div class="kammer__title">Brutkammer</div>
            <button class="btn kammer__close" data-action="kammer">Zurück zum Schwarm</button>
            <section><h2>Ausbauten</h2>${U.upgradeList(sim, d)}</section>
            <section><h2>Kette im Detail</h2>${U.chainList(sim, d)}</section>
            <section><h2>Wirkungen</h2>${U.effectsList(sim)}<h2 style="margin-top:1.2rem">Logbuch</h2>${U.logList(sim, 12)}</section>
          </div>`,
        );
      }

      function render() {
        const d = sim.derive();
        renderView(d);
        renderGrowth(d);
        renderDock(d);
        renderKammer(d);
        const st = U.statusOf(sim, d);
        const warn = sim.markWarning();
        U.setHTML($('status'), `<b>${esc(st.text)}</b><span class="muted">${U.nextLine(sim, d)}</span>${warn ? `<span class="warn">⚠ ${warn}</span>` : ''}`);
        U.setHTML($('card'), U.targetCard(sim, d, selected));
      }

      U.delegate(document.body, (action, data) => {
        if (action === 'mode') buyMode = data.v;
        if (action === 'buy') sim.buyUnit(Number(data.i), data.mode || buyMode);
        if (action === 'upg') sim.buyUpgrade(data.k);
        if (action === 'leave') sim.leave();
        if (action === 'kammer') kammer = !kammer;
        if (action === 'select') selected = { kind: data.kind, id: Number(data.id) };
        if (action === 'close') selected = null;
        if (action === 'mark' && selected) {
          sim.toggleMark(selected.kind, selected.id);
          selected = null;
        }
        render();
      });
      U.run(sim, render);
    </script>
  </body>
</html>
