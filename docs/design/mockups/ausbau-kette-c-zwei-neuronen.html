<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IdleSwarm – Ausbau der Kette, Variante C: Zwei Neuronen</title>
<style>
  /* Ausbau-Ansicht des Prototyps (Spezifikation v8, Mockup 5d) mit den Erzeugungs-Ausbauten der Kette (P1-AUS-05).
     Nur Look and Feel: feste Werte, keine Spiellogik. Antippen wählt einen Ausbau, Ziehen verschiebt die Ansicht. */
  :root {
    --night: #0c0f33;
    --ink: #f6f4ff;
    --muted: #a7aee8;
    --panel: #171d58;
    --panel-2: #212a72;
    --panel-3: #2c368a;
    --cyan: #3ee6e0;
    --pink: #ff4f8b;
    --yellow: #ffd23f;
    --orange: #ff8a3d;
    --lime: #8cf25a;
    --violet: #9b6bff;
    --ease: cubic-bezier(.62, 0, .22, 1);
    --font: "Avenir Next", "Montserrat", "Nunito", "Futura", "Century Gothic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #05061a; color: var(--ink); font: 14px/1.35 var(--font); display: flex; justify-content: center; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button[aria-disabled="true"] { cursor: default; }
  .num { font-variant-numeric: tabular-nums; }
  .app {
    position: relative; width: 100%; max-width: 430px; height: 100dvh; overflow: hidden; overflow: clip;
    background: var(--night); isolation: isolate; user-select: none; -webkit-user-select: none;
    touch-action: none; cursor: grab;
  }
  @media (min-width: 600px) {
    body { align-items: center; }
    .app { height: min(900px, 96dvh); border-radius: 36px; box-shadow: 0 30px 80px rgb(0 0 0 / .7); }
  }

  /* Ebene des Neurons, verschoben über --px/--py */
  .stage { position: absolute; left: 50%; top: 40%; width: 0; height: 0; transform: translate(var(--px, 0px), var(--py, 0px)) scale(var(--sc, 1)); transform-origin: 0 0; transition: transform .55s var(--ease); }
  .app.panning .stage { transition: none; }
  .stage > svg { position: absolute; display: block; overflow: visible; }

  .swirl { animation: swirl 140s linear infinite; }
  @keyframes swirl { to { transform: rotate(360deg); } }

  /* ---------- Neuron ---------- */
  .twig { fill: none; stroke: #6d2668; stroke-width: 3; stroke-linecap: round; }
  .twig--term { stroke: #d64484; stroke-width: 4; }
  .dend { fill: none; stroke: #ff4f8b; stroke-width: 11; stroke-linecap: round; }
  .dend--glow { stroke: #4a1c64; stroke-width: 30; }
  .dend--core { stroke: #ff9cc4; stroke-width: 3.5; }
  .axon { fill: none; stroke: #ff4f8b; stroke-width: 8; stroke-linecap: round; }
  .axon--glow { stroke: #4a1c64; stroke-width: 26; }
  .sig { fill: none; stroke: #8ffcff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 24; }
  .sig--in { animation: sigIn 1.4s linear infinite; }
  .sig--out { animation: sigOut 1.4s linear infinite; }
  @keyframes sigIn { to { stroke-dashoffset: 26; } }
  @keyframes sigOut { to { stroke-dashoffset: -26; } }
  .bead { fill: var(--yellow); }
  .bead--next { fill: #8a3a5c; stroke: var(--yellow); stroke-width: 1.8; stroke-dasharray: 2.4 2; }
  .node, .cnode { cursor: pointer; }
  .node__hit { fill: transparent; }
  .node__body { fill: #ffe98a; }
  .node__shade { fill: var(--yellow); }
  .node--poor .node__body { fill: #8f7fb8; }
  .node--poor .node__shade { fill: #6c5c9c; }
  .node__pulse { fill: none; stroke: var(--yellow); stroke-width: 3; transform-origin: 0 0; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); stroke-width: 3; } to { transform: scale(1.7); stroke-width: 0; } }
  .node__rank { fill: #1a1440; font: 900 17px var(--font); text-anchor: middle; }
  .node__sel { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 5 6; transform-origin: 0 0; animation: swirl 12s linear infinite; }
  .n-name { fill: #fff; font: 800 12.5px var(--font); text-anchor: middle; letter-spacing: .06em; text-transform: uppercase; paint-order: stroke; stroke: #1a0b3d; stroke-width: 4px; }
  .n-cost { fill: var(--yellow); font: 700 11.5px var(--font); text-anchor: middle; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: #1a0b3d; stroke-width: 4px; }
  .n-cost--poor { fill: #b7a2e8; }
  .n-name--l, .n-cost--l { text-anchor: start; }
  .n-name--r, .n-cost--r { text-anchor: end; }
  .myel { fill: #34207a; }
  .myel--on { fill: var(--orange); }
  .myel--next { fill: #34207a; stroke: var(--yellow); stroke-width: 1.6; stroke-dasharray: 3 2.5; }
  .ranvier { fill: #1a0b3d; stroke: #ff9cc4; stroke-width: 1.6; }
  .ranvier--on { fill: var(--cyan); stroke: none; }
  .n-mile { fill: #e9dcff; font: 800 11px var(--font); text-anchor: end; paint-order: stroke; stroke: #1a0b3d; stroke-width: 3px; }
  .n-mile--r { text-anchor: start; }
  .n-mile--on { fill: var(--cyan); }
  .n-mile--sub { font-weight: 600; font-size: 10px; fill: #b7a2e8; }
  .org { fill: #542b53; }
  .org__mid { fill: #733c4f; }
  .org__in { fill: none; stroke: #a4655e; stroke-width: 3; stroke-linecap: round; }

  /* Erzeugungs-Ausbauten der Kette: Orange wie die Schwarm-Ebene, im Knoten die erzeugte Einheit */
  .cdend { fill: none; stroke: var(--orange); stroke-width: 11; stroke-linecap: round; }
  .cdend--glow { stroke: #4f2147; stroke-width: 30; }
  .cdend--core { stroke: #ffd0a8; stroke-width: 3.5; }
  .cdend--locked { stroke: #5d3f8f; stroke-dasharray: 2 9; }
  .cnode__body { fill: #2a1462; }
  .cnode__ring { fill: none; stroke: var(--orange); stroke-width: 3.5; }
  .cnode__pulse { fill: none; stroke: var(--orange); stroke-width: 3; transform-origin: 0 0; animation: pulse 2.2s ease-out infinite; }
  .cnode__badge { fill: var(--yellow); stroke: #1a0b3d; stroke-width: 2.5; }
  .cnode__rank { fill: #1a1440; font: 900 11px var(--font); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .cnode--locked .cnode__ring { stroke: #8a6cc8; stroke-dasharray: 4 4; }
  .cnode--locked .cnode__icon { opacity: .35; }
  .cnode--locked .cnode__badge { fill: #5d4a95; }
  .c-cost { fill: #ffb27a; }

  /* ---------- Bedienoberfläche ---------- */
  .hud { position: absolute; z-index: 5; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: grid; grid-template-columns: 1.4fr 1fr 1.1fr; gap: 6px; pointer-events: none; }
  .pill { background: #171d58; border-radius: 16px; padding: 7px 11px 8px; box-shadow: 0 4px 0 #080a26; min-width: 0; }
  .pill__k { font-size: 9.5px; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: .1em; }
  .pill__k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .pill__k em { margin-left: auto; font-style: normal; letter-spacing: .02em; text-transform: none; font-size: 10.5px; color: #8890d0; white-space: nowrap; }
  .pill__v { font-size: 17px; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill__s { font-size: 10.5px; font-weight: 800; color: #8890d0; white-space: nowrap; line-height: 1; margin-top: 2px; }
  .pill__bar { height: 5px; border-radius: 3px; background: #0c0f33; margin-top: 4px; overflow: hidden; }
  .pill__bar span { display: block; height: 100%; border-radius: 3px; background: var(--lime); }

  .ctx { position: absolute; z-index: 5; left: 12px; right: 58px; top: calc(80px + env(safe-area-inset-top)); height: 40px; display: flex; align-items: center; gap: 8px; background: #171d58; border-radius: 20px; padding: 0 6px 0 10px; font-size: 13px; box-shadow: 0 4px 0 #080a26; }
  .ctx b { font-weight: 900; }
  .ctx .sub { color: var(--muted); font-size: 12px; font-weight: 600; }
  .ctx .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; font-weight: 900; border-radius: 12px; padding: 5px 10px; white-space: nowrap; color: #1a1440; }
  .tag--pink { background: var(--pink); color: #fff; }
  .menu-btn { position: absolute; z-index: 5; right: 12px; top: calc(80px + env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 50%; background: var(--panel); box-shadow: 0 4px 0 #080a26; display: grid; place-items: center; }
  .chips { position: absolute; z-index: 5; left: 12px; right: 64px; top: calc(130px + env(safe-area-inset-top)); display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none; }
  .chip { font-size: 10.5px; font-weight: 900; border-radius: 10px; padding: 4px 8px; background: #0c0f33; color: #a7aee8; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }

  .views { position: absolute; z-index: 5; right: 12px; top: calc(134px + env(safe-area-inset-top)); display: grid; gap: 10px; }
  .views__btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; filter: grayscale(.75) brightness(.7); }
  .views__btn--pink { background: var(--pink); box-shadow: 0 4px 0 #b52a5e; }
  .views__btn--orange { background: var(--orange); box-shadow: 0 4px 0 #b9561a; }
  .views__btn--cyan { background: var(--cyan); box-shadow: 0 4px 0 #1a9a96; }
  .views__btn[aria-pressed="true"] { filter: none; outline: 2px solid var(--pink); outline-offset: 3px; }

  .sheet {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
    padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
    background: #24104f; border-radius: 28px 28px 0 0; box-shadow: 0 -6px 0 #080a26; cursor: default;
  }
  .sheet__grip { display: block; position: relative; width: 100%; height: 26px; margin: -14px 0 4px; }
  .sheet__grip::before { content: ""; position: absolute; left: 50%; top: 10px; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: #434676; }

  .seg { display: flex; background: #0c0f33; border-radius: 14px; padding: 3px; }
  .seg button { font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 11px; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #1a1440; }
  .seg--grp button[aria-pressed="true"][data-grp="kette"] { background: var(--orange); }
  .seg--grp button[aria-pressed="true"][data-grp="schwarm"] { background: var(--pink); color: #fff; }

  .up { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
  .up h2 { font-size: 19px; font-weight: 900; line-height: 1.15; }
  .up__kick { grid-column: 1 / -1; font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #ffb27a; }
  .up__rank { font-size: 11.5px; font-weight: 900; background: var(--pink); color: #fff; border-radius: 12px; padding: 4px 10px; white-space: nowrap; }
  .up__rank--chain { background: var(--orange); color: #1a1440; }
  .up__fx { display: grid; grid-template-columns: auto 1fr; align-content: start; gap: 5px 12px; margin: 10px 0 12px; font-size: 13.5px; min-height: calc(4 * 1.35em + 3 * 5px); }
  .up__fx dt { color: #c0a8ee; font-weight: 600; }
  .up__fx dd { font-weight: 800; }
  .up__fx dd em { font-style: normal; color: var(--yellow); }
  .up__fx dd small { font-weight: 600; color: #c0a8ee; }
  .up__fx dd .warn { color: #ffa3c2; }
  .up__tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 12px; }
  .up__tabs button { font-size: 11.5px; font-weight: 900; padding: 6px 4px; border-radius: 11px; background: #170a36; color: #c0a8ee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .up__tabs button[aria-pressed="true"] { background: var(--pink); color: #fff; }
  .up__tabs button[aria-pressed="true"].is-chain { background: var(--orange); color: #1a1440; }
  .up__tabs button[aria-disabled="true"] { opacity: .5; }
  .up__tabs--chain button { flex-direction: column; gap: 1px; padding: 5px 2px 4px; font-size: 10.5px; }
  .buy { min-width: 92px; border-radius: 14px; padding: 6px 10px 5px; text-align: center; background: var(--yellow); color: #1a1440; box-shadow: 0 3px 0 #c99700; }
  .buy b { display: block; font-size: 15px; font-weight: 900; line-height: 1.1; }
  .buy span { display: block; font-size: 10.5px; font-weight: 800; color: #53443f; white-space: nowrap; }
  .buy[aria-disabled="true"] { background: var(--panel-3); color: var(--muted); box-shadow: 0 3px 0 #1a2060; }
  .buy[aria-disabled="true"] span { color: #8890d0; }
  .buy--chain { background: var(--orange); box-shadow: 0 3px 0 #b9561a; }
  .buy--chain span { color: #4a2108; }
  .buy--wide { display: flex; width: 100%; justify-content: center; align-items: baseline; gap: 8px; padding: 12px 11px 11px; border-radius: 16px; }
  .buy--wide b { display: inline; font-size: 16px; }
  .buy--wide span { display: inline; font-size: 12.5px; }
  .ico { display: inline-block; vertical-align: -3px; }
  .note { font-size: 11.5px; color: #c0a8ee; font-weight: 600; margin: -4px 2px 10px; }
  .ctx .seg { padding: 2px; }
  .ctx .seg button { padding: 4px 10px; font-size: 11.5px; }
  .kaxon { stroke-width: 8; }
  .syn { fill: var(--orange); stroke: #4f2147; stroke-width: 6; }
  .syn__in { fill: #ffd0a8; }
  .syn__lab { text-anchor: middle; }
  .kn__title { fill: #ffb27a; }
  .trade { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0 8px; }
  .trade > div { background: #170a36; border-radius: 14px; padding: 8px 10px 9px; }
  .trade h3 { font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #c0a8ee; }
  .trade p { font-size: 14.5px; font-weight: 900; margin: 1px 0; }
  .trade small { display: block; font-size: 11.5px; font-weight: 600; color: #c0a8ee; }
  .trade > div:last-child h3 { color: #ffb27a; }
  .verdict { font-size: 12.5px; font-weight: 700; margin: 0 2px 12px; }
  .verdict b { font-weight: 900; }
  .verdict--good { color: var(--lime); }
  .verdict--bad { color: #ffa3c2; }
  .soma-hit { cursor: pointer; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
      <clipPath id="cFress"><path id="pFress" d="M9 0C9-3.2 5-4.6 0-4.4C-6-4.2-9.5-3-9.5 0C-9.5 3-6 4.4-1 4.2C1 4.1 2 2.4 3.6 2.6C5.6 2.9 9 3 9 0Z"/></clipPath>
      <clipPath id="cBrut"><circle r="15"/></clipPath>
      <g id="fress">
      <use href="#pFress" fill="#6e2a12" stroke="#6e2a12" stroke-width="2.8" stroke-linejoin="round"/>
      <use href="#pFress" fill="#ffb27a"/>
      <g clip-path="url(#cFress)"><use href="#pFress" fill="#ff8a3d" transform="translate(.7 1)"/></g>
      <path d="M-1.5 3.3C.8 3.2 1.9 1.7 3.6 1.8" fill="none" stroke="#6e2a12" stroke-width=".9" stroke-linecap="round"/>
      </g>
      <g id="brut">
      <circle r="18.5" fill="#7a2560"/>
      <circle r="15" fill="#ff9cc4"/>
      <g clip-path="url(#cBrut)"><circle cx="2.2" cy="2.8" r="15" fill="#ff4f8b"/><circle cx="3" cy="22" r="13" fill="#d8336f"/></g>
      <circle cx="-4.5" cy="-3" r="3.6" fill="#ffd23f"/><circle cx="-5.5" cy="-4" r="1.1" fill="#fff4b8"/>
      <circle cx="4.5" cy="-1.5" r="3.2" fill="#ffd23f"/><circle cx="3.6" cy="-2.5" r="1" fill="#fff4b8"/>

      <ellipse rx="22" ry="17" fill="#4b2a8f"/>
      <ellipse rx="19" ry="14.5" fill="#c7a6ff"/>

      <g fill="#ffd23f"><circle cx="-9" cy="0" r="3.2"/><circle cx="-2" cy="-4.5" r="3.2"/><circle cx="6" cy="-1.5" r="3.2"/><circle cx="-1.5" cy="4" r="3.2"/><circle cx="6.5" cy="6.5" r="2.6"/></g>

      <g fill="#ffd23f"><circle cx="-10" cy="-6" r="9"/><circle cx="8" cy="-9" r="8.5"/><circle cx="11" cy="8" r="9"/><circle cx="-8" cy="11" r="8.5"/><circle cx="0" cy="0" r="8"/></g>
      <g fill="#ffe98a"><circle cx="-13" cy="-9" r="3"/><circle cx="5" cy="-12" r="2.8"/><circle cx="8" cy="5" r="3"/><circle cx="-11" cy="8" r="2.8"/><circle cx="-2.5" cy="-2.5" r="2.6"/></g>
      </g>
      <g id="bkl">
      <circle r="36" fill="#6a1a6b"/>
      <g fill="#ff4f8b"><circle cx="-14" cy="-10" r="14"/><circle cx="12" cy="-13" r="13"/><circle cx="15" cy="11" r="14"/><circle cx="-11" cy="14" r="13"/><circle r="12"/></g>
      <g fill="#ff9cc4"><circle cx="-18" cy="-14" r="5"/><circle cx="8" cy="-17" r="4.6"/><circle cx="11" cy="7" r="5"/><circle cx="-15" cy="10" r="4.6"/></g>
      <g fill="#ffd23f"><circle cx="-12" cy="-8" r="3"/><circle cx="14" cy="-11" r="3"/><circle cx="17" cy="13" r="3"/><circle cx="-9" cy="16" r="3"/><circle r="3.4"/></g>
      </g>
      <g id="urn">
      <circle r="48" fill="#2a1060"/>
      <circle r="42" fill="#9b6bff"/>
      <circle cx="4" cy="5" r="40" fill="#6c3fd6"/>
      <circle r="27" fill="#ff8a3d"/>
      <circle cx="3" cy="3" r="24" fill="#e5612a"/>
      <g fill="#ffd23f"><circle cx="-8" cy="-6" r="6"/><circle cx="8" cy="-4" r="5.5"/><circle cx="0" cy="9" r="6"/></g>
      <g fill="#fff4b8"><circle cx="-10" cy="-8" r="2"/><circle cx="6" cy="-6" r="1.8"/><circle cx="-2" cy="7" r="2"/></g>
      </g>
  </defs>
</svg>
<div class="app">
  <div class="stage">
    <svg id="neuronSvg" width="1700" height="1400" viewBox="-500 -560 1700 1400" style="left:-500px;top:-560px" aria-label="Ausbauten als Nervenzelle">
      <defs>
        <clipPath id="cNode"><circle r="20"/></clipPath>
        <clipPath id="cSoma"><path d="M38.1 -8C37.2 0.5 36.2 7.8 32.3 15.5C28.4 23.1 22.7 34.4 14.9 37.9C7.1 41.4 -6.1 39.9 -14.5 36.6C-22.9 33.2 -30.5 25.2 -35.5 17.8C-40.5 10.4 -45.3 0.1 -44.7 -8C-44 -16.1 -36.8 -24 -31.6 -31C-26.5 -38 -21.5 -45.7 -13.6 -50C-5.7 -54.2 7.3 -59.1 15.8 -56.7C24.4 -54.3 34.1 -43.6 37.8 -35.5C41.5 -27.3 39 -16.5 38.1 -8Z"/></clipPath>
        <filter id="nBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <rect x="-500" y="-560" width="1700" height="1400" fill="#14082f"/>
      <g id="neuronRings"></g>
      <g id="neuronOrg" filter="url(#nBlur)"></g>
      <g id="neuronG"></g>
    </svg>
  </div>

  <header class="hud">
    <div class="pill">
      <div class="pill__k"><i style="background:var(--lime)"></i>Vorrat<em class="num">/ 22,4 Mio.</em></div>
      <div class="pill__v num">1,94 Mio.</div>
      <div class="pill__bar"><span style="width:9%"></span></div>
    </div>
    <div class="pill">
      <div class="pill__k"><i style="background:var(--yellow)"></i>Eier</div>
      <div class="pill__v num">3.480</div>
      <div class="pill__s num">+119 pro s</div>
    </div>
    <div class="pill">
      <div class="pill__k"><i style="background:var(--orange)"></i>Ernte</div>
      <div class="pill__v num">61,2 Tsd.</div>
      <div class="pill__s">pro Sekunde</div>
    </div>
  </header>

  <div class="ctx"><span class="grow" id="ctxText"></span><span id="ctxRight"><span class="tag tag--pink">Impuls = bezahlbar</span></span></div>
  <button class="menu-btn" aria-label="Menü">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="#a7aee8"><rect x="2" y="3" width="12" height="2" rx="1"/><rect x="2" y="7" width="12" height="2" rx="1"/><rect x="2" y="11" width="12" height="2" rx="1"/></g></svg>
  </button>
  <div class="chips"><span class="chip">↓ Zone 3 · <svg width="8" height="9" viewBox="0 0 8 9" aria-hidden="true"><rect x=".5" y="4" width="7" height="5" rx="1.2" fill="#a7aee8"/><path d="M2 4.2V3a2 2 0 0 1 4 0v1.2" fill="none" stroke="#a7aee8" stroke-width="1.3"/></svg> Antrieb 1 Mio.</span></div>

  <nav class="views" aria-label="Ansicht">
    <button class="views__btn views__btn--cyan" aria-label="Umgebung" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0c0f33" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.8" fill="#0c0f33" stroke="none"/><circle cx="12" cy="12" r="6.5" stroke-dasharray="2 2.8"/><circle cx="12" cy="12" r="10.2"/></svg>
    </button>
    <button class="views__btn views__btn--orange" aria-label="Schwarm" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#0c0f33" aria-hidden="true"><ellipse cx="9" cy="10" rx="3.4" ry="2.5"/><ellipse cx="15.5" cy="8" rx="3" ry="2.2"/><ellipse cx="14" cy="15" rx="3.4" ry="2.5"/><ellipse cx="7.5" cy="16" rx="2.6" ry="2"/></svg>
    </button>
    <button class="views__btn views__btn--pink" aria-label="Ausbau" aria-pressed="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="10" r="3.8" fill="#fff" stroke="none"/><path d="M9.5 7.5L5 3M12 6.4V2M14.6 7.6L19 4M12 13.6V19M12 19l-3 3M12 19l3 3M8.5 11.5L3.5 13M15.5 11.5l5 1.5"/></svg>
    </button>
  </nav>

  <section class="sheet" aria-label="Ausbau">
    <div class="sheet__grip"></div>
    <div id="sheetBody"></div>
  </section>
</div>
<script>
  // Nur für das Mockup: fester Spielstand in Zone 2 Felsenbecken, keine Spiellogik.
  const $ = (id) => document.getElementById(id);
  const app = document.querySelector('.app');

  const SUFFIX = ['', 'Tsd.', 'Mio.', 'Mrd.', 'Bio.'];
  const dec = (n, d) => n.toFixed(d).replace('.', ',').replace(/,0+$/, '');
  const group = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  function fmt(n) {
    if (n < 0) return '−' + fmt(-n);
    if (n < 100) return dec(Math.floor(n * 10) / 10, 1);
    if (n < 10000) return group(Math.floor(n));
    const e = Math.min(SUFFIX.length - 1, Math.floor(Math.log10(n) / 3)), v = n / 10 ** (e * 3);
    return (v < 100 ? dec(Math.floor(v * 10) / 10, 1) : group(Math.floor(v))) + ' ' + SUFFIX[e];
  }
  const pct = (x) => (x < 0.1 ? dec(Math.round(x * 1000) / 10, 1) : group(x * 100)) + '\u00a0%';

  const SCHWARM = ['herd', 'verd', 'geis', 'kropf'];
  const KETTE = ['fress', 'brut', 'etr', 'gel'];
  const UP = {
    herd: { name: 'Brutherd', rank: 9, cost: '590 Tsd. Vorrat', ok: true, fx: [['Eier-Rate', '119 → <em>202</em> /s'], ['Aktuell', '119 Eier/s <small>ohne Boni</small>']] },
    verd: { name: 'Verdauung', rank: 6, cost: '4,7 Mio. Vorrat', ok: false, fx: [['Fressleistung', '11,3 → <em>17</em> /s je Fressling'], ['Appetit', '20,5 Mio. → <em>30,7 Mio.</em> /s']] },
    geis: { name: 'Geißeln', rank: 12, cost: '1,6 Mio. Vorrat', ok: true, fx: [['Antrieb', '57,8 Tsd. → <em>104 Tsd.</em>'], ['Reichweite', '420 KP <small>· 490 KP ab Rang 15</small>'], ['Reisetempo', 'steigt mit dem Antrieb <small>(P1-REI-02)</small>'], ['Zone 3', 'ab Antrieb 1 Mio. <small>· noch 5 Ränge</small>']] },
    kropf: { name: 'Kropf', rank: 23, cost: '1,9 Mio. Vorrat', ok: true, fx: [['Kapazität', '22,4 Mio. → <em>33,7 Mio.</em>'], ['Vorrat', '1,94 Mio. <small>· darüber kommt nur der Anteil C/V an</small>']] },
  };
  // Erzeugungs-Ausbau (Spezifikation 4.3, P1-AUS-05): Die erzeugende Stufe zahlt mit sich selbst,
  // Rang l kostet 2^l Einheiten, Wirkung (1 + l) × Grundwert.
  const CH = {
    fress: { of: 'Fresslingen', pl: 'Fresslinge', icon: 'fress', by: 'brut', one: 'Brutling', many: 'Brutlinge', dat: 'Brutlingen', short: 'B.', base: 2, rank: 9, stock: 46200 },
    brut: { of: 'Brutlingen', pl: 'Brutlinge', icon: 'brut', by: 'etr', one: 'Eiträgerin', many: 'Eiträgerinnen', dat: 'Eiträgerinnen', short: 'Et.', base: 3, rank: 5, stock: 1310 },
    etr: { of: 'Eiträgerinnen', pl: 'Eiträgerinnen', icon: 'etr', by: 'gel', one: 'Gelege', many: 'Gelege', dat: 'Gelegen', short: 'G.', base: 4, rank: 1, stock: 3 },
    gel: { of: 'Gelegen', pl: 'Gelege', icon: 'gel', by: 'bkl', one: 'Brutklumpen', many: 'Brutklumpen', dat: 'Brutklumpen', short: 'Bk.', base: 5, rank: 0, stock: 0 },
  };
  const ICON_SCALE = { fress: 1.15, brut: .66, etr: .58, gel: .46, bkl: .34 };
  const costOf = (l) => 2 ** l;
  const perOf = (c, l) => c.base * (1 + l);
  const units = (c, n) => `${fmt(n)} ${n === 1 ? c.one : c.many}`;
  const locked = (k) => CH[k] && CH[k].stock === 0;
  const affordable = (k) => (UP[k] ? UP[k].ok : CH[k].stock >= costOf(CH[k].rank));
  // Kauf nach Modus: '1' = ein Rang, '10'/'50' = so viele Ränge, wie in diesen Anteil der Einheiten passen
  function plan(k, mode = '1') {
    const c = CH[k], cap = mode === '1' ? c.stock : c.stock * (+mode / 100);
    let n = 0, cost = 0;
    while (cost + costOf(c.rank + n) <= cap && (mode !== '1' || n === 0)) { cost += costOf(c.rank + n); n++; }
    const perNow = perOf(c, c.rank), perTo = perOf(c, c.rank + n);
    return { n, cost, to: c.rank + n, perNow, perTo, totalNow: c.stock * perNow, totalTo: (c.stock - cost) * perTo, share: c.stock ? cost / c.stock : 0, next: costOf(c.rank) };
  }

  let sel = 'fress', mode = '1';
  const last = { schwarm: 'geis', kette: 'fress' };
  const groupOf = (k) => (SCHWARM.includes(k) ? 'schwarm' : 'kette');

  /* ---------- SVG-Bausteine ---------- */
  const SOMA = 'M38.1 -8C37.2 0.5 36.2 7.8 32.3 15.5C28.4 23.1 22.7 34.4 14.9 37.9C7.1 41.4 -6.1 39.9 -14.5 36.6C-22.9 33.2 -30.5 25.2 -35.5 17.8C-40.5 10.4 -45.3 0.1 -44.7 -8C-44 -16.1 -36.8 -24 -31.6 -31C-26.5 -38 -21.5 -45.7 -13.6 -50C-5.7 -54.2 7.3 -59.1 15.8 -56.7C24.4 -54.3 34.1 -43.6 37.8 -35.5C41.5 -27.3 39 -16.5 38.1 -8Z';
  const qb = (p0, c, p1, t) => [(1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * c[0] + t * t * p1[0], (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * c[1] + t * t * p1[1]];
  function soma(x = 0, y = 0, tone = 'pink') {
    const P = tone === 'pink'
      ? ['#461d6a', '#64256f', '#ff9cc4', '#ff4f8b', '#6a1a6b', '#4b0f55', '#ff9cc4']
      : ['#4a1f4a', '#6e2f52', '#ffd0a8', '#ff8a3d', '#7a2e1c', '#561a10', '#ffd0a8'];
    return `<g transform="translate(${x} ${y})"><circle cx="0" cy="-8" r="84" fill="${P[0]}"/><circle cx="0" cy="-8" r="62" fill="${P[1]}"/>
      <path d="${SOMA}" fill="${P[2]}"/><path d="${SOMA}" fill="${P[3]}" transform="translate(4.5 6)" clip-path="url(#cSoma)"/>
      <circle cx="4" cy="-6" r="17" fill="${P[4]}"/><circle cx="6" cy="-4" r="17" fill="${P[5]}" clip-path="circle(17px at -2px -2px)"/><circle cx="9" cy="-11" r="5" fill="${P[6]}"/></g>`;
  }
  function dendrite(D, chain = false, off = false) {
    const p = `M${D.p0}Q${D.c} ${D.p1}`, c = chain ? 'cdend' : 'dend';
    return `<path class="${c} ${c}--glow" d="${p}"/><path class="${c}${off ? ' cdend--locked' : ''}" d="${p}"/>${off ? '' : `<path class="${c} ${c}--core" d="${p}"/><path class="sig sig--in" d="${p}"/>`}`;
  }
  function beads(D, rank) {
    let h = '';
    const shown = Math.min(rank, 5);
    for (let i = 0; i <= shown; i++) {
      const [x, y] = qb(D.p0, D.c, D.p1, 0.22 + (i / 6) * 0.66);
      h += `<circle class="bead${i === shown ? ' bead--next' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.6"/>`;
    }
    return h;
  }
  function node(k, x, y) {
    const U = UP[k];
    return `<g class="node${U.ok ? '' : ' node--poor'}" data-up="${k}" transform="translate(${x} ${y})"><circle class="node__hit" r="34"/>${sel === k ? '<circle class="node__sel" r="28"/>' : ''}${U.ok ? '<circle class="node__pulse" r="21"/>' : ''}<circle class="node__body" r="20"/><g clip-path="url(#cNode)"><circle class="node__shade" cx="3.5" cy="4.5" r="20"/></g><text class="node__rank" y="5.5">${U.rank}</text></g>`;
  }
  // Knoten eines Erzeugungs-Ausbaus: die erzeugte Einheit im Kreis, der Rang als Marke unten rechts
  function cnode(k, x, y, r = 20) {
    const c = CH[k], off = locked(k), ok = affordable(k), s = r / 20;
    return `<g class="cnode${off ? ' cnode--locked' : ''}" data-up="${k}" transform="translate(${x} ${y})"><circle class="node__hit" r="${r + 14}"/>${sel === k ? `<circle class="node__sel" r="${r + 8}"/>` : ''}${ok ? `<circle class="cnode__pulse" r="${r + 1}"/>` : ''}<circle class="cnode__body" r="${r}"/><circle class="cnode__ring" r="${r}"/>
      <use class="cnode__icon" href="#${c.icon}" transform="scale(${(ICON_SCALE[c.icon] * s).toFixed(3)})"/>
      <g transform="translate(${(r * .72).toFixed(1)} ${(r * .72).toFixed(1)})"><rect class="cnode__badge" x="-11" y="-8.5" width="22" height="17" rx="8.5"/><text class="cnode__rank" y="4">${off ? '–' : c.rank}</text></g></g>`;
  }
  function label(k, x, y, align = '') {
    const a = align ? ` n-name--${align}` : '', b = align ? ` n-cost--${align}` : '';
    if (UP[k]) return `<text class="n-name${a}" x="${x}" y="${y}">${UP[k].name}</text><text class="n-cost${b}${UP[k].ok ? '' : ' n-cost--poor'}" x="${x}" y="${y + 15}">${UP[k].cost}</text>`;
    const c = CH[k], cost = locked(k) ? `ab 1 ${c.one}` : units(c, costOf(c.rank));
    return `<text class="n-name${a}" x="${x}" y="${y}">${c.pl}</text><text class="n-cost c-cost${b}${affordable(k) ? '' : ' n-cost--poor'}" x="${x}" y="${y + 15}">${cost}</text>`;
  }
  // Achse mit Geißeln wie im Prototyp; side: Seite der Reichweiten-Beschriftung
  function axon(side = 'l') {
    const l = UP.geis.rank, ev = 3, base = Math.max(0, (Math.floor(l / ev) - 1) * ev), r = side === 'r';
    let h = '<path class="axon axon--glow" d="M0 32V196"/><path class="axon" d="M0 32V196"/><path class="sig sig--out" d="M0 32V196"/>';
    [42, 62, 82, 114, 134, 154].forEach((y, j) => { const rk = base + j + 1; h += `<rect class="myel${rk <= l ? ' myel--on' : rk === l + 1 ? ' myel--next' : ''}" x="-8" y="${y}" width="16" height="17" rx="7"/>`; });
    [105.5, 177.5].forEach((y, i) => {
      const m = base + ev * (i + 1), on = l >= m, x = r ? 18 : -18, c = r ? ' n-mile--r' : '';
      h += `<circle class="ranvier${on ? ' ranvier--on' : ''}" cx="0" cy="${y}" r="4"/><text class="n-mile${on ? ' n-mile--on' : ''}${c}" x="${x}" y="${y - 2.5}">${on ? 'Reichweite ' : ''}${fmt(140 + 70 * Math.floor(m / ev))} KP</text><text class="n-mile n-mile--sub${c}" x="${x}" y="${y + 10.5}">${on ? 'erreicht mit' : 'ab'} Rang ${m}</text>`;
    });
    h += '<path class="twig twig--term" d="M0 196Q-18 214-34 222M0 196Q18 216 30 230"/>';
    return h + node('geis', 0, 218) + label('geis', 34, 214, 'l');
  }
  // Die drei Dendriten des Prototyps; Kropf wahlweise rechts (Prototyp) oder oben rechts (Mockup 5d)
  const DEND = {
    herd: { p0: [-26, -40], c: [-96, -62], p1: [-118, -138], lab: [-118, -182] },
    verd: { p0: [4, -54], c: [-14, -100], p1: [12, -150], lab: [12, -194] },
    kropf: { p0: [32, -20], c: [84, -6], p1: [118, -44], lab: [118, 0] },
  };
  const KROPF_HIGH = { p0: [30, -34], c: [104, -50], p1: [126, -128], lab: [126, -172] };
  function classic(D = DEND) {
    let h = '<path class="twig" d="M-70 -78Q-150 -70 -200 -40"/><path class="twig" d="M-110 -118Q-170 -150 -190 -205"/><path class="twig" d="M8 -120Q60 -170 70 -230"/><path class="twig" d="M120 -110Q170 -150 205 -190"/>';
    for (const k of ['herd', 'verd', 'kropf']) h += dendrite(D[k]) + beads(D[k], UP[k].rank) + node(k, ...D[k].p1) + label(k, ...D[k].lab);
    return h;
  }
  function organelles(spread = [1000, 1200], dx = 0) {
    let seed = 99;
    const R = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
    let h = '';
    const spots = [[-150, -260, 46], [170, -300, 34], [-180, 200, 52], [160, 140, 40], [-60, 330, 60], [200, 330, 30], [-210, -60, 26], [210, -40, 28], [40, 560, 44], [-190, 520, 34], [190, 640, 50]];
    for (const [x, y, w] of spots) {
      const hh = w / 2, a = Math.round(R() * 180 - 90);
      let wave = `M${-w * .7} 0`;
      for (let i = 0; i < 4; i++) wave += `q${(w * .17).toFixed(1)} ${(-w * .3).toFixed(1)} ${(w * .35).toFixed(1)} 0`;
      h += `<g transform="translate(${x + dx} ${y}) rotate(${a})"><rect x="${-w}" y="${-hh}" width="${w * 2}" height="${w}" rx="${hh}" class="org"/><rect x="${-w + 5}" y="${-hh + 5}" width="${w * 2 - 10}" height="${w - 10}" rx="${hh - 5}" class="org__mid"/><path d="${wave}" class="org__in"/></g>`;
    }
    h += '<g fill="#3a1f54">';
    for (let i = 0; i < 60; i++) h += `<circle cx="${((R() - .5) * spread[0] + dx).toFixed(0)}" cy="${((R() - .3) * spread[1]).toFixed(0)}" r="${(2.4 + R() * 5.5).toFixed(1)}"/>`;
    return h + '</g>';
  }
  const icon = (id, size = 18) => `<svg class="ico" width="${size}" height="${size}" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#${id}" transform="scale(${(ICON_SCALE[id] * 1.45).toFixed(2)})"/></svg>`;

  /* ---------- Blatt ---------- */
  const grpSeg = (g) => `<div class="seg seg--grp" role="group" aria-label="Bereich"><button data-grp="schwarm" aria-pressed="${g === 'schwarm'}">Schwarm</button><button data-grp="kette" aria-pressed="${g === 'kette'}">Kette</button></div>`;
  const tabs = (keys) => `<div class="up__tabs${CH[keys[0]] ? ' up__tabs--chain' : ''}">${keys.map((k) => `<button data-sel="${k}" aria-pressed="${k === sel}" class="${CH[k] ? 'is-chain' : ''}"${locked(k) ? ' aria-disabled="true"' : ''}>${UP[k] ? UP[k].name : `${icon(CH[k].icon, 16)}${CH[k].pl}`}</button>`).join('')}</div>`;
  function classicBody(k) {
    const U = UP[k];
    return `<div class="up"><h2>${U.name}</h2><div class="up__rank num">Rang ${U.rank} → ${U.rank + 1}</div></div>
      <dl class="up__fx num">${U.fx.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
      <button class="buy buy--wide num" aria-disabled="${!U.ok}"><b>Ausbauen</b><span>${U.cost}</span></button>`;
  }
  function chainHead(k, p) {
    const c = CH[k];
    return `<div class="up"><div class="up__kick">Erzeugung von</div><h2>${c.of}</h2><div class="up__rank up__rank--chain num">${locked(k) ? 'gesperrt' : `Rang ${c.rank} → ${p.n > 0 ? p.to : c.rank + 1}`}</div></div>`;
  }
  function lockedBody(k) {
    const c = CH[k];
    return `${chainHead(k, { n: 0 })}<dl class="up__fx num"><dt>Erzeugt von</dt><dd>${c.many} <small>· ${c.base} ${c.pl}/s je ${c.one}</small></dd><dt>Freischaltung</dt><dd>mit dem ersten ${c.one}</dd><dt>Erster Rang</dt><dd>1 ${c.one} <small>· +100 % Erzeugung</small></dd></dl>
      <button class="buy buy--wide buy--chain num" aria-disabled="true"><b>Ausbauen</b><span>noch kein ${c.one}</span></button>`;
  }

  /* ---------- Darstellen und Verschieben ---------- */
  function render() {
    $('neuronG').innerHTML = V.svg();
    $('sheetBody').innerHTML = V.sheet();
    const n = [...SCHWARM, ...KETTE].filter(affordable).length;
    $('ctxText').innerHTML = `<b>Ausbau</b> <span class="sub num">· ${n}/8 bezahlbar</span>`;
    if (V.ctx) V.ctx();
  }
  let pan = { x: 0, y: 0 }, home = { x: 0, y: 0 }, drag = null;
  const REACH = 170;
  let mid = 0;
  function setPan(x, y) {
    if (V.area) {
      // Frei verschiebbar, unabhängig von der Auswahl: Jeder Punkt des Bereichs lässt sich in die Mitte holen
      const sc = V.scale || 1, [x0, x1, y0, y1] = V.area, cy = mid - app.clientHeight * 0.4;
      pan = { x: Math.min(-x0 * sc, Math.max(-x1 * sc, x)), y: Math.min(cy - y0 * sc, Math.max(cy - y1 * sc, y)) };
    } else {
      let dx = x - home.x, dy = y - home.y;
      const len = Math.hypot(dx, dy);
      if (len > REACH) { dx *= REACH / len; dy *= REACH / len; }
      pan = { x: home.x + dx, y: home.y + dy };
    }
    app.style.setProperty('--px', pan.x + 'px');
    app.style.setProperty('--py', pan.y + 'px');
  }
  // Gewählten Ausbau in die Mitte der freien Fläche zwischen Kontextzeile und Blatt schieben
  function focusSel() {
    const H = app.clientHeight, ctx = document.querySelector('.chips');
    const top = ctx.offsetTop + 20, bottom = document.querySelector('.sheet').offsetTop;
    const [nx, ny] = V.pos(sel), sc = V.scale || 1;
    mid = (top + bottom) / 2;
    // waagrecht nur teilweise zur Mitte, damit möglichst viel vom Neuron sichtbar bleibt
    home = { x: -nx * sc * (V.hx ?? .6), y: (top + bottom) / 2 - H * 0.4 - ny * sc };
    setPan(home.x, home.y);
  }
  function select(k) {
    if (locked(k) && !V.lockedSelectable) return;
    sel = k;
    last[groupOf(k)] = k;
    render();
    focusSel();
  }
  app.addEventListener('click', (e) => {
    const t = e.target.closest('[data-sel], [data-grp], [data-mode]');
    if (!t) return;
    if (t.dataset.sel) select(t.dataset.sel);
    else if (t.dataset.grp) select(last[t.dataset.grp]);
    else { mode = t.dataset.mode; render(); }
  });
  app.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.sheet, .hud, .ctx, .menu-btn, .views')) return;
    drag = { id: e.pointerId, x: e.clientX - pan.x, y: e.clientY - pan.y, sx: e.clientX, sy: e.clientY, moved: false };
    app.setPointerCapture(e.pointerId);
  });
  app.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; app.classList.add('panning'); }
    if (drag.moved) setPan(e.clientX - drag.x, e.clientY - drag.y);
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const tap = !drag.moved;
    drag = null;
    app.classList.remove('panning');
    if (tap && e.type === 'pointerup') {
      const el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest('[data-up], [data-soma]');
      if (t) select(t.dataset.up || last[t.dataset.soma]);
    }
  };
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);
  app.addEventListener('wheel', (e) => {
    if (e.target.closest('.sheet')) return;
    e.preventDefault();
    app.classList.add('panning');
    setPan(pan.x - e.deltaX, pan.y - e.deltaY);
    clearTimeout(app._w);
    app._w = setTimeout(() => app.classList.remove('panning'), 120);
  }, { passive: false });
  addEventListener('resize', focusSel);
  const rings = (x = 0, y = -8) => `<g transform="translate(${x} ${y})"><circle r="640" fill="#1a0b3d"/><circle r="470" fill="#210f4a"/><circle r="320" fill="#291358"/><circle r="190" fill="#311766"/></g>`;
  function boot() {
    app.style.setProperty('--sc', V.scale || 1);
    $('neuronRings').innerHTML = V.rings ? V.rings() : rings();
    $('neuronOrg').innerHTML = organelles(V.orgSpread, V.orgDx || 0) + (V.orgExtra ? V.orgExtra() : '');
    if (V.start) sel = V.start;
    last[groupOf(sel)] = sel;
    render();
    app.classList.add('panning');
    focusSel();
    requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('panning')));
  }
  // Variante C: Neben dem Schwarm-Neuron liegt ein eigenes Ketten-Neuron, dessen Axon in einer Synapse
  // am Schwarm-Neuron endet. Der Schalter in der Kontextzeile oder ein Tipp auf einen Zellkörper wechselt
  // zwischen beiden; verschieben lässt sich die Ansicht unabhängig von der Auswahl über beide Neuronen.
  const KX = 380;
  const CD = {
    fress: { p0: [KX - 22, -44], c: [KX - 70, -84], p1: [KX - 104, -150], lab: [KX - 104, -194] },
    brut: { p0: [KX + 22, -44], c: [KX + 70, -84], p1: [KX + 104, -150], lab: [KX + 104, -194] },
    etr: { p0: [KX - 22, 28], c: [KX - 70, 76], p1: [KX - 104, 140], lab: [KX - 104, 184] },
    gel: { p0: [KX + 22, 28], c: [KX + 70, 76], p1: [KX + 104, 140], lab: [KX + 104, 184] },
  };
  const V = {
    orgSpread: [1400, 1200],
    orgDx: 190,
    scale: .85,
    hx: 1,
    area: [-110, KX + 110, -170, 210],
    rings: () => rings(0) + rings(KX),
    pos(k) {
      if (CH[k]) { const [x, y] = CD[k].p1; return [KX + 20 + (x - KX) * .3, y * .45]; }
      const [x, y] = k === 'geis' ? [0, 218] : DEND[k].p1;
      return [x * .35, y * .45];
    },
    svg() {
      let h = classic() + axon('l') + `<g data-soma="schwarm" class="soma-hit">${soma()}</g>`;
      // Axon des Ketten-Neurons mit Synapse am Schwarm-Neuron
      const ax = `M${KX - 56} 2Q200 62 82 42`;
      h += `<path class="cdend cdend--glow" d="${ax}"/><path class="cdend kaxon" d="${ax}"/><path class="sig sig--out" d="${ax}"/><circle cx="78" cy="40" r="11" class="syn"/><circle cx="78" cy="40" r="5" class="syn__in"/>`;
      h += `<text class="n-mile n-mile--sub syn__lab" x="196" y="74">Synapse</text>`;
      for (const k of KETTE) h += dendrite(CD[k], true, locked(k)) + (locked(k) ? '' : beads(CD[k], CH[k].rank)) + cnode(k, ...CD[k].p1) + label(k, ...CD[k].lab);
      h += `<g data-soma="kette" class="soma-hit">${soma(KX, 0, 'orange')}</g>`;
      h += `<text class="n-name kn__title" x="${KX}" y="-112">Kette</text>`;
      return h;
    },
    ctx() { $('ctxRight').innerHTML = grpSeg(groupOf(sel)); },
    sheet() {
      const g = groupOf(sel);
      let h = tabs(g === 'kette' ? KETTE : SCHWARM);
      if (g === 'schwarm') return h + classicBody(sel);
      if (locked(sel)) return h + lockedBody(sel);
      const c = CH[sel], p = plan(sel, '1'), keep = p.next * p.perNow, gain = (c.stock - p.next) * c.base, net = gain - keep;
      const need = p.next * (c.rank + 2);
      h += chainHead(sel, p);
      h += `<div class="trade num">
        <div><h3>Behalten</h3><p>${units(c, p.next)}</p><small>erzeugen ${fmt(keep)} ${c.pl}/s</small></div>
        <div><h3>Opfern</h3><p>+${fmt(c.base)} /s je ${c.one}</p><small>für die übrigen ${fmt(c.stock - p.next)}: +${fmt(gain)} /s</small></div></div>`;
      h += net > 0
        ? `<p class="verdict verdict--good num">Lohnt sich sofort: <b>+${fmt(net)} ${c.pl}/s</b></p>`
        : `<p class="verdict verdict--bad num">Lohnt sich erst ab ${fmt(need)} ${c.dat}, jetzt ${fmt(c.stock)}: <b>${fmt(net)} ${c.pl}/s</b></p>`;
      return h + `<button class="buy buy--wide buy--chain num" aria-disabled="${p.n === 0}"><b>Ausbauen</b><span>${units(c, p.next)} · Rang ${c.rank + 1}</span></button>`;
    },
  };
  boot();
</script>
