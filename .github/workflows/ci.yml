name: CI

# Branch-Modell: Feature-Branches laufen nur über Pull Requests (Prüfung ohne
# Rollout), `development` geht auf GitHub Pages, `main` per SFTP auf den Server.
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    # Das Ereignis gehört zur Gruppe, damit ein manueller Lauf keinen Push-Lauf verdrängt.
    # Push-Läufe auf die Rollout-Branches werden nie abgebrochen.
    concurrency:
      group: ci-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: >-
        ${{ !(github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')) }}
    # Ziel `main` (Push, manueller Lauf, Pull Request) baut `production` ohne Dev-Domäne,
    # alles andere `pages` mit Dev-Domäne wie GitHub Pages. Build und E2E nutzen denselben Wert.
    env:
      BUILD_CONFIGURATION: >-
        ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
        (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
        && 'production' || 'pages' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Versionen und Komponenten-CSS prüfen
        run: npm run check

      - name: Eigene Lint-Regeln und Prüfungen testen
        run: npm run test:tools

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Unit-Tests mit Abdeckung
        run: npm run test:coverage

      - name: Build
        run: npm run build -- --configuration "$BUILD_CONFIGURATION" --base-href /IdleSwarm/

      # GitHub Pages liefert für unbekannte Pfade 404.html aus; so greift das Angular-Routing.
      - name: SPA-Fallback anlegen
        run: cp dist/idle-swarm/browser/index.html dist/idle-swarm/browser/404.html

      # E2E-Smoke gegen genau diesen Build; ohne grünen Lauf kein Deployment.
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npx playwright test
        env:
          E2E_BASE_PATH: /IdleSwarm/
          E2E_BUILD_CONFIGURATION: ${{ env.BUILD_CONFIGURATION }}

      - name: E2E-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Pages-Artefakt hochladen
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/idle-swarm/browser

      - name: Server-Artefakt hochladen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/idle-swarm/browser
          retention-days: 1

  deploy-pages:
    name: Deployment auf GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-server:
    name: Deployment auf den Server (SFTP)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: server
      cancel-in-progress: false
    environment:
      name: production
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PATH: ${{ secrets.SFTP_PATH }}
    steps:
      # Nur für die Apache-Konfiguration; der Build kommt als Artefakt aus `verify`.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Build herunterladen
        uses: actions/download-artifact@v7
        with:
          name: web
          path: site

      # SPA-Fallback und Cache-Regeln für Apache (404.html aus dem Build stört dort nicht).
      - name: Apache-Konfiguration beilegen
        run: cp deploy/apache/.htaccess site/.htaccess

      - name: Secrets prüfen
        run: |
          for name in SFTP_HOST SFTP_USER SFTP_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name fehlt."
              exit 1
            fi
          done
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Secret SFTP_PASSWORD fehlt."
            exit 1
          fi
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Mit dem Secret SFTP_KNOWN_HOSTS (Ausgabe von `ssh-keyscan -p <port> <host>`) ist der
      # Host-Schlüssel festgelegt; ohne es wird er beim Lauf abgefragt (Trust on first use).
      - name: Host-Schlüssel hinterlegen
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Secret SFTP_KNOWN_HOSTS fehlt; der Host-Schlüssel wird per ssh-keyscan übernommen."
            ssh-keyscan -p "${SFTP_PORT:-22}" "$SFTP_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}

      # Erst die gehashten Dateien spiegeln (entfernt veraltete), dann `index.html`: So verweist
      # die Seite nie auf noch fehlende Dateien.
      # Das Passwort kommt nur über LFTP_PASSWORD herein, nie über die Kommandozeile.
      - name: Per SFTP hochladen
        run: |
          lftp --env-password -u "$SFTP_USER" -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes"
          mkdir -p -f "$SFTP_PATH"
          mirror --reverse --delete --parallel=4 --verbose --exclude-glob index.html site/ "$SFTP_PATH"
          cd "$SFTP_PATH"
          put site/index.html -o index.html
          bye
          EOF
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
